name: Merzo Windows Optimizer R51 STABILITY READABILITY

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/build-mwo-r51-stability-readability.yml'
      - 'optimizer/triggers/r51-production.txt'

permissions:
  contents: write

concurrency:
  group: mwo-r51-stability-readability
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Run complete R51 production gates V2
        id: gates
        shell: pwsh
        run: .\optimizer\scripts\r51_release_v2.ps1

      - name: Upload verified R51 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.51-R51-STABILITY-READABILITY
          path: |
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256
            ${{ env.R49_ROOT }}/dist/R51_RELEASE_NOTES.md
          if-no-files-found: error

      - name: Record R51 PASS
        if: success()
        shell: pwsh
        run: |
          '{"status":"success","version":"0.1.51","widgets":"HKCU TaskbarDa regression PASS","operation_readability":"PASS"}' | Set-Content .\optimizer\R51_CI_STATUS.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R51_CI_STATUS.json
          git commit -m 'ci: record R51 production PASS' || echo no-change
          git push || echo status-push-skipped
