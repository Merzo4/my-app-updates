name: Diagnose MWO R55 Process Source

on:
  push:
    branches: [mwo-r55-process-stability]
    paths:
      - '.github/workflows/diag-mwo-r55-process-source.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mwo-r55-process-stability
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate exact inherited R54.2 source
        shell: pwsh
        run: .\optimizer\scripts\r54_2_onedrive_game_reliability_release.ps1
      - name: Capture R55-relevant source excerpts
        shell: pwsh
        run: |
          if([string]::IsNullOrWhiteSpace($env:SOURCE_ROOT)){ throw 'SOURCE_ROOT missing' }
          $root=$env:SOURCE_ROOT
          $out=Join-Path $env:RUNNER_TEMP 'R55_SOURCE_DIAG.txt'
          Set-Content $out "SOURCE_ROOT=$root`n" -Encoding UTF8
          $files=@(
            'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs',
            'src\MerzoOptimizer.App\MainWindow.xaml'
          )
          foreach($rel in $files){
            $p=Join-Path $root $rel
            Add-Content $out "`n===== FILE: $rel ====="
            $lines=Get-Content $p
            $need=@('processCountBefore','processCountAfter','processTargetText','Builds','Startup','Task','Process','ObservableCollection','MainWindowViewModel(')
            $hits=New-Object System.Collections.Generic.HashSet[int]
            for($i=0;$i -lt $lines.Count;$i++){
              foreach($n in $need){ if($lines[$i] -like "*$n*"){ for($j=[Math]::Max(0,$i-35);$j -le [Math]::Min($lines.Count-1,$i+70);$j++){ [void]$hits.Add($j) } } }
            }
            foreach($j in ($hits | Sort-Object)){ Add-Content $out ('{0:D5}: {1}' -f ($j+1),$lines[$j]) }
          }
          Add-Content $out "`n===== WINDOWS SOURCE FILES ====="
          Get-ChildItem (Join-Path $root 'src\MerzoOptimizer.Windows') -Recurse -Filter *.cs | ForEach-Object { $_.FullName.Substring($root.Length+1) } | Sort-Object | Add-Content $out
          Add-Content $out "`n===== CORE SOURCE FILES ====="
          Get-ChildItem (Join-Path $root 'src\MerzoOptimizer.Core') -Recurse -Filter *.cs | ForEach-Object { $_.FullName.Substring($root.Length+1) } | Sort-Object | Add-Content $out
          Copy-Item $out '.\optimizer\R55_SOURCE_DIAG.txt' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R55_SOURCE_DIAG.txt
          git diff --cached --quiet
          if($LASTEXITCODE-ne0){ git commit -m "Record R55 generated-source diagnostics run $env:GITHUB_RUN_ID"; git push origin HEAD:mwo-r55-process-stability }
          Write-Host 'R55_SOURCE_DIAG_PASS'
