name: Inspect R35 gaming for R36

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/inspect-r35-gaming-for-r36.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Restore source and apply through R35
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('inspect.tar.xz',[Convert]::FromBase64String($b.ToString()))
          New-Item -ItemType Directory -Force inspect|Out-Null; tar -xf inspect.tar.xz -C inspect
          $sln=Get-ChildItem inspect -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          $env:SOURCE_ROOT=$sln.Directory.FullName
          "SOURCE_ROOT=$env:SOURCE_ROOT">>$env:GITHUB_ENV
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py')){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}
      - name: Print exact R36 anchors
        shell: pwsh
        run: |
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs';$a=Get-Content $f
          foreach($pattern in @('SelectCategoryProfileAsync','SelectedOptimizationTabIndex','SelectedTweaksText','RefreshTweakViews','private async Task SelectProfileAsync','private async Task ClearTweakSelectionAsync')){
            $m=Select-String -Path $f -Pattern $pattern -SimpleMatch|Select-Object -First 12
            foreach($hit in $m){Write-Host "===== PATTERN $pattern @ $($hit.LineNumber) =====";$s=[Math]::Max(0,$hit.LineNumber-24);$e=[Math]::Min($a.Count-1,$hit.LineNumber+60);for($i=$s;$i-le$e;$i++){Write-Host (("{0:D05}: " -f ($i+1))+$a[$i])}}
          }
          $app=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\App.xaml';$aa=Get-Content $app
          foreach($pattern in @('<SolidColorBrush x:Key="Accent"','<SolidColorBrush x:Key="AccentHover"','<Style x:Key="PrimaryButton"')){
            $m=Select-String -Path $app -Pattern $pattern -SimpleMatch|Select-Object -First 3
            foreach($hit in $m){Write-Host "===== APP $pattern @ $($hit.LineNumber) =====";$s=[Math]::Max(0,$hit.LineNumber-8);$e=[Math]::Min($aa.Count-1,$hit.LineNumber+45);for($i=$s;$i-le$e;$i++){Write-Host (("{0:D05}: " -f ($i+1))+$aa[$i])}}
          }
