name: Publish MWO R51 OTA

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/publish-mwo-r51-ota.yml']

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Download exact verified R51 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p r51-release
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9323114808/zip" > r51-artifact.zip
          unzip -q r51-artifact.zip -d r51-release
          for f in MerzoWindowsOptimizerSetup-win-x64.exe MerzoWindowsOptimizerSetup-win-x64.exe.sha256 MerzoWindowsOptimizer-portable-win-x64.zip MerzoWindowsOptimizer-portable-win-x64.zip.sha256 R51_RELEASE_NOTES.md; do
            test -f "r51-release/$f"
          done

      - name: Verify CI-proven R51 SHA-256
        run: |
          set -euo pipefail
          cd r51-release
          installer=$(sha256sum MerzoWindowsOptimizerSetup-win-x64.exe | awk '{print $1}')
          portable=$(sha256sum MerzoWindowsOptimizer-portable-win-x64.zip | awk '{print $1}')
          test "$installer" = "b5386a8a616ccf395fd66e1e2cee1d2dd63b79954893f2902fba353090b7ee2d"
          test "$portable" = "5216c44f26ba2b337e6b153c09c2af89a32f45e94a4101b0eb6093299e509b2a"
          grep -qi "$installer" MerzoWindowsOptimizerSetup-win-x64.exe.sha256
          grep -qi "$portable" MerzoWindowsOptimizer-portable-win-x64.zip.sha256
          echo R51_ARTIFACT_SHA_PASS

      - name: Create clean R51 release tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target="ec9a42a8a51fda60b75ec6a3eb9e455b3953922e"
          git fetch origin mwo-r51-release-source --tags
          test "$(git rev-parse origin/mwo-r51-release-source)" = "$target"
          if git ls-remote --exit-code --tags origin refs/tags/mwo-v0.1.51 >/dev/null 2>&1; then
            remote=$(git ls-remote --tags origin refs/tags/mwo-v0.1.51 | awk '{print $1}')
            test "$remote" = "$target"
          else
            git tag mwo-v0.1.51 "$target"
            git push origin refs/tags/mwo-v0.1.51
          fi
          echo R51_TAG_PASS

      - name: Publish stable R51 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view mwo-v0.1.51 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'R51 release already exists; verifying rather than replacing'
          else
            gh release create mwo-v0.1.51 \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Merzo Windows Optimizer 0.1.51 (R51 STABILITY + READABILITY)" \
              --notes-file r51-release/R51_RELEASE_NOTES.md \
              r51-release/MerzoWindowsOptimizerSetup-win-x64.exe \
              r51-release/MerzoWindowsOptimizerSetup-win-x64.exe.sha256 \
              r51-release/MerzoWindowsOptimizer-portable-win-x64.zip \
              r51-release/MerzoWindowsOptimizer-portable-win-x64.zip.sha256
          fi

      - name: Verify public OTA release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/mwo-v0.1.51")
          echo "$json" | jq -e '.draft == false and .prerelease == false and .tag_name == "mwo-v0.1.51"' >/dev/null
          for n in MerzoWindowsOptimizerSetup-win-x64.exe MerzoWindowsOptimizerSetup-win-x64.exe.sha256 MerzoWindowsOptimizer-portable-win-x64.zip MerzoWindowsOptimizer-portable-win-x64.zip.sha256; do
            echo "$json" | jq -e --arg n "$n" '.assets[] | select(.name == $n)' >/dev/null
          done
          installer=$(echo "$json" | jq -r '.assets[] | select(.name=="MerzoWindowsOptimizerSetup-win-x64.exe") | .digest')
          portable=$(echo "$json" | jq -r '.assets[] | select(.name=="MerzoWindowsOptimizer-portable-win-x64.zip") | .digest')
          test "$installer" = "sha256:b5386a8a616ccf395fd66e1e2cee1d2dd63b79954893f2902fba353090b7ee2d"
          test "$portable" = "sha256:5216c44f26ba2b337e6b153c09c2af89a32f45e94a4101b0eb6093299e509b2a"
          echo R51_PUBLIC_OTA_RELEASE_PASS
