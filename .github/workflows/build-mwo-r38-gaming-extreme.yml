name: Merzo Windows Optimizer R38 GAMING EXTREME

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r38-gaming-extreme.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r38.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r38.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r38|Out-Null;tar -xf r38.tar.xz -C r38
          $sln=Get-ChildItem r38 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R38 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py','r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py')){
            python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed: $p"}
          }
          $self=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$ss=Get-Content $self -Raw
          $ss=[regex]::Replace($ss,'Merzo Windows Optimizer — PRODUCTION R\d+[^"\r\n]*SelfTest','Merzo Windows Optimizer — PRODUCTION R38 GAMING EXTREME SelfTest')
          $ss=$ss.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R38 GAMING EXTREME SelfTest')
          Set-Content $self $ss -Encoding UTF8

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(62,155,145,255);w=(238,247,247,255);p=(19,30,40,255)
          d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5)
          d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16)
          d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t)
          im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8
          python icon.py

      - name: Build 0.1.38 without obfuscation
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & .\build\Build-Production.ps1 -Version '0.1.38' -SkipObfuscation; if($LASTEXITCODE-ne0){throw 'Build failed'} }
          finally { Pop-Location }

      - name: Verify R38 gaming and regression gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=$env:SOURCE_ROOT;$dist=Join-Path $root 'dist\app'
          foreach($name in @('MerzoWindowsOptimizer.dll','MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){
            $p=Join-Path $dist $name;if(-not(Test-Path $p)){throw "Missing $name"}
            $v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();Write-Host "$name=$v";if($v-ne'0.1.38.0'){throw "$name version gate failed: $v"}
          }
          $exe=Join-Path $dist 'MerzoWindowsOptimizer.exe';$fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if(-not$fv.FileVersion.StartsWith('0.1.38')){throw "EXE version gate failed: $($fv.FileVersion)"}

          $x=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R38','v0.1.38','Gaming Boost / Developer','SAFE GAMING','PERFORMANCE','EXTREME','LAB MODE','Gaming Network','LOW LATENCY SAFE','Вернуть baseline EXTREME','Центр выполнения','Repair / Network')){if(-not$x.Contains($t)){throw "R38 UI gate failed: $t"}}
          $vm=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('SelectGamingPerformanceCommand','SelectGamingExtremeCommand','SelectGamingLabCommand','ApplyGamingNetworkSafeCommand','ApplyGamingNetworkExtremeCommand','RestoreGamingNetworkCommand','gaming_performance','gaming_extreme','gaming_lab')){if(-not$vm.Contains($t)){throw "R38 VM gate failed: $t"}}
          $helper=Get-Content (Join-Path $root 'src\MerzoOptimizer.ElevatedHelper\Program.cs') -Raw
          foreach($t in @('gaming_network_safe','gaming_network_extreme','restore_gaming_network','Set-NetAdapterRss','Disable-NetAdapterRsc','Disable-NetAdapterPowerManagement','InterruptModeration','network-gaming-baseline.json')){if(-not$helper.Contains($t)){throw "R38 helper gate failed: $t"}}
          foreach($bad in @('ms_tcpip6','autotuninglevel=disabled','set global rss=disabled','delete profile name=','bcdedit /set useplatformclock','disableantispyware')){if(($helper+$vm).ToLowerInvariant().Contains($bad)){throw "Forbidden destructive/folklore token: $bad"}}

          $tweaks=(Get-Content (Join-Path $root 'data\tweaks.json') -Raw|ConvertFrom-Json)
          if($tweaks.Count-lt188){throw "R38 tweak catalog did not grow: $($tweaks.Count)"}
          $counts=@{};foreach($tag in @('gaming_safe','gaming_performance','gaming_extreme','gaming_lab')){$counts[$tag]=@($tweaks|?{(-not$_.scan_only)-and($_.profile_tags -contains $tag)}).Count;Write-Host "$tag=$($counts[$tag])"}
          if($counts.gaming_safe-le0 -or $counts.gaming_performance-lt$counts.gaming_safe -or $counts.gaming_extreme-lt$counts.gaming_performance -or $counts.gaming_lab-lt$counts.gaming_extreme){throw 'Gaming preset nesting gate failed'}
          foreach($id in @('r38.gaming.disable_user_presence_qos','r38.gaming.mmcss_responsiveness_10')){if(-not($tweaks|? id -eq $id)){throw "Missing R38 tweak $id"}}
          $services=(Get-Content (Join-Path $root 'data\service_rules.json') -Raw|ConvertFrom-Json);if($services.Count-ne39){throw "Service rules regression: $($services.Count)"}
          $tasks=(Get-Content (Join-Path $root 'data\task_rules.json') -Raw|ConvertFrom-Json);if($tasks.Count-ne24){throw "Task rules regression: $($tasks.Count)"}
          $notes=Get-Content (Join-Path $root 'data\release_notes.json') -Raw|ConvertFrom-Json;if($notes.version-ne'0.1.38'){throw 'Release notes version gate failed'}
          if(-not(Test-Path (Join-Path $root 'R38_GAMING_EXTREME.marker'))){throw 'R38 marker missing'}
          if(-not(Test-Path (Join-Path $root 'R37_OPERATION_NETWORK.marker'))){throw 'R37 regression marker missing'}
          Write-Host "R38 gates PASS tweaks=$($tweaks.Count) SAFE=$($counts.gaming_safe) PERFORMANCE=$($counts.gaming_performance) EXTREME=$($counts.gaming_extreme) LAB=$($counts.gaming_lab)"

      - name: Dispatcher runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$smoke=Join-Path $env:RUNNER_TEMP 'merzo-r38-dispatcher-smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force};New-Item -ItemType Directory $smoke|Out-Null
          $core=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll';$coreXml=[Security.SecurityElement]::Escape($core)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$coreXml</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $smoke 'Smoke.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Dispatching;
          using var dispatcher = new AsyncOperationDispatcher(2);
          var value = await dispatcher.RunAsync("generic-smoke", _ => Task.FromResult(38));
          if(value != 38) throw new Exception("Generic dispatcher failed");
          await dispatcher.RunAsync("void-smoke", _ => Task.CompletedTask);
          Console.WriteLine("R38_DISPATCHER_SMOKE: PASS");
          '@|Set-Content (Join-Path $smoke 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $smoke 'Smoke.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Dispatcher runtime smoke failed'}

      - name: Network contract runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$smoke=Join-Path $env:RUNNER_TEMP 'merzo-r38-network-smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force};New-Item -ItemType Directory $smoke|Out-Null
          $core=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll'))
          $win=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Windows.dll'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$core</HintPath><Private>true</Private></Reference><Reference Include="MerzoOptimizer.Windows"><HintPath>$win</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $smoke 'Smoke.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Network;
          using MerzoOptimizer.Windows.Elevation;
          using MerzoOptimizer.Windows.Network;
          var temp=Path.Combine(Path.GetTempPath(),"merzo-r38-net-smoke");Directory.CreateDirectory(temp);
          await using var broker=new ElevatedOperationBroker(temp,temp,temp);
          INetworkRepairService svc=new WindowsNetworkRepairService(broker);
          var snap=await svc.DiagnoseAsync();
          foreach(var n in new[]{"ApplyGamingNetworkSafeAsync","ApplyGamingNetworkExtremeAsync","RestoreGamingNetworkAsync"})
              if(typeof(INetworkRepairService).GetMethod(n) is null) throw new Exception("Missing method "+n);
          Console.WriteLine($"R38_NETWORK_CONTRACT_SMOKE: PASS available={snap.NetworkAvailable} adapter={snap.AdapterName}");
          '@|Set-Content (Join-Path $smoke 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $smoke 'Smoke.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Network contract runtime smoke failed'}

      - name: App startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$exe=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe'
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru;Start-Sleep -Seconds 14
          if($p.HasExited){throw "Application exited during startup smoke. ExitCode=$($p.ExitCode)"}
          Stop-Process -Id $p.Id -Force;Write-Host 'Application remained alive through R38 startup smoke.'

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip'
          if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y;if($LASTEXITCODE-ne0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT
          try {
            &$iscc '/DMyAppVersion=0.1.38' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne0){throw 'Installer failed'}
            $e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip'
            $eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
            "$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii
            "$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii
            Write-Host "R38_INSTALLER_SHA256=$eh";Write-Host "R38_PORTABLE_SHA256=$zh"
          } finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.38-R38-GAMING-EXTREME
          path: |
            r38/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r38/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r38/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r38/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.38
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.38';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ДОБАВЛЕНО
          • Gaming Boost: SAFE / PERFORMANCE / EXTREME / LAB — четыре вложенных уровня от обычных игровых настроек до экспериментальных.
          • Gaming Network SAFE: RSS Enabled + TCP Auto-Tuning Normal без принудительного reconnect.
          • Gaming Network EXTREME: сохраняет baseline активного адаптера и пробует поддерживаемые low-latency параметры RSC, power saving и Interrupt Moderation.
          • Restore Gaming Network: возврат baseline адаптера после EXTREME.
          • Новые Gaming/LAB настройки: Game Mode, DisableUserPresenceQos, MMCSS 10%, foreground scheduler bias и HAGS LAB.

          ИЗМЕНЕНО
          • Gaming / Developer превращён в полноценный Gaming Boost Center с явным уровнем риска.
          • Любой системный Gaming-профиль сначала только формирует список; применение остаётся через Snapshot → Apply → Verify → Undo.
          • Repair / Network получил отдельный Gaming Network блок.

          ВАЖНО
          • EXTREME/LAB — экспериментальные режимы. Они могут дать лучший отклик на одном ПК и нейтральный/худший результат на другом, поэтому Merzo явно показывает риск и сохраняет возврат там, где меняется адаптер.
          • Defender, Windows Update, Store, IPv6 и pagefile не отключаются.
          • R37 Operation Center, тёмные Merzo Dialogs, Process Reduction, Feedback/Crash, Audit Memory и Update Center сохранены.
          • Production остаётся без Obfuscar; finished DLL проходит dispatcher runtime smoke.
          '@
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes 2>$null
          git push origin ":refs/tags/$tag" 2>$null
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.38 (R38 GAMING BOOST & EXTREME PERFORMANCE)' --notes $notes `
            (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') `
            (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') `
            (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') `
            (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256')
