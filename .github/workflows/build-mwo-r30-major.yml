name: Merzo Windows Optimizer R30 MAJOR UPDATE

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r30-major.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne 29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r30.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r30.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r30|Out-Null;tar -xf r30.tar.xz -C r30
          $sln=Get-ChildItem r30 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R30 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R30 MAJOR SelfTest').Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          python optimizer/patches/r24_update_center.py;if($LASTEXITCODE-ne 0){throw 'R24 updater failed'}
          python optimizer/patches/r24_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R24 compile failed'}
          python optimizer/patches/r26_ota_repair.py;if($LASTEXITCODE-ne 0){throw 'R26 failed'}
          python optimizer/patches/r27_privacy_engine.py;if($LASTEXITCODE-ne 0){throw 'R27 failed'}
          python optimizer/patches/r28_profiles_updates_cleanup_ux.py;if($LASTEXITCODE-ne 0){throw 'R28 failed'}
          python optimizer/patches/r29_operation_center.py;if($LASTEXITCODE-ne 0){throw 'R29 failed'}
          python optimizer/patches/r29_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R29 compile fix failed'}
          python optimizer/patches/r30_major_update.py;if($LASTEXITCODE-ne 0){throw 'R30 major patch failed'}
          python optimizer/patches/r30_policy_fix.py;if($LASTEXITCODE-ne 0){throw 'R30 policy fix failed'}

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(83,216,197,255);w=(238,247,247,255);p=(19,30,40,255)
          d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5)
          d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16)
          d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t)
          im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8;python icon.py

      - name: Build 0.1.30 and SelfTest
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & .\build\Build-Production.ps1 -Version '0.1.30'; if($LASTEXITCODE-ne 0){throw 'Build failed'} }
          finally { Pop-Location }

      - name: Verify R30 runtime and feature gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$app=Join-Path $env:SOURCE_ROOT 'dist\app'
          $files=@((Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Core\bin\Release\net10.0\MerzoOptimizer.Core.dll'),(Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows\bin\Release\net10.0-windows\MerzoOptimizer.Windows.dll'),(Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.ElevatedHelper\bin\Release\net10.0-windows\win-x64\MerzoOptimizer.ElevatedHelper.dll'))
          foreach($f in $files){if(-not(Test-Path $f)){throw "Missing $f"};Copy-Item $f (Join-Path $app (Split-Path $f -Leaf)) -Force}
          $exe=Join-Path $app 'MerzoWindowsOptimizer.exe';$dll=Join-Path $app 'MerzoWindowsOptimizer.dll';$deps=Join-Path $app 'MerzoWindowsOptimizer.deps.json'
          $fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe);$an=[Reflection.AssemblyName]::GetAssemblyName($dll);$dep=Get-Content $deps -Raw
          Write-Host "EXE=$($fv.FileVersion) Product=$($fv.ProductVersion) DLL=$($an.Version)"
          if(-not$fv.FileVersion.StartsWith('0.1.30')){throw 'EXE version gate failed'}
          if($an.Version.ToString()-ne'0.1.30.0'){throw 'DLL version gate failed'}
          if(-not$dep.Contains('MerzoWindowsOptimizer/0.1.30')-or$dep.Contains('MerzoWindowsOptimizer/0.1.21')){throw 'deps gate failed'}

          $x=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R30','R30: Gaming / Developer Center','R30: visual Update Center 4.0','GamingDevNav','CancelUpdateCommand','PowerLiveText','UpdateProgress')){if(-not$x.Contains($t)){throw "R30 XAML gate failed: $t"}}
          $vm=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('UpdateProgressInfo','PowerRefreshTimerOnTick','WritePendingUpdateMarker','SelectDeveloperProfileCommand','UpdateTransferText','UpdateSpeedText','/SILENT /SUPPRESSMSGBOXES')){if(-not$vm.Contains($t)){throw "R30 VM gate failed: $t"}}
          if($vm.Contains('/VERYSILENT /SUPPRESSMSGBOXES')){throw 'Updater regressed to invisible VERYSILENT install'}

          $model=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Core\Updates\UpdateModels.cs') -Raw
          foreach($t in @('UpdateProgressInfo','BytesReceived','BytesPerSecond','IProgress<UpdateProgressInfo>')){if(-not$model.Contains($t)){throw "R30 update model gate failed: $t"}}
          $svc=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows\Updates\GitHubUpdateService.cs') -Raw
          foreach($t in @('128 * 1024','BytesPerSecond','progress?.Report','SHA-256')){if(-not$svc.Contains($t)){throw "R30 update service gate failed: $t"}}

          $appcs=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\App.xaml.cs') -Raw
          foreach($t in @('StartupSplashWindow','await _viewModel.InitializeAsync()','pending-startup-update.txt','ShutdownMode.OnExplicitShutdown')){if(-not$appcs.Contains($t)){throw "R30 startup gate failed: $t"}}
          foreach($f in @('src\MerzoOptimizer.App\StartupSplashWindow.xaml','src\MerzoOptimizer.App\StartupSplashWindow.xaml.cs')){if(-not(Test-Path (Join-Path $env:SOURCE_ROOT $f))){throw "Missing R30 startup file $f"}}

          $tw=Get-Content (Join-Path $env:SOURCE_ROOT 'data\tweaks.json') -Raw|ConvertFrom-Json
          $sv=Get-Content (Join-Path $env:SOURCE_ROOT 'data\service_rules.json') -Raw|ConvertFrom-Json
          if($tw.Count-lt135){throw "Tweak catalog too small: $($tw.Count)"};if($sv.Count-lt18){throw "Service advisor too small: $($sv.Count)"}
          foreach($id in @('gaming.enable_game_mode','developer.long_paths','developer.powershell_telemetry_optout','edge.disable_shopping_assistant','privacy.disable_inventory_collector','network.disable_llmnr','explorer.show_file_extensions')){if(-not($tw|?{$_.id-eq$id})){throw "Missing R30 tweak $id"}}
          foreach($n in @('RetailDemo','WMPNetworkSvc','PhoneSvc','lfsvc','SharedAccess')){if(-not($sv|?{$_.service_name-eq$n})){throw "Missing R30 service advisor $n"}}

          $settings=Get-Content (Join-Path $env:SOURCE_ROOT 'data\update_settings.json') -Raw|ConvertFrom-Json
          if(-not$settings.auto_check -or $settings.auto_download -or $settings.auto_install){throw 'R30 update confirmation policy gate failed'}
          if(-not$settings.installer_silent_args.StartsWith('/SILENT ')){throw 'R30 visible installer policy gate failed'}
          $iss=Get-Content (Join-Path $env:SOURCE_ROOT 'installer\MerzoWindowsOptimizer.iss') -Raw
          if(-not$iss.Contains('; MERZO_R26_SILENT_RELAUNCH')){throw 'OTA relaunch marker missing'}
          if(-not$appcs.Contains('MerzoWindowsOptimizer.SingleInstance')){throw 'single-instance protection regressed'}
          if(-not(Test-Path (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\Operations\MerzoOperationGuard.cs'))){throw 'Operation Guard regressed'}

      - name: Runtime metadata smoke
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP smoke;New-Item -ItemType Directory -Force $d|Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup></Project>'|Set-Content (Join-Path $d Smoke.csproj)
          'using System.Reflection;foreach(var p in args){var a=Assembly.LoadFrom(Path.GetFullPath(p));Console.WriteLine($"OK {Path.GetFileName(p)} types={a.GetTypes().Length}");}'|Set-Content (Join-Path $d Program.cs)
          $app=Join-Path $env:SOURCE_ROOT 'dist\app'
          dotnet run --project (Join-Path $d Smoke.csproj) -c Release -- (Join-Path $app 'MerzoOptimizer.Core.dll') (Join-Path $app 'MerzoOptimizer.Windows.dll') (Join-Path $app 'MerzoOptimizer.ElevatedHelper.dll')
          if($LASTEXITCODE-ne 0){throw 'Metadata smoke failed'}

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip'
          if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y;if($LASTEXITCODE-ne 0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT
          try {
            &$iscc '/DMyAppVersion=0.1.30' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne 0){throw 'Installer failed'}
            $e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip'
            $eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
            "$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii
            "$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii
            Write-Host "R30_INSTALLER_SHA256=$eh"
          } finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.30-R30-MAJOR-UPDATE
          path: |
            r30/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r30/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r30/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r30/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.30
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.30';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ДОБАВЛЕНО
          • Update Center 4.0: живой прогресс загрузки с процентами, объёмом, скоростью, текущим этапом и отменой.
          • Отдельные стадии SHA-256: подготовка → загрузка → проверка → готово к установке.
          • Startup / Update Splash: после обновления окно остаётся на экране, пока основная программа полностью не инициализируется, и только затем закрывается.
          • LIVE-синхронизация текущей схемы питания с Windows каждые несколько секунд.
          • Если режим питания изменён через Merzo, активная схема сразу перечитывается из Windows и отображается как текущая.
          • Полноценный раздел Gaming / Developer вместо будущей заглушки.
          • 22 новых обратимых твика: Explorer, Privacy, Edge, Gaming, Developer и Network.
          • 5 новых правил Services Advisor: RetailDemo, WMPNetworkSvc, PhoneSvc, Geolocation и ICS.

          ИЗМЕНЕНО
          • Каталог твиков расширен до 135 правил, каталог рекомендаций служб — до 18.
          • Installer обновления запускается в видимом SILENT-режиме вместо невидимого VERYSILENT.
          • Автоматически выполняется только проверка наличия версии; скачивание и установка требуют решения пользователя.
          • Power Center показывает реальное активное состояние Windows, а не только последнюю нажатую кнопку.
          • Gaming / Developer умеет подготовить соответствующий набор твиков и перевести пользователя к их просмотру перед применением.

          ИСПРАВЛЕНО
          • Обновление больше не проходит «в пустоту»: загрузка и проверка файла полностью визуализированы.
          • После UAC/установки новая версия не должна выглядеть пропавшей — startup splash держится до готовности главного окна.
          • Сохранены Operation Guard, single-instance, отмена операций, Snapshot/Undo и OTA-перезапуск из R29.
          '@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE-ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.30 (R30 MAJOR UPDATE)' --notes $notes}
          gh release upload $tag (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'Release upload failed'}
