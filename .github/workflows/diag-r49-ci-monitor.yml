name: DIAG R49 CI MONITOR
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diag-r49-ci-monitor.yml']
permissions:
  actions: read
  contents: write
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - name: Wait for R49 and capture result
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          id=""
          for i in $(seq 1 30); do
            row=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mwo-r49-public-ready.yml --branch merzo-windows-optimizer --limit 1 --json databaseId,status,conclusion,headSha --jq '.[0] // empty')
            if [ -n "$row" ]; then
              id=$(echo "$row" | python -c 'import json,sys; print(json.load(sys.stdin)["databaseId"])')
              status=$(echo "$row" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')
              echo "R49 run=$id status=$status"
              [ "$status" = "completed" ] && break
            fi
            sleep 20
          done
          [ -n "$id" ] || { echo 'R49 workflow run not found' >&2; exit 1; }
          gh run view "$id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > optimizer/R49_CI_STATUS.json
          conclusion=$(python -c 'import json; print(json.load(open("optimizer/R49_CI_STATUS.json"))["conclusion"])')
          if [ "$conclusion" != "success" ]; then
            gh run view "$id" --repo "$GITHUB_REPOSITORY" --log-failed > optimizer/R49_CI_FAILURE.log 2>&1 || true
          else
            rm -f optimizer/R49_CI_FAILURE.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin merzo-windows-optimizer
          git add optimizer/R49_CI_STATUS.json optimizer/R49_CI_FAILURE.log 2>/dev/null || true
          git commit -m "DIAG capture R49 CI result $conclusion" || true
          git push origin HEAD:merzo-windows-optimizer
