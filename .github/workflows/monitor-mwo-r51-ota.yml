name: Monitor MWO R51 OTA

on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/monitor-mwo-r51-ota.yml']

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Wait for R51 OTA and record to status branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 8
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow publish-mwo-r51-ota.yml --branch merzo-windows-optimizer --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$id" ] || { echo 'R51 OTA run not found'; exit 1; }
          for i in $(seq 1 90); do
            status=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            [ "$status" = "completed" ] && break
            sleep 10
          done
          git fetch origin mwo-r51-status:mwo-r51-status
          git checkout mwo-r51-status
          gh run view "$id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > optimizer/R51_OTA_STATUS.json
          conclusion=$(jq -r '.conclusion' optimizer/R51_OTA_STATUS.json)
          if [ "$conclusion" != success ]; then
            gh run view "$id" --repo "$GITHUB_REPOSITORY" --log-failed > optimizer/R51_OTA_FAILED.log || true
          else
            rm -f optimizer/R51_OTA_FAILED.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R51_OTA_STATUS.json optimizer/R51_OTA_FAILED.log 2>/dev/null || true
          git commit -m 'diag: record R51 OTA result' || true
          git push origin HEAD:mwo-r51-status
