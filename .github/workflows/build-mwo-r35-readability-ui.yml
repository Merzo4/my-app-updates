name: Merzo Windows Optimizer R35 READABILITY UI

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r35-readability-ui.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r35.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r35.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r35|Out-Null;tar -xf r35.tar.xz -C r35
          $sln=Get-ChildItem r35 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R35 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py')){
            python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed: $p"}
          }
          $self=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$ss=Get-Content $self -Raw
          $ss=[regex]::Replace($ss,'Merzo Windows Optimizer — PRODUCTION R\d+[^"\r\n]*SelfTest','Merzo Windows Optimizer — PRODUCTION R35 READABILITY UI SelfTest')
          $ss=$ss.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R35 READABILITY UI SelfTest')
          Set-Content $self $ss -Encoding UTF8

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(70,181,165,255);w=(238,247,247,255);p=(19,30,40,255)
          d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5)
          d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16)
          d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t)
          im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8
          python icon.py

      - name: Build 0.1.35 without obfuscation
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & .\build\Build-Production.ps1 -Version '0.1.35' -SkipObfuscation; if($LASTEXITCODE-ne0){throw 'Build failed'} }
          finally { Pop-Location }

      - name: Verify R35 readability and regression gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=$env:SOURCE_ROOT;$dist=Join-Path $root 'dist\app'
          foreach($name in @('MerzoWindowsOptimizer.dll','MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){
            $p=Join-Path $dist $name;if(-not(Test-Path $p)){throw "Missing $name"}
            $v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();Write-Host "$name=$v";if($v-ne'0.1.35.0'){throw "$name version gate failed: $v"}
          }
          $exe=Join-Path $dist 'MerzoWindowsOptimizer.exe';$fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if(-not$fv.FileVersion.StartsWith('0.1.35')){throw "EXE version gate failed: $($fv.FileVersion)"}

          $app=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\App.xaml') -Raw
          foreach($t in @('#46B5A5','#56C1B0','Value="13"','UseLayoutRounding','SnapsToDevicePixels','CompactPrimaryButton','Value="32"','TablePrimaryButton','Value="10"')){if(-not$app.Contains($t)){throw "R35 style gate failed: $t"}}
          if($app.Contains('#59D8C2') -or $app.Contains('#6CE4CF')){throw 'Old neon accent survived R35 style patch'}

          $x=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R35','v0.1.35','CaptionHeight="36"','ColumnDefinition Width="176"','RowDefinition Height="46"','MinHeight="62"','ProcessReductionStatusText','Центр обратной связи','ДОСТУПНО ОБНОВЛЕНИЕ')){if(-not$x.Contains($t)){throw "R35 UI gate failed: $t"}}
          $fonts=[regex]::Matches($x,'FontSize="([0-9]+(?:\.[0-9]+)?)"')|%{[double]$_.Groups[1].Value}
          $min=($fonts|Measure-Object -Minimum).Minimum;Write-Host "MainWindow explicit min font=$min";if($min-lt9){throw "Tiny text survived R35: $min"}

          $vm=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('process_safe','process_aggressive','process_lite','OpenBugReportCommand','SaveDiagnosticsCommand','MerzoDiagnostics-R35')){if(-not$vm.Contains($t)){throw "R34 feature regression: $t"}}
          if($vm.Contains('ghp_') -or $vm.Contains('github_pat_')){throw 'GitHub credential embedded'}
          $appcs=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\App.xaml.cs') -Raw
          foreach($t in @('ShowPendingCrashReport(window)','last-seen-crash.txt','[Crash][R35]')){if(-not$appcs.Contains($t)){throw "Crash reporter regression: $t"}}

          $settings=Get-Content (Join-Path $root 'data\update_settings.json') -Raw|ConvertFrom-Json
          if(-not$settings.auto_check -or $settings.auto_download -or $settings.auto_install){throw 'Update confirmation policy regressed'}
          $notes=Get-Content (Join-Path $root 'data\release_notes.json') -Raw|ConvertFrom-Json
          if($notes.version-ne'0.1.35'){throw 'Release notes version gate failed'}
          if(-not(Test-Path (Join-Path $root 'R35_READABILITY_UI.marker'))){throw 'R35 marker missing'}
          Write-Host 'R35 readability/regression gates: PASS'

      - name: Post-publish dispatcher runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$smoke=Join-Path $env:RUNNER_TEMP 'merzo-r35-dispatcher-smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force};New-Item -ItemType Directory $smoke|Out-Null
          $core=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll';$coreXml=[Security.SecurityElement]::Escape($core)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$coreXml</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $smoke 'Smoke.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Dispatching;
          using var dispatcher = new AsyncOperationDispatcher(2);
          var value = await dispatcher.RunAsync("generic-smoke", _ => Task.FromResult(35));
          if(value != 35) throw new Exception("Generic dispatcher failed");
          await dispatcher.RunAsync("void-smoke", _ => Task.CompletedTask);
          Console.WriteLine("R35_DISPATCHER_SMOKE: PASS");
          '@|Set-Content (Join-Path $smoke 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $smoke 'Smoke.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Dispatcher runtime smoke failed'}

      - name: App startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$exe=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe'
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru;Start-Sleep -Seconds 14
          if($p.HasExited){throw "Application exited during startup smoke. ExitCode=$($p.ExitCode)"}
          Stop-Process -Id $p.Id -Force;Write-Host 'Application remained alive through R35 startup smoke.'

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip'
          if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y;if($LASTEXITCODE-ne0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT
          try {
            &$iscc '/DMyAppVersion=0.1.35' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne0){throw 'Installer failed'}
            $e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip'
            $eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
            "$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii
            "$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii
            Write-Host "R35_INSTALLER_SHA256=$eh";Write-Host "R35_PORTABLE_SHA256=$zh"
          } finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.35-R35-READABILITY-UI
          path: |
            r35/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r35/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r35/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r35/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.35
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.35';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ИСПРАВЛЕНО
          • Исправлена тесная геометрия кнопок, из-за которой на 2K/масштабировании Windows они выглядели наложенными или обрезанными.
          • Для плотных панелей «Выбранное», «Ход работы» и списков добавлено пространство по высоте; compact/table кнопки больше не зажаты в 24–28 DIP.
          • Включены WPF layout rounding и pixel snapping для более ровных границ при 125/150% DPI.

          ИЗМЕНЕНО
          • Самый мелкий текст увеличен примерно на 1–1.5 DIP, базовый шрифт интерфейса — 13 DIP. Крупные заголовки почти не увеличивались, чтобы сохранить компактность.
          • Фирменный teal сделан спокойнее: меньше «ядовитого» свечения, мягче hover и рамка большой кнопки проверки.
          • Левая панель расширена всего на 12 DIP, верхняя строка на 4 DIP — окно остаётся компактным.

          СОХРАНЕНО
          • Все возможности R34: Process Reduction SAFE/AGGRESSIVE/LITE-LIKE, TOP-50 процессов, Feedback/Crash Reporter, 187 твиков, Services/Tasks Advisor.
          • Snapshot/Undo, Update Center с SHA-256, Operation Guard и R33 runtime stability gates.
          • Сборка по-прежнему без Obfuscar до безопасного возвращения защиты.
          '@
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if($LASTEXITCODE-eq0){gh release delete $tag --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag}
          gh release create $tag (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Merzo Windows Optimizer 0.1.35 (R35 READABILITY & DPI UI)' --notes $notes
          if($LASTEXITCODE-ne0){throw 'Release publish failed'}
