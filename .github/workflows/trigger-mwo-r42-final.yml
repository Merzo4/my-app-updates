name: Trigger MWO R42 final gates

on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/trigger-mwo-r42-final.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch final R42 workflow on latest branch state
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-mwo-r42-full-ui-rework-v3.yml --repo ${{ github.repository }} --ref merzo-windows-optimizer
