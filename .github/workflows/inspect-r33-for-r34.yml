name: Inspect R33 for R34
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/inspect-r33-for-r34.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Restore source and apply through R33
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('inspect.tar.xz',[Convert]::FromBase64String($b.ToString()))
          New-Item -ItemType Directory -Force inspect|Out-Null; tar -xf inspect.tar.xz -C inspect
          $sln=Get-ChildItem inspect -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py')){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne 0){throw "Patch failed $p"}}
      - name: Print R34 anchors
        shell: pwsh
        run: |
          $root=$env:SOURCE_ROOT
          $vm=Join-Path $root 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs'
          $x=Join-Path $root 'src\MerzoOptimizer.App\MainWindow.xaml'
          $model=Join-Path $root 'src\MerzoOptimizer.Core\Models\SystemAuditSnapshot.cs'
          $scan=Join-Path $root 'src\MerzoOptimizer.Windows\SystemInfo\ProcessScanner.cs'
          function Around($file,$pattern,$before=18,$after=45){$a=Get-Content $file;$m=Select-String -Path $file -Pattern $pattern|Select-Object -First 1;if($m){$s=[Math]::Max(0,$m.LineNumber-1-$before);$e=[Math]::Min($a.Count-1,$m.LineNumber-1+$after);Write-Host "===== $file :: $pattern lines $($s+1)-$($e+1) =====";for($i=$s;$i-le$e;$i++){Write-Host (("{0:D5}: " -f ($i+1))+$a[$i])}}}
          Around $vm 'PerformanceProcessSummaryText' 30 90
          Around $vm 'PreparePerformance' 30 100
          Around $vm 'InitializeAsync' 20 90
          Around $x 'PerformanceProcessSummaryText' 45 120
          Around $model 'PerformanceAdvisor' 30 80
          Around $scan 'topCount = 30' 40 120
          python - <<'PY'
          import json,os,pathlib
          r=pathlib.Path(os.environ['SOURCE_ROOT'])
          for f in ['data/tweaks.json','data/service_rules.json','data/task_rules.json']:
              o=json.loads((r/f).read_text(encoding='utf-8-sig'))
              print('===== SCHEMA',f,'COUNT',len(o),'=====')
              for item in o[-3:]: print(json.dumps(item,ensure_ascii=False,indent=2))
          PY
