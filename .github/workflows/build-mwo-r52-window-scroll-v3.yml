name: Merzo Windows Optimizer R52 WINDOW SCROLL TEST

on:
  push:
    branches: [mwo-r52-window-scroll-test]
    paths:
      - '.github/workflows/build-mwo-r52-window-scroll-v3.yml'
      - 'optimizer/triggers/r52-window-test.txt'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Run complete R52 window/scroll gates
        id: gates
        continue-on-error: true
        shell: pwsh
        run: .\optimizer\scripts\r52_release_v3.ps1
      - name: Upload verified test artifact
        if: steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.52-R52-WINDOW-SCROLL-TEST
          path: |
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            ${{ env.R49_ROOT }}/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256
            ${{ env.R49_ROOT }}/dist/R52_RELEASE_NOTES.md
          if-no-files-found: error
      - name: Record exact result
        if: always()
        shell: pwsh
        env:
          GATE_OUTCOME: ${{ steps.gates.outcome }}
        run: |
          $obj = [ordered]@{
            version='0.1.52'
            window_scroll_test=$env:GATE_OUTCOME
            head_sha=$env:GITHUB_SHA
            run_id=$env:GITHUB_RUN_ID
            timestamp=[DateTimeOffset]::UtcNow.ToString('o')
          }
          $obj | ConvertTo-Json | Set-Content optimizer/R52_WINDOW_TEST_STATUS.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R52_WINDOW_TEST_STATUS.json
          git commit -m 'test: record R52 window/scroll status' || echo no-change
          git push
          if($env:GATE_OUTCOME -ne 'success'){exit 1}
