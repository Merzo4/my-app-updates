name: Merzo Windows Optimizer R31 AUDIT MEMORY

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r31-audit-memory.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne 29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r31.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r31.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r31|Out-Null;tar -xf r31.tar.xz -C r31
          $sln=Get-ChildItem r31 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R31 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R31 AUDIT MEMORY SelfTest').Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          python optimizer/patches/r24_update_center.py;if($LASTEXITCODE-ne 0){throw 'R24 updater failed'}
          python optimizer/patches/r24_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R24 compile failed'}
          python optimizer/patches/r26_ota_repair.py;if($LASTEXITCODE-ne 0){throw 'R26 failed'}
          python optimizer/patches/r27_privacy_engine.py;if($LASTEXITCODE-ne 0){throw 'R27 failed'}
          python optimizer/patches/r28_profiles_updates_cleanup_ux.py;if($LASTEXITCODE-ne 0){throw 'R28 failed'}
          python optimizer/patches/r29_operation_center.py;if($LASTEXITCODE-ne 0){throw 'R29 failed'}
          python optimizer/patches/r29_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R29 compile fix failed'}
          python optimizer/patches/r30_major_update.py;if($LASTEXITCODE-ne 0){throw 'R30 major failed'}
          python optimizer/patches/r30_policy_fix.py;if($LASTEXITCODE-ne 0){throw 'R30 policy failed'}
          python optimizer/patches/r31_audit_memory.py;if($LASTEXITCODE-ne 0){throw 'R31 audit memory failed'}

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(83,216,197,255);w=(238,247,247,255);p=(19,30,40,255)
          d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5)
          d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16)
          d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t)
          im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8;python icon.py

      - name: Build 0.1.31 and SelfTest
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & .\build\Build-Production.ps1 -Version '0.1.31'; if($LASTEXITCODE-ne 0){throw 'Build failed'} }
          finally { Pop-Location }

      - name: Verify R31 runtime and feature gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=$env:SOURCE_ROOT;$app=Join-Path $root 'dist\app'
          $exe=Join-Path $app 'MerzoWindowsOptimizer.exe';$dll=Join-Path $app 'MerzoWindowsOptimizer.dll';$deps=Join-Path $app 'MerzoWindowsOptimizer.deps.json'
          $fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe);$an=[Reflection.AssemblyName]::GetAssemblyName($dll);$dep=Get-Content $deps -Raw
          Write-Host "EXE=$($fv.FileVersion) Product=$($fv.ProductVersion) DLL=$($an.Version)"
          if(-not$fv.FileVersion.StartsWith('0.1.31')){throw 'EXE version gate failed'}
          if($an.Version.ToString()-ne'0.1.31.0'){throw 'Main DLL version gate failed'}
          if(-not$dep.Contains('MerzoWindowsOptimizer/0.1.31')-or$dep.Contains('MerzoWindowsOptimizer/0.1.21')){throw 'deps gate failed'}
          foreach($name in @('MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){
            $p=Join-Path $app $name;if(-not(Test-Path $p)){throw "Missing $name"}
            $v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();Write-Host "$name=$v";if($v-ne'0.1.31.0'){throw "$name version gate failed: $v"}
          }

          $store=Join-Path $root 'src\MerzoOptimizer.App\Audit\AuditStateStore.cs'
          $recx=Join-Path $root 'src\MerzoOptimizer.App\AuditRecommendationsWindow.xaml'
          $reccs=Join-Path $root 'src\MerzoOptimizer.App\AuditRecommendationsWindow.xaml.cs'
          foreach($p in @($store,$recx,$reccs)){if(-not(Test-Path $p)){throw "R31 file missing: $p"}}
          $st=Get-Content $store -Raw
          foreach($t in @('latest.json','history','CaptureCurrent','Compare(','AuditCatalogManifest','TweakIds','ServiceRuleIds','TaskRuleIds','AppRuleIds')){if(-not$st.Contains($t)){throw "Audit store gate failed: $t"}}
          $vm=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('EvaluateAuditFreshnessAfterStartupAsync','TakePendingAuditRecommendation','AuditFreshnessText','AuditCatalogText','r31_new','pending-startup-update.txt')){if(-not$vm.Contains($t)){throw "R31 VM gate failed: $t"}}
          $appcs=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\App.xaml.cs') -Raw
          foreach($t in @('AuditRecommendationsWindow.ShowIfPending','StartupSplashWindow','await _viewModel.InitializeAsync()','MerzoWindowsOptimizer.SingleInstance')){if(-not$appcs.Contains($t)){throw "R31 App gate failed: $t"}}
          $x=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R31','v0.1.31','AuditFreshnessText','AuditCatalogText','R30: visual Update Center 4.0')){if(-not$x.Contains($t)){throw "R31 XAML gate failed: $t"}}

          $tw=Get-Content (Join-Path $root 'data\tweaks.json') -Raw|ConvertFrom-Json
          $sv=Get-Content (Join-Path $root 'data\service_rules.json') -Raw|ConvertFrom-Json
          if($tw.Count-lt152){throw "Tweak catalog too small: $($tw.Count)"};if($sv.Count-lt21){throw "Service advisor too small: $($sv.Count)"}
          $newIds=@('security.disable_autoplay_all_drives','security.disable_autorun_commands','security.disable_autoplay_nonvolume','privacy.disable_lock_screen_camera','ui.disable_first_logon_animation','search.disable_cloud_search','explorer.launch_this_pc','explorer.disable_sync_provider_notifications','explorer.separate_process','edge.hide_first_run','edge.disable_rewards','edge.disable_assistance_recommendations','edge.disable_spotlight_experiences','edge.disable_search_suggestions','edge.disable_network_prediction','edge.disable_alternate_error_service','developer.dotnet_cli_telemetry_optout')
          foreach($id in $newIds){$r=$tw|?{$_.id-eq$id};if(-not$r){throw "Missing R31 tweak $id"};if(-not($r.profile_tags -contains 'r31_new')){throw "R31 recommendation tag missing: $id"}}
          foreach($n in @('AJRouter','WpcMonSvc','wisvc')){if(-not($sv|?{$_.service_name-eq$n})){throw "Missing R31 service advisor $n"}}

          $settings=Get-Content (Join-Path $root 'data\update_settings.json') -Raw|ConvertFrom-Json
          if(-not$settings.auto_check -or $settings.auto_download -or $settings.auto_install){throw 'Update confirmation policy regressed'}
          if(-not$settings.installer_silent_args.StartsWith('/SILENT ')){throw 'Visible installer policy regressed'}
          if(-not(Test-Path (Join-Path $root 'src\MerzoOptimizer.App\Operations\MerzoOperationGuard.cs'))){throw 'Operation Guard regressed'}
          if(-not$vm.Contains('UpdateProgressInfo')-or-not$vm.Contains('PowerRefreshTimerOnTick')){throw 'R30 Update Center/Power live regressed'}
          $self=Get-Content (Join-Path $root 'src\MerzoOptimizer.SelfTest\Program.cs') -Raw
          if(-not$self.Contains('Auto-install    : live OTA installer')){throw 'SelfTest updater status stale'}

      - name: Runtime metadata smoke
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP smoke;New-Item -ItemType Directory -Force $d|Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup></Project>'|Set-Content (Join-Path $d Smoke.csproj)
          'using System.Reflection;foreach(var p in args){var a=Assembly.LoadFrom(Path.GetFullPath(p));Console.WriteLine($"OK {Path.GetFileName(p)} v={a.GetName().Version} types={a.GetTypes().Length}");}'|Set-Content (Join-Path $d Program.cs)
          $app=Join-Path $env:SOURCE_ROOT 'dist\app'
          dotnet run --project (Join-Path $d Smoke.csproj) -c Release -- (Join-Path $app 'MerzoOptimizer.Core.dll') (Join-Path $app 'MerzoOptimizer.Windows.dll') (Join-Path $app 'MerzoOptimizer.ElevatedHelper.dll')
          if($LASTEXITCODE-ne 0){throw 'Metadata smoke failed'}

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip'
          if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y;if($LASTEXITCODE-ne 0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT
          try {
            &$iscc '/DMyAppVersion=0.1.31' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne 0){throw 'Installer failed'}
            $e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip'
            $eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
            "$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii
            "$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii
            Write-Host "R31_INSTALLER_SHA256=$eh"
          } finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.31-R31-AUDIT-MEMORY
          path: |
            r31/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r31/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r31/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r31/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.31
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.31';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ДОБАВЛЕНО
          • Persistent Audit: последний успешный аудит теперь сохраняется в LocalAppData и восстанавливается при следующем запуске.
          • История до 12 аудитов для будущего сравнения состояния ПК.
          • Smart Re-Audit после обновления: Merzo сравнивает каталог твиков, служб, задач и Appx по точным ID.
          • Если после обновления появились новые правила, запускается автоматическая read-only проверка и формируются рекомендации — ничего не применяется без решения пользователя.
          • На первом переходе R30 → R31, где старого сохранённого аудита ещё нет, Merzo автоматически создаёт постоянный baseline после обновления.
          • Новое окно «Новые рекомендации после обновления» с количеством новых правил, уже настроенных и рекомендуемых изменений.
          • На главной странице отображается свежесть аудита и размер текущего каталога правил.
          • 17 новых обратимых твиков: AutoPlay/AutoRun, Lock Screen Camera, First Logon Animation, Cloud Search, Explorer, Edge policy и .NET CLI telemetry opt-out.
          • 3 новых правила Services Advisor: AllJoyn Router, Parental Controls и Windows Insider Service.

          ИЗМЕНЕНО
          • Каталог твиков расширен с 135 до 152 правил; Services Advisor — с 18 до 21 правила.
          • Версии Core / Windows / ElevatedHelper / SelfTest приведены к единой версии 0.1.31 вместо старых внутренних 1.0/0.1.21.
          • Сохранённый аудит загружается до фоновых проверок, поэтому интерфейс больше не должен начинаться с пустого состояния.
          • После обновления пересканируются новые/изменённые правила; если каталог не менялся, лишний полный аудит не запускается.

          ИСПРАВЛЕНО
          • Аудит больше не теряется после закрытия программы.
          • После обновления Merzo теперь понимает, появились ли новые твики/службы/задачи, и показывает рекомендации автоматически.
          • Исправлен устаревший текст SelfTest про недоступную автоустановку — OTA уже работает.
          • Сохранены Update Center 4.0, live Power Center, Startup Splash, Operation Guard, single-instance, Snapshot/Undo и безопасная многозадачность R29/R30.
          '@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE-ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.31 (R31 AUDIT MEMORY + SMART RE-AUDIT)' --notes $notes}
          gh release upload $tag (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'Release upload failed'}
