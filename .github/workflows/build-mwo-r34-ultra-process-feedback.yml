name: Merzo Windows Optimizer R34 ULTRA PROCESS & FEEDBACK

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r34-ultra-process-feedback.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne 29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r34.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r34.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r34|Out-Null
          tar -xf r34.tar.xz -C r34
          $sln=Get-ChildItem r34 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R34 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py')){
            python (Join-Path 'optimizer/patches' $p)
            if($LASTEXITCODE-ne 0){throw "Patch failed: $p"}
          }
          $self=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$ss=Get-Content $self -Raw
          $ss=[regex]::Replace($ss,'Merzo Windows Optimizer — PRODUCTION R\d+[^"\r\n]*SelfTest','Merzo Windows Optimizer — PRODUCTION R34 ULTRA PROCESS SelfTest')
          $ss=$ss.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R34 ULTRA PROCESS SelfTest')
          Set-Content $self $ss -Encoding UTF8

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(83,216,197,255);w=(238,247,247,255);p=(19,30,40,255)
          d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5)
          d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16)
          d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t)
          im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8
          python icon.py

      - name: Build 0.1.34 without obfuscation
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & .\build\Build-Production.ps1 -Version '0.1.34' -SkipObfuscation; if($LASTEXITCODE-ne 0){throw 'Build failed'} }
          finally { Pop-Location }

      - name: Verify R34 product gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=$env:SOURCE_ROOT;$app=Join-Path $root 'dist\app'
          foreach($name in @('MerzoWindowsOptimizer.dll','MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){
            $p=Join-Path $app $name;if(-not(Test-Path $p)){throw "Missing $name"}
            $v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();Write-Host "$name=$v";if($v-ne'0.1.34.0'){throw "$name version gate failed: $v"}
          }
          $exe=Join-Path $app 'MerzoWindowsOptimizer.exe';$fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if(-not$fv.FileVersion.StartsWith('0.1.34')){throw "EXE version gate failed: $($fv.FileVersion)"}
          $x=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R34','v0.1.34','ProcessReductionStatusText','SelectProcessSafeCommand','SelectProcessAggressiveCommand','SelectProcessLiteCommand','Центр обратной связи','Диагностический ZIP','ДОСТУПНО ОБНОВЛЕНИЕ')){if(-not$x.Contains($t)){throw "R34 UI gate failed: $t"}}
          $vm=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('process_safe','process_aggressive','process_lite','OpenBugReportCommand','OpenFeatureRequestCommand','SaveDiagnosticsCommand','MerzoDiagnostics-R34','issues/new?title=')){if(-not$vm.Contains($t)){throw "R34 VM gate failed: $t"}}
          if($vm.Contains('ghp_') -or $vm.Contains('github_pat_')){throw 'A GitHub credential must never be embedded in the app'}
          $model=Get-Content (Join-Path $root 'src\MerzoOptimizer.Core\Models\SystemAuditSnapshot.cs') -Raw
          foreach($t in @('SourceHint','ReductionTier','ReductionPotential')){if(-not$model.Contains($t)){throw "Process source gate failed: $t"}}
          $scanner=Get-Content (Join-Path $root 'src\MerzoOptimizer.Windows\SystemInfo\ProcessScanner.cs') -Raw
          if(-not$scanner.Contains('topCount = 50')){throw 'TOP-50 process audit gate failed'}
          $appcs=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\App.xaml.cs') -Raw
          foreach($t in @('ShowPendingCrashReport(window)','last-seen-crash.txt','startup-crash-*.log','%USERPROFILE%')){if(-not$appcs.Contains($t)){throw "Crash reporter gate failed: $t"}}
          $tw=Get-Content (Join-Path $root 'data\tweaks.json') -Raw|ConvertFrom-Json
          $sv=Get-Content (Join-Path $root 'data\service_rules.json') -Raw|ConvertFrom-Json
          $tr=Get-Content (Join-Path $root 'data\task_rules.json') -Raw|ConvertFrom-Json
          $safe=@($tw|?{$_.profile_tags -contains 'process_safe'}).Count;$agg=@($tw|?{$_.profile_tags -contains 'process_aggressive'}).Count;$lite=@($tw|?{$_.profile_tags -contains 'process_lite'}).Count
          Write-Host "Catalog=$($tw.Count) Process profiles SAFE=$safe AGGRESSIVE=$agg LITE-LIKE=$lite Services=$($sv.Count) Tasks=$($tr.Count)"
          if($tw.Count-lt180 -or $safe-lt3 -or $agg-lt$safe -or $lite-lt$agg){throw 'Process Reduction profile nesting/count gate failed'}
          if($sv.Count-lt38){throw "Expected expanded Services Advisor >=38, got $($sv.Count)"}
          if($tr.Count-lt23){throw "Expected expanded Tasks Advisor >=23, got $($tr.Count)"}
          foreach($keep in @('WSearch','SysMain')){if(-not($sv|?{$_.service_name-eq$keep -and $_.risk-eq'KEEP'})){throw "KEEP service regressed: $keep"}}
          foreach($pat in @('UpdateOrchestrator','Windows Defender')){if(-not(($tr|ConvertTo-Json -Depth 8).Contains($pat))){throw "Protected task marker regressed: $pat"}}
          $settings=Get-Content (Join-Path $root 'data\update_settings.json') -Raw|ConvertFrom-Json
          if(-not$settings.auto_check -or $settings.auto_download -or $settings.auto_install){throw 'Update confirmation policy regressed'}
          $notes=Get-Content (Join-Path $root 'data\release_notes.json') -Raw|ConvertFrom-Json
          if($notes.version-ne'0.1.34'){throw 'Release notes version gate failed'}
          if(-not(Test-Path (Join-Path $root 'R34_ULTRA_PROCESS_FEEDBACK.marker'))){throw 'R34 marker missing'}
          Write-Host 'R34 product gates: PASS'

      - name: Post-publish dispatcher runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $smoke=Join-Path $env:RUNNER_TEMP 'merzo-r34-dispatcher-smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force};New-Item -ItemType Directory $smoke|Out-Null
          $core=(Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll');$coreXml=[System.Security.SecurityElement]::Escape($core)
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$coreXml</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $smoke 'Smoke.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Dispatching;
          using var dispatcher = new AsyncOperationDispatcher(2);
          var value = await dispatcher.RunAsync("generic-smoke", _ => Task.FromResult(34));
          if (value != 34) throw new Exception("Generic dispatcher returned wrong value");
          await dispatcher.RunAsync("void-smoke", _ => Task.CompletedTask);
          Console.WriteLine("R34_POST_PUBLISH_DISPATCHER_SMOKE: PASS");
          '@|Set-Content (Join-Path $smoke 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $smoke 'Smoke.csproj') -c Release
          if($LASTEXITCODE-ne 0){throw 'Published dispatcher runtime smoke failed'}

      - name: App startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe'
          $p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          Start-Sleep -Seconds 14
          if($p.HasExited){throw "Application exited during startup smoke. ExitCode=$($p.ExitCode)"}
          Stop-Process -Id $p.Id -Force
          Write-Host 'Application remained alive through R34 startup smoke.'

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip'
          if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y;if($LASTEXITCODE-ne 0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT
          try {
            &$iscc '/DMyAppVersion=0.1.34' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne 0){throw 'Installer failed'}
            $e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip'
            $eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant()
            "$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii
            "$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii
            Write-Host "R34_INSTALLER_SHA256=$eh";Write-Host "R34_PORTABLE_SHA256=$zh"
          } finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.34-R34-ULTRA-PROCESS-FEEDBACK
          path: |
            r34/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r34/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r34/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r34/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.34
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.34';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ДОБАВЛЕНО
          • Process Reduction Engine: аудит TOP-50 процессов показывает RAM, вероятный источник запуска/фона, режим KEEP / SAFE / AGGRESSIVE и потенциал разгрузки.
          • Три обратимых набора SAFE / AGGRESSIVE / LITE-LIKE. Они не «убивают» процессы, а готовят связанные настройки для просмотра и применения через Snapshot/Undo.
          • Feedback Center прямо в программе: описание ошибки или идеи, privacy-safe диагностический ZIP и заранее заполненный GitHub Issue. GitHub token в приложение не встроен.
          • Crash Reporter: если предыдущий запуск сохранил crash-log, следующий запуск один раз предлагает открыть подготовленный GitHub Issue.
          • Services Advisor расширен условными источниками фоновых процессов: Fax, Mobile Hotspot, Smart Card, Biometrics, Sensors, Maps, NFC/Payments, Diagnostics Hub, Remote Registry и Touch/Handwriting.
          • Scheduled Tasks Advisor расширен Maps, Feedback/Siuf, Location, Family Safety, Mobile Broadband, Retail Demo, Work Folders, Workplace Join и Bluetooth.
          • Новая волна обратимых настроек: Windows Widgets, consumer experiences, лимит фоновой Delivery Optimization, Edge Startup Boost/background mode и дополнительные consumer/UI правила, если они ещё не были покрыты каталогом.

          ИЗМЕНЕНО
          • Аудит процессов расширен с TOP-30 до TOP-50.
          • Process Reduction не обещает искусственные «70 процессов»: после перезагрузки ориентируемся на реальный baseline процессов/RAM и отключаем источник, а не случайный PID.
          • LITE-LIKE не отключает Defender, Windows Update, IPv6, pagefile и не применяет HPET/timer/TCP magic hacks.
          • R34 сохраняет безопасную R33 production-схему без Obfuscar, пока защита сборок не будет возвращена без риска TypeLoadException.
          • Автопроверка обновлений остаётся включённой; R33 → R34 является первым реальным тестом постоянной карточки «ДОСТУПНО ОБНОВЛЕНИЕ» при запуске.

          СОХРАНЕНО
          • Persistent Audit + Smart Re-Audit, Update Center с прогрессом/SHA, live Power Center, Operation Guard, multitasking, optional cleanup backup и Snapshot/Undo.
          '@
          $notes=$notes -replace '^          ',' ' -replace "`r?`n          ","`n"
          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if($LASTEXITCODE-eq0){gh release delete $tag --repo "$env:GITHUB_REPOSITORY" --yes --cleanup-tag}
          gh release create $tag (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title 'Merzo Windows Optimizer 0.1.34 (R34 ULTRA PROCESS & FEEDBACK)' --notes $notes
          if($LASTEXITCODE-ne0){throw 'Release publish failed'}
