name: Merzo Windows Optimizer R28 BIG UX UPDATE

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r28-big-ux.yml']

permissions: { contents: write }

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne 29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r28.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r28.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r28|Out-Null;tar -xf r28.tar.xz -C r28
          $sln=Get-ChildItem r28 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R28 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R28 UX SelfTest').Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          python optimizer/patches/r24_update_center.py;if($LASTEXITCODE-ne 0){throw 'R24 updater patch failed'}
          python optimizer/patches/r24_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R24 compatibility patch failed'}
          python optimizer/patches/r26_ota_repair.py;if($LASTEXITCODE-ne 0){throw 'R26 OTA patch failed'}
          python optimizer/patches/r27_privacy_engine.py;if($LASTEXITCODE-ne 0){throw 'R27 privacy patch failed'}
          python optimizer/patches/r28_profiles_updates_cleanup_ux.py;if($LASTEXITCODE-ne 0){throw 'R28 UX patch failed'}

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True);im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(83,216,197,255);w=(238,247,247,255);p=(19,30,40,255);d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5);d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16);d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t);im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8;python icon.py

      - name: Build 0.1.28 and SelfTest
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT;try{& .\build\Build-Production.ps1 -Version '0.1.28';if($LASTEXITCODE-ne 0){throw 'Build failed'}}finally{Pop-Location}

      - name: Replace protected DLL copies and verify R28
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$app=Join-Path $env:SOURCE_ROOT 'dist\app'
          $files=@(
            (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Core\bin\Release\net10.0\MerzoOptimizer.Core.dll'),
            (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows\bin\Release\net10.0-windows\MerzoOptimizer.Windows.dll'),
            (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.ElevatedHelper\bin\Release\net10.0-windows\win-x64\MerzoOptimizer.ElevatedHelper.dll'))
          foreach($f in $files){if(-not(Test-Path $f)){throw "Missing $f"};Copy-Item $f (Join-Path $app (Split-Path $f -Leaf)) -Force}
          $exe=Join-Path $app 'MerzoWindowsOptimizer.exe';$dll=Join-Path $app 'MerzoWindowsOptimizer.dll';$deps=Join-Path $app 'MerzoWindowsOptimizer.deps.json'
          $fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe);$an=[Reflection.AssemblyName]::GetAssemblyName($dll);$dep=Get-Content $deps -Raw
          Write-Host "EXE=$($fv.FileVersion) Product=$($fv.ProductVersion) DLL=$($an.Version)"
          if(-not $fv.FileVersion.StartsWith('0.1.28')){throw 'EXE version gate failed'}
          if($an.Version.ToString()-ne'0.1.28.0'){throw 'DLL version gate failed'}
          if(-not$dep.Contains('MerzoWindowsOptimizer/0.1.28')-or$dep.Contains('MerzoWindowsOptimizer/0.1.21')){throw 'deps version gate failed'}
          $x=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R28','Header="Ход очистки"','UpdateReleaseNotesText','SelectedCleanupTabIndex','Что нового')){if(-not$x.Contains($t)){throw "R28 UI gate failed: $t"}}
          if($x.Contains('Header="Телеметрия"')){throw 'Dedicated Telemetry tab must be removed in R28'}
          if($x.Contains('Text="R20')){throw 'Internal R20 label remains visible'}
          $vm=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('_selectedProfileTag','Profile telemetry service','Profile telemetry task','CleanupOperationSteps','LoadLocalReleaseNotes','ShowUpdateAvailable','/RESTARTAPPLICATIONS')){if(-not$vm.Contains($t)){throw "R28 VM gate failed: $t"}}
          $style=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\App.xaml') -Raw
          if(-not$style.Contains('MERZO_R28_TOOLTIP_STYLE')){throw 'Tooltip style gate failed'}
          $appcs=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\App.xaml.cs') -Raw
          if(-not$appcs.Contains('ReleaseNotesWindow.ShowCurrentReleaseIfNeeded(window);')){throw 'First-launch changelog hook missing'}
          foreach($f in @('src\MerzoOptimizer.App\ReleaseNotesWindow.xaml','src\MerzoOptimizer.App\ReleaseNotesWindow.xaml.cs','data\release_notes.json')){if(-not(Test-Path (Join-Path $env:SOURCE_ROOT $f))){throw "Missing R28 file $f"}}
          $tw=Get-Content (Join-Path $env:SOURCE_ROOT 'data\tweaks.json') -Raw|ConvertFrom-Json
          if($tw.Count-lt 113){throw "Privacy tweak catalog too small: $($tw.Count)"}
          $strict=$tw|?{$_.profile_tags -contains 'privacy_strict'}
          if(-not($strict|?{$_.profile_tags -contains 'standard'})){throw 'Privacy STRICT not integrated into STANDARD'}
          $max=$tw|?{$_.profile_tags -contains 'privacy_maximum'}
          if(-not($max|?{$_.profile_tags -contains 'maximum'})){throw 'Privacy MAX not integrated into MAXIMUM'}
          if(-not($max|?{$_.profile_tags -contains 'lite_build'})){throw 'Privacy MAX not integrated into LITE BUILD'}
          $c=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml.cs') -Raw
          if(-not$c.Contains('SetWindowDisplayAffinity')-or-not$c.Contains('WdaNone')){throw 'screen capture compatibility regressed'}
          $iss=Get-Content (Join-Path $env:SOURCE_ROOT 'installer\MerzoWindowsOptimizer.iss') -Raw
          if(-not$iss.Contains('; MERZO_R26_SILENT_RELAUNCH')){throw 'silent OTA relaunch marker missing'}

      - name: Runtime metadata smoke
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP smoke;New-Item -ItemType Directory -Force $d|Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup></Project>'|Set-Content (Join-Path $d Smoke.csproj)
          'using System.Reflection;foreach(var p in args){var a=Assembly.LoadFrom(Path.GetFullPath(p));Console.WriteLine($"OK {Path.GetFileName(p)} types={a.GetTypes().Length}");}'|Set-Content (Join-Path $d Program.cs)
          $app=Join-Path $env:SOURCE_ROOT 'dist\app'
          dotnet run --project (Join-Path $d Smoke.csproj) -c Release -- (Join-Path $app 'MerzoOptimizer.Core.dll') (Join-Path $app 'MerzoOptimizer.Windows.dll') (Join-Path $app 'MerzoOptimizer.ElevatedHelper.dll')
          if($LASTEXITCODE-ne 0){throw 'Metadata smoke failed'}

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip';if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if($LASTEXITCODE-ne 0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT;try{&$iscc '/DMyAppVersion=0.1.28' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne 0){throw 'Installer compile failed'};$e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip';$eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant();"$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii;"$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii;Write-Host "R28_INSTALLER_SHA256=$eh"}finally{Pop-Location}

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.28-R28-BIG-UX-UPDATE
          path: |
            r28/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r28/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r28/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r28/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.28
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.28';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ДОБАВЛЕНО
          • Телеметрия и privacy-настройки встроены в LIGHT / STANDARD / MAXIMUM / LITE BUILD.
          • STANDARD включает строгую telemetry-настройку: DiagTrack/dmwappushservice и telemetry scheduled tasks с Snapshot/Undo.
          • MAXIMUM и LITE BUILD включают максимальный обратимый privacy-набор, включая WER service/tasks.
          • На странице «Обновления» теперь виден полный changelog: что добавлено, изменено и исправлено.
          • При обнаружении будущей новой версии Merzo показывает уведомление с описанием релиза.
          • После первого запуска новой версии показывается закрываемое окно «Что нового».
          • В Cleanup добавлена вкладка «Ход очистки» с прогрессом, текущей категорией, путём, Snapshot и итогом.

          ИЗМЕНЕНО
          • Отдельный пользовательский раздел «Телеметрия» удалён: privacy теперь часть основных профилей.
          • Подтверждения очистки переписаны понятным языком без внутренних обозначений ревизий.
          • Пакетная очистка визуализирует каждую категорию: backup → Snapshot → очистка → проверка.
          • Cleanup-карточки получили информативные hover-подсказки.

          ИСПРАВЛЕНО
          • Исправлены пустые/белые tooltip-подсказки единым тёмным стилем.
          • Убраны внутренние подписи вроде R20 из пользовательских окон.
          • Сохранено исправление скриншотов активного окна.
          • Сохранены Snapshot/Undo, SHA-256, UAC и автоматический перезапуск после OTA.
          '@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE-ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.28 (R28 BIG UX UPDATE)' --notes $notes}
          gh release upload $tag (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'Release upload failed'}
