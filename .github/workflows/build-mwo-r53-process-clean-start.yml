name: Merzo Windows Optimizer R53 PROCESS CLEAN START

on:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/build-mwo-r53-process-clean-start.yml'
      - 'optimizer/triggers/r53-process-clean-start.txt'
      - 'optimizer/patches/r53_process_start_debloat.py'
      - 'optimizer/patches/r53_catalog_probe.py'
      - 'optimizer/patches/r53_game_compat_guard.py'
      - 'optimizer/patches/r53_ascii_targets.py'
      - 'optimizer/patches/r53_product_install_branding.py'
      - 'optimizer/patches/r53_game_apply_hotfix.py'
      - 'optimizer/patches/r53_version_finalize.py'
      - 'optimizer/patches/r52_game_wow_debloat_v3.py'
      - 'optimizer/scripts/r53_release_v1.ps1'
      - 'optimizer/scripts/r53_release_v2.ps1'
      - 'optimizer/scripts/r53_release_v3.ps1'
      - 'optimizer/scripts/r53_release_v4.ps1'
      - 'optimizer/scripts/r53_release_v5.ps1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mwo-r53-production
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run complete R53 production gates
        id: gates
        continue-on-error: true
        shell: pwsh
        run: .\optimizer\scripts\r53_release_v5.ps1
      - name: Upload verified R53 artifact
        id: artifact
        if: steps.gates.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.53.1-R53-HOTFIX1
          path: |
            r49/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r49/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r49/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r49/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256
            r49/dist/R53_RELEASE_NOTES.md
          if-no-files-found: error
      - name: Record current R53 CI status
        if: always()
        shell: pwsh
        env:
          GATES_OUTCOME: ${{ steps.gates.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
        run: |
          $ok = ($env:GATES_OUTCOME -eq 'success' -and $env:ARTIFACT_OUTCOME -eq 'success')
          $conclusion = if ($ok) { 'success' } else { 'failure' }
          $payload = @{
            conclusion = $conclusion
            createdAt = (Get-Date).ToUniversalTime().ToString('o')
            databaseId = [long]$env:GITHUB_RUN_ID
            headSha = $env:GITHUB_SHA
            status = 'completed'
            url = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            gates = $env:GATES_OUTCOME
            artifact = $env:ARTIFACT_OUTCOME
          } | ConvertTo-Json -Compress

          # Status recording must never fail because another diagnostic/status
          # commit landed while the long Windows build was running. Rebase onto
          # the current branch tip first, then write only this generated status.
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin merzo-windows-optimizer
          git reset --hard origin/merzo-windows-optimizer
          Set-Content '.\optimizer\R53_CI_STATUS.json' $payload -Encoding UTF8
          git add optimizer/R53_CI_STATUS.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Record R53 CI status run $env:GITHUB_RUN_ID"
            git push origin HEAD:merzo-windows-optimizer
          }
      - name: Fail job when R53 is not releasable
        if: always() && (steps.gates.outcome != 'success' || steps.artifact.outcome != 'success')
        shell: pwsh
        run: exit 1
