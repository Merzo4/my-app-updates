name: DIAG R50 widgets operation source

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diag-r50-widgets-operation-source.yml']

permissions:
  contents: read

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Reconstruct exact R50 and capture source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\optimizer\scripts\r50_release.ps1
          if([string]::IsNullOrWhiteSpace($env:SOURCE_ROOT)){throw 'SOURCE_ROOT missing'}
          $out=Join-Path $env:RUNNER_TEMP 'r50-generated-source.zip'
          Compress-Archive -Path (Join-Path $env:SOURCE_ROOT 'src'),(Join-Path $env:SOURCE_ROOT 'data') -DestinationPath $out -Force
          Write-Host "DIAG_SOURCE=$out"
      - uses: actions/upload-artifact@v4
        with:
          name: r50-generated-source
          path: ${{ runner.temp }}/r50-generated-source.zip
          if-no-files-found: error
