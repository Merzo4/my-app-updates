name: DIAG MWO R45 GENERATED LAYOUT

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diag-mwo-r45-generated-layout.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r45diag.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r45diag.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r45diag|Out-Null
          tar -xf r45diag.tar.xz -C r45diag
          $sln=Get-ChildItem r45diag -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Apply exact cumulative R24-R45 source chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)}
          Set-Content $f $s -Encoding UTF8
          $patches=@(
            'r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py',
            'r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py',
            'r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py',
            'r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py',
            'r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py',
            'r39_gaming_build_catalog.py','r39_gaming_build_engine.py','r39_gaming_build_ui.py','r39_finalize.py',
            'r40_network_binding_hotfix.py','r42_full_ui_rework.py','r42_window_contract_fix.py','r43_true_full_ui.py',
            'r44_function_expansion.py','r44_finalize.py','r45_apply_selected_ux.py'
          )
          foreach($p in $patches){
            python (Join-Path 'optimizer/patches' $p)
            if($LASTEXITCODE-ne0){throw "Patch failed $p"}
          }

      - name: Collect generated UI and security-relevant source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'r45-generated-source'
          New-Item -ItemType Directory -Force $out|Out-Null
          $wanted=@(
            'src\MerzoOptimizer.App\MainWindow.xaml',
            'src\MerzoOptimizer.App\MainWindow.xaml.cs',
            'src\MerzoOptimizer.App\App.xaml',
            'src\MerzoOptimizer.App\App.xaml.cs',
            'src\MerzoOptimizer.App\ReleaseNotesWindow.xaml',
            'src\MerzoOptimizer.App\ReleaseNotesWindow.xaml.cs',
            'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs',
            'src\MerzoOptimizer.Core\Elevation\ElevationModels.cs',
            'src\MerzoOptimizer.Core\Updates\UpdateModels.cs',
            'src\MerzoOptimizer.Windows\Elevation\ElevatedOperationBroker.cs',
            'src\MerzoOptimizer.Windows\Elevation\ElevationAwareServices.cs',
            'src\MerzoOptimizer.Windows\Updates\GitHubUpdateService.cs',
            'src\MerzoOptimizer.ElevatedHelper\Program.cs',
            'src\MerzoOptimizer.ElevatedHelper\helper.manifest',
            'src\MerzoOptimizer.ElevatedHelper\MerzoOptimizer.ElevatedHelper.csproj',
            'src\MerzoOptimizer.App\MerzoOptimizer.App.csproj',
            'src\MerzoOptimizer.Windows\MerzoOptimizer.Windows.csproj',
            'installer\MerzoWindowsOptimizer.iss',
            'data\update_settings.json',
            'build\Build-Production.ps1'
          )
          foreach($rel in $wanted){
            $src=Join-Path $env:SOURCE_ROOT $rel
            if(Test-Path $src){
              $dst=Join-Path $out $rel
              New-Item -ItemType Directory -Force (Split-Path $dst)|Out-Null
              Copy-Item $src $dst -Force
            }
          }
          Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src') -Recurse -File | Where-Object {$_.Name -match 'Update|Release|Elevat|Helper|MainWindow'} | Select-Object FullName | Out-File (Join-Path $out 'SOURCE_INDEX.txt') -Encoding UTF8

      - uses: actions/upload-artifact@v4
        with:
          name: r45-generated-layout-source
          path: ${{ runner.temp }}/r45-generated-source
          if-no-files-found: error
          retention-days: 7
