name: Inspect R38 catalog
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/inspect-r38-catalog.yml']
permissions: { contents: read }
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Restore and print targets
        shell: pwsh
        run: |
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name;$b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))};[IO.File]::WriteAllBytes('i.tar.xz',[Convert]::FromBase64String($b.ToString()));New-Item -ItemType Directory -Force i|Out-Null;tar -xf i.tar.xz -C i;$sln=Get-ChildItem i -Recurse -Filter MerzoWindowsOptimizer.sln|select -First 1;$env:SOURCE_ROOT=$sln.Directory.FullName
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py','r38_gaming_catalog.py')){python (Join-Path 'optimizer/patches' $p)}
          $t=Get-Content (Join-Path $env:SOURCE_ROOT 'data\tweaks.json') -Raw|ConvertFrom-Json
          $t|?{($_.registry_actions|?{$_.value_name -in @('SystemResponsiveness','DisableUserPresenceQos','Win32PrioritySeparation','HwSchMode','AutoGameModeEnabled')})}|%{Write-Host "ID=$($_.id) NAME=$($_.name) TAGS=$($_.profile_tags -join ',')"; $_.registry_actions|?{$_.value_name -in @('SystemResponsiveness','DisableUserPresenceQos','Win32PrioritySeparation','HwSchMode','AutoGameModeEnabled')}|%{Write-Host "  $($_.hive) $($_.key_path) $($_.value_name)=$($_.integer_value)"}}
