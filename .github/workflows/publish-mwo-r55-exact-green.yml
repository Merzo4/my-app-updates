name: Publish MWO R55 Exact Green

on:
  push:
    branches:
      - mwo-r55-process-stability
    paths:
      - '.github/workflows/publish-mwo-r55-exact-green.yml'
      - 'optimizer/scripts/publish_r55_exact_green.ps1'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mwo-r55-process-stability
          fetch-depth: 0

      - name: Download exact R55 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.55-PROCESS-STABILITY-CANDIDATE
          path: artifact
          run-id: 32355454110
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish exact green R55 artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .\optimizer\scripts\publish_r55_exact_green.ps1

      - name: Persist R55 publication status
        if: always()
        shell: pwsh
        run: |
          $status='.\optimizer\R55_PUBLISH_STATUS.json'
          if(!(Test-Path $status)){
            [ordered]@{
              conclusion='failure'
              createdAt=(Get-Date).ToUniversalTime().ToString('o')
              databaseId=[long]$env:GITHUB_RUN_ID
              headSha=$env:GITHUB_SHA
              buildRun=32355454110
              buildHead='d99d61fd5f34eb1ca5331359343c950b33fc3681'
              artifactId=9401609214
              tag='mwo-v0.1.55'
              error='R55 publication controller did not produce a success status.'
            } | ConvertTo-Json | Set-Content $status -Encoding UTF8
          }
          $saved=Join-Path $env:RUNNER_TEMP 'R55_PUBLISH_STATUS.json'
          Copy-Item $status $saved -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $pushed=$false
          for($attempt=1;$attempt-le5 -and !$pushed;$attempt++){
            git fetch origin mwo-r55-process-stability
            git reset --hard origin/mwo-r55-process-stability
            Copy-Item $saved .\optimizer\R55_PUBLISH_STATUS.json -Force
            git add optimizer/R55_PUBLISH_STATUS.json
            git diff --cached --quiet
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            git commit -m "Record R55 publish run $env:GITHUB_RUN_ID"
            git push origin HEAD:mwo-r55-process-stability
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            Start-Sleep -Seconds $attempt
          }
          if(!$pushed){throw 'Could not persist R55 publish status'}
          $j=Get-Content $saved -Raw|ConvertFrom-Json
          if($j.conclusion-ne'success'){exit 1}
