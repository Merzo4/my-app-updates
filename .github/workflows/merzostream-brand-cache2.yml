name: MerzoStream brand cache 2

on:
  push:
    branches:
      - merzostream-010h-release
    paths:
      - .github/workflows/merzostream-brand-cache2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover tagged installer binary
        shell: cmd
        run: git show v0.0.8a:MerzoStreamSetup.exe > "%RUNNER_TEMP%\MerzoStreamSetup-0.0.8a.exe"

      - name: Recover brand icon directly from verified installer
        shell: powershell
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'MerzoStreamSetup-0.0.8a.exe'
          $wantLine = git show v0.0.8a:MerzoStreamSetup.sha256
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read tagged installer SHA file' }
          $want = (($wantLine -join "`n").Trim() -split '\s+')[0].ToLowerInvariant()
          $got = (Get-FileHash $old -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($got -ne $want) { throw "Tagged installer SHA mismatch: $got != $want" }
          Write-Host "OLD INSTALLER SHA PASS $got"

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($old)
          if ($null -eq $icon) { throw 'Windows could not extract application icon from verified installer' }

          New-Item -ItemType Directory -Force -Path 'merzostream\brand-assets' | Out-Null
          $icoPath = Join-Path $PWD 'merzostream\brand-assets\MerzoStreamSuite.ico'
          $pngPath = Join-Path $PWD 'merzostream\brand-assets\MerzoStreamSuite.png'

          $stream = [System.IO.File]::Create($icoPath)
          try { $icon.Save($stream) } finally { $stream.Dispose() }
          $bitmap = $icon.ToBitmap()
          try { $bitmap.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png) } finally { $bitmap.Dispose(); $icon.Dispose() }

          if ((Get-Item $icoPath).Length -lt 1000) { throw 'Extracted ICO is unexpectedly small' }
          if ((Get-Item $pngPath).Length -lt 1000) { throw 'Generated PNG is unexpectedly small' }
          Write-Host "ICO $((Get-Item $icoPath).Length) bytes SHA=$((Get-FileHash $icoPath -Algorithm SHA256).Hash)"
          Write-Host "PNG $((Get-Item $pngPath).Length) bytes SHA=$((Get-FileHash $pngPath -Algorithm SHA256).Hash)"
          Write-Host 'BRAND ASSETS RECOVERED FROM VERIFIED INSTALLER'

      - name: Commit verified binary assets
        shell: pwsh
        run: |
          git config user.name 'MerzoStream Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add merzostream/brand-assets/MerzoStreamSuite.ico merzostream/brand-assets/MerzoStreamSuite.png
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Brand assets are already cached'
            exit 0
          }
          git commit -m 'Cache MerzoStream icon recovered from verified installer'
          if ($LASTEXITCODE -ne 0) { throw 'Brand asset commit failed' }
          git push origin HEAD:merzostream-010h-release
          if ($LASTEXITCODE -ne 0) { throw 'Brand asset push failed' }
          Write-Host 'BRAND ASSETS PUSHED'
