name: Merzo Windows Optimizer R24 FINAL

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r24-final.yml']

permissions:
  contents: write

jobs:
  production:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*' | Sort-Object Name
          if($parts.Count -ne 29){throw "Expected 29 source parts, found $($parts.Count)"}
          $b=[Text.StringBuilder]::new(); foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          if($b.Length -ne 106428){throw "Unexpected base64 length $($b.Length)"}
          [IO.File]::WriteAllBytes('r24.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r24.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h -ne 'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch: $h"}
          New-Item -ItemType Directory -Force r24 | Out-Null; tar -xf r24.tar.xz -C r24
          $sln=Get-ChildItem r24 -Recurse -Filter MerzoWindowsOptimizer.sln | Select-Object -First 1
          if(-not $sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Apply production release-feed contract
        shell: pwsh
        run: |
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs'; $s=Get-Content $f -Raw
          $s=$s.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R24 SelfTest')
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)}
          $s=$s.Replace('R20 validation passed:','R24 production validation passed:'); Set-Content $f $s -Encoding UTF8

      - name: Apply R24 online-update and compatibility patches
        shell: pwsh
        run: |
          python optimizer/patches/r24_update_center.py
          if($LASTEXITCODE -ne 0){throw 'Updater patch failed'}
          python optimizer/patches/r24_compile_fix.py
          if($LASTEXITCODE -ne 0){throw 'Compatibility patch failed'}

      - name: Generate branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          $py=@'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          root=Path(os.environ['SOURCE_ROOT']); out=root/'assets'/'MerzoWindowsOptimizer.ico'; out.parent.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(10,16,22,255)); d=ImageDraw.Draw(im); teal=(83,216,197,255); white=(238,247,247,255); panel=(19,30,40,255)
          d.rounded_rectangle((12,12,244,244),radius=52,fill=panel,outline=teal,width=10); d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5)
          d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=white,width=16,joint='curve'); d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=teal)
          im.save(out,format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@
          $py|Set-Content make_icon.py -Encoding UTF8; python make_icon.py; if($LASTEXITCODE -ne 0){throw 'Icon generation failed'}

      - name: Build production 0.1.24 and SelfTest
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & .\build\Build-Production.ps1 -Version '0.1.24'; if($LASTEXITCODE -ne 0){throw 'Production build failed'} }
          finally { Pop-Location }

      - name: Ship clean .NET 10 runtime assemblies
        shell: pwsh
        run: |
          $app=Join-Path $env:SOURCE_ROOT 'dist\app'
          $files=@(
            @(Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Core\bin\Release\net10.0\MerzoOptimizer.Core.dll','MerzoOptimizer.Core.dll'),
            @(Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows\bin\Release\net10.0-windows\MerzoOptimizer.Windows.dll','MerzoOptimizer.Windows.dll'),
            @(Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.ElevatedHelper\bin\Release\net10.0-windows\win-x64\MerzoOptimizer.ElevatedHelper.dll','MerzoOptimizer.ElevatedHelper.dll')
          )
          foreach($pair in $files){if(-not(Test-Path $pair[0])){throw "Missing runtime assembly $($pair[0])"}; Copy-Item $pair[0] (Join-Path $app $pair[1]) -Force}

      - name: Runtime and updater smoke gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'; $d=Join-Path $env:RUNNER_TEMP 'mwo-r24-smoke'; New-Item -ItemType Directory -Force $d|Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup></Project>'|Set-Content (Join-Path $d Smoke.csproj)
          'using System.Reflection; foreach(var p in args){var a=Assembly.LoadFrom(Path.GetFullPath(p)); Console.WriteLine($"OK {Path.GetFileName(p)} types={a.GetTypes().Length}");}'|Set-Content (Join-Path $d Program.cs)
          $app=Join-Path $env:SOURCE_ROOT 'dist\app'; dotnet run --project (Join-Path $d Smoke.csproj) -c Release -- (Join-Path $app MerzoOptimizer.Core.dll) (Join-Path $app MerzoOptimizer.Windows.dll) (Join-Path $app MerzoOptimizer.ElevatedHelper.dll)
          if($LASTEXITCODE -ne 0){throw 'Runtime metadata smoke failed'}
          $vm=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('IsUpdateBusy','LaunchVerifiedInstallerAndRestart','Verb = "runas"')){if(-not $vm.Contains($t)){throw "Updater contract missing $t"}}
          $x=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          if($x.Contains('MouseLeftButtonDown="TitleBar_MouseLeftButtonDown"')){throw 'Stale titlebar hook remains'}
          if(-not $x.Contains('Проверить обновления') -or -not $x.Contains('Скачать и установить')){throw 'Updater UI labels missing'}

      - name: Rebuild portable payload
        shell: pwsh
        run: |
          $app=Join-Path $env:SOURCE_ROOT 'dist\app'; $z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip'; if(Test-Path $z){Remove-Item $z -Force}; Compress-Archive -Path (Join-Path $app '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y; if($LASTEXITCODE -ne 0){throw 'Inno Setup install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|Where-Object{Test-Path $_}|Select-Object -First 1; if(-not $iscc){throw 'ISCC missing'}; "ISCC=$iscc">>$env:GITHUB_ENV

      - name: Build installer and hashes
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & $env:ISCC '/DMyAppVersion=0.1.24' '.\installer\MerzoWindowsOptimizer.iss'; if($LASTEXITCODE -ne 0){throw 'Installer build failed'}; $s='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe'; $z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip'; if(-not(Test-Path $s)){throw 'Setup missing'}; $sh=(Get-FileHash $s -Algorithm SHA256).Hash.ToLowerInvariant(); $zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant(); "$sh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$s.sha256" -Encoding ascii; "$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii; Write-Host "INSTALLER_SHA256=$sh" }
          finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.24-R24
          path: |
            r24/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r24/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r24/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r24/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish mwo-v0.1.24
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='mwo-v0.1.24'; $dist=Join-Path $env:SOURCE_ROOT dist
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.24 (R24)' --notes 'R24 Online Update Bootstrap: fixes Update Center buttons, isolates updater busy state, adds mandatory SHA-256 verified installer launch with UAC and automatic restart, and preserves R22/R23 runtime/window fixes.'}
          gh release upload $tag (Join-Path $dist 'MerzoWindowsOptimizerSetup-win-x64.exe') (Join-Path $dist 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') (Join-Path $dist 'MerzoWindowsOptimizer-portable-win-x64.zip') (Join-Path $dist 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
