name: Merzo Windows Optimizer R39 GAMING BUILD

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r39-gaming-build.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r39.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r39.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r39|Out-Null;tar -xf r39.tar.xz -C r39
          $sln=Get-ChildItem r39 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R39 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py','r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py','r39_gaming_build_catalog.py','r39_gaming_build_engine.py','r39_gaming_build_ui.py','r39_finalize.py')){
            python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed: $p"}
          }
          $self=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$ss=Get-Content $self -Raw
          $ss=[regex]::Replace($ss,'Merzo Windows Optimizer — PRODUCTION R\d+[^"\r\n]*SelfTest','Merzo Windows Optimizer — PRODUCTION R39 GAMING BUILD SelfTest')
          $ss=$ss.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R39 GAMING BUILD SelfTest')
          Set-Content $self $ss -Encoding UTF8

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True)
          im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(62,155,145,255);w=(238,247,247,255);p=(19,30,40,255)
          d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5)
          d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16)
          d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t)
          im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8
          python icon.py

      - name: Build 0.1.39 without obfuscation
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try { & .\build\Build-Production.ps1 -Version '0.1.39' -SkipObfuscation; if($LASTEXITCODE-ne0){throw 'Build failed'} }
          finally { Pop-Location }

      - name: Verify R39 Gaming Build and regression gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=$env:SOURCE_ROOT;$dist=Join-Path $root 'dist\app'
          foreach($name in @('MerzoWindowsOptimizer.dll','MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){
            $p=Join-Path $dist $name;if(-not(Test-Path $p)){throw "Missing $name"}
            $v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();Write-Host "$name=$v";if($v-ne'0.1.39.0'){throw "$name version gate failed: $v"}
          }
          $exe=Join-Path $dist 'MerzoWindowsOptimizer.exe';$fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if(-not$fv.FileVersion.StartsWith('0.1.39')){throw "EXE version gate failed: $($fv.FileVersion)"}
          $x=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R39','v0.1.39','GAME BUILD','Игровая Windows одним профилем','Gaming Build / Developer','GAME SAFE','GAME PERFORMANCE','GAME EXTREME','GAME LAB','Gaming Network','Repair / Network','Центр выполнения')){if(-not$x.Contains($t)){throw "R39 UI gate failed: $t"}}
          $vm=Get-Content (Join-Path $root 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('gaming_build_safe','gaming_build_performance','gaming_build_extreme','gaming_build_lab','gamingNetworkMode','Gaming Build Network EXTREME','Profile service','Profile task','RestoreGamingNetworkAsync')){if(-not$vm.Contains($t)){throw "R39 VM gate failed: $t"}}
          $helper=Get-Content (Join-Path $root 'src\MerzoOptimizer.ElevatedHelper\Program.cs') -Raw
          foreach($t in @('gaming_network_safe','gaming_network_extreme','restore_gaming_network','network-gaming-baseline.json')){if(-not$helper.Contains($t)){throw "R39 network regression: $t"}}
          foreach($bad in @('ms_tcpip6','autotuninglevel=disabled','set global rss=disabled','delete profile name=','bcdedit /set useplatformclock','disableantispyware')){if(($helper+$vm).ToLowerInvariant().Contains($bad)){throw "Forbidden destructive/folklore token: $bad"}}
          $tweaks=(Get-Content (Join-Path $root 'data\tweaks.json') -Raw|ConvertFrom-Json)
          if($tweaks.Count-lt188){throw "Tweak catalog regression: $($tweaks.Count)"}
          $c=@{};foreach($tag in @('gaming_build_safe','gaming_build_performance','gaming_build_extreme','gaming_build_lab')){$c[$tag]=@($tweaks|?{(-not$_.scan_only)-and($_.profile_tags -contains $tag)}).Count;Write-Host "$tag=$($c[$tag])"}
          if($c.gaming_build_safe-le0 -or $c.gaming_build_performance-lt$c.gaming_build_safe -or $c.gaming_build_extreme-lt$c.gaming_build_performance -or $c.gaming_build_lab-lt$c.gaming_build_extreme){throw 'Gaming Build nesting gate failed'}
          $services=(Get-Content (Join-Path $root 'data\service_rules.json') -Raw|ConvertFrom-Json);if($services.Count-lt39){throw "Service rules regression: $($services.Count)"}
          $tasks=(Get-Content (Join-Path $root 'data\task_rules.json') -Raw|ConvertFrom-Json);if($tasks.Count-lt24){throw "Task rules regression: $($tasks.Count)"}
          $settings=Get-Content (Join-Path $root 'data\update_settings.json') -Raw|ConvertFrom-Json;if(-not$settings.auto_check -or $settings.auto_download -or $settings.auto_install){throw 'Update confirmation policy regressed'}
          $notes=Get-Content (Join-Path $root 'data\release_notes.json') -Raw|ConvertFrom-Json;if($notes.version-ne'0.1.39'){throw 'Release notes version gate failed'}
          if(-not(Test-Path (Join-Path $root 'R39_GAMING_BUILD.marker'))){throw 'R39 marker missing'}
          if(-not(Test-Path (Join-Path $root 'R38_GAMING_EXTREME.marker'))){throw 'R38 regression marker missing'}
          Write-Host "R39 gates PASS SAFE=$($c.gaming_build_safe) PERFORMANCE=$($c.gaming_build_performance) EXTREME=$($c.gaming_build_extreme) LAB=$($c.gaming_build_lab)"

      - name: Dispatcher runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$smoke=Join-Path $env:RUNNER_TEMP 'merzo-r39-dispatcher-smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force};New-Item -ItemType Directory $smoke|Out-Null
          $core=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$core</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $smoke 'Smoke.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Dispatching;
          using var d=new AsyncOperationDispatcher(2);var v=await d.RunAsync("r39-generic",_=>Task.FromResult(39));if(v!=39)throw new Exception("generic");await d.RunAsync("r39-void",_=>Task.CompletedTask);Console.WriteLine("R39_DISPATCHER_SMOKE: PASS");
          '@|Set-Content (Join-Path $smoke 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $smoke 'Smoke.csproj') -c Release;if($LASTEXITCODE-ne0){throw 'Dispatcher smoke failed'}

      - name: Network contract runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$smoke=Join-Path $env:RUNNER_TEMP 'merzo-r39-network-smoke'
          if(Test-Path $smoke){Remove-Item $smoke -Recurse -Force};New-Item -ItemType Directory $smoke|Out-Null
          $core=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll'));$win=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Windows.dll'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$core</HintPath><Private>true</Private></Reference><Reference Include="MerzoOptimizer.Windows"><HintPath>$win</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $smoke 'Smoke.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Network;using MerzoOptimizer.Windows.Elevation;using MerzoOptimizer.Windows.Network;
          var t=Path.Combine(Path.GetTempPath(),"merzo-r39-net-smoke");Directory.CreateDirectory(t);await using var b=new ElevatedOperationBroker(t,t,t);INetworkRepairService s=new WindowsNetworkRepairService(b);var n=await s.DiagnoseAsync();foreach(var m in new[]{"ApplyGamingNetworkSafeAsync","ApplyGamingNetworkExtremeAsync","RestoreGamingNetworkAsync"})if(typeof(INetworkRepairService).GetMethod(m)is null)throw new Exception(m);Console.WriteLine($"R39_NETWORK_CONTRACT: PASS {n.AdapterName}");
          '@|Set-Content (Join-Path $smoke 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $smoke 'Smoke.csproj') -c Release;if($LASTEXITCODE-ne0){throw 'Network contract smoke failed'}

      - name: App startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$exe=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe';$p=Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru;Start-Sleep -Seconds 14;if($p.HasExited){throw "App exited $($p.ExitCode)"};Stop-Process -Id $p.Id -Force;Write-Host 'R39 app startup smoke: PASS'

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip';if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y;if($LASTEXITCODE-ne0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT
          try { &$iscc '/DMyAppVersion=0.1.39' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne0){throw 'Installer failed'};$e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip';$eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant();"$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii;"$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii;Write-Host "R39_INSTALLER_SHA256=$eh";Write-Host "R39_PORTABLE_SHA256=$zh" } finally { Pop-Location }

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.39-R39-GAMING-BUILD
          path: |
            r39/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r39/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r39/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r39/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.39
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.39';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ДОБАВЛЕНО
          • GAME BUILD встроен прямо в основные профили оптимизации.
          • GAME SAFE / PERFORMANCE / EXTREME / LAB — четыре уровня игровой Windows.
          • Один подтверждённый план объединяет Registry/Policy, снижение источников фоновых процессов, службы/задачи и Gaming Network.
          • PERFORMANCE использует Gaming Network SAFE; EXTREME/LAB — Gaming Network EXTREME с baseline адаптера.

          ИЗМЕНЕНО
          • Gaming Boost R38 теперь выбирает полный Gaming Build, а не только Gaming-категорию.
          • Вместо случайного завершения процессов Merzo уменьшает источники их автозапуска/фоновой работы и отключает только проверяемые службы из allow-list профиля.
          • Operation Center показывает единый ход: Tweaks → Services → Tasks → Network → результат.

          ВАЖНО
          • EXTREME/LAB могут отключать необязательные Hotspot/Smart Card/Sensors/Tablet/Biometrics сценарии, поэтому перед применением показывается отдельное предупреждение.
          • Defender, Windows Update, Store, IPv6 и pagefile не отключаются.
          • При ошибке EXTREME-сети Merzo пытается вернуть baseline адаптера и затем откатывает Snapshot-изменения.
          • Production остаётся без Obfuscar; finished DLL проходит dispatcher runtime smoke.
          '@
          gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes 2>$null;git push origin ":refs/tags/$tag" 2>$null
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.39 (R39 GAMING BUILD)' --notes $notes `(Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') `(Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') `(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') `(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256')
