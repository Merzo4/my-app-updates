name: Merzo Windows Optimizer R47 SIMPLE BUILDS

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/build-mwo-r47-simple-builds.yml'
      - 'optimizer/patches/r47_simple_builds.py'

permissions:
  contents: write

concurrency:
  group: mwo-r47-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne29){throw "Source parts missing: $($parts.Count)"}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r47.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r47.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r47|Out-Null;tar -xf r47.tar.xz -C r47
          $sln=Get-ChildItem r47 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Apply exact cumulative R24-R47 chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          $patches=@('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py','r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py','r39_gaming_build_catalog.py','r39_gaming_build_engine.py','r39_gaming_build_ui.py','r39_finalize.py','r40_network_binding_hotfix.py','r42_full_ui_rework.py','r42_window_contract_fix.py','r43_true_full_ui.py','r44_function_expansion.py','r44_finalize.py','r45_apply_selected_ux.py','r46_security_layout_hardening.py','r46_binding_finalize.py','r47_simple_builds.py')
          foreach($p in $patches){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}
          $ss=Get-Content $f -Raw;$ss=[regex]::Replace($ss,'Merzo Windows Optimizer — PRODUCTION R\d+[^"\r\n]*SelfTest','Merzo Windows Optimizer — PRODUCTION R47 SIMPLE BUILDS SelfTest');Set-Content $f $ss -Encoding UTF8

      - name: R47 simple-build security and layout gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,json,xml.etree.ElementTree as ET
          from pathlib import Path
          r=Path(os.environ['SOURCE_ROOT']);xp=r/'src/MerzoOptimizer.App/MainWindow.xaml';x=xp.read_text(encoding='utf-8-sig')
          u=(r/'src/MerzoOptimizer.Windows/Updates/GitHubUpdateService.cs').read_text(encoding='utf-8-sig')
          b=(r/'src/MerzoOptimizer.Windows/Elevation/ElevatedOperationBroker.cs').read_text(encoding='utf-8-sig')
          h=(r/'src/MerzoOptimizer.ElevatedHelper/Program.cs').read_text(encoding='utf-8-sig')
          for t in ['Width="1000" Height="600"','MinWidth="920" MinHeight="560"','Production 0.1.47','Production R47','Сборки Windows','Экспертные инструменты','Выбрать ЛАЙТ','Выбрать GAME','Выбрать EXTREME','Установить сборку','OptimizationApplyBar']:
              assert t in x,t
          for i in range(12): assert f'x:Name="PageRoot{i}"' in x,f'PageRoot{i}'
          assert x.count('Content="Выбрать ЛАЙТ"')==1
          assert x.count('Content="Выбрать GAME"')==1
          assert x.count('Content="Выбрать EXTREME"')==1
          root=ET.parse(xp).getroot();ns='{http://schemas.microsoft.com/winfx/2006/xaml/presentation}';xn='{http://schemas.microsoft.com/winfx/2006/xaml}'
          main=next(z for z in root.iter(ns+'TabControl') if z.attrib.get(xn+'Name')=='MainTabs');assert len([c for c in list(main) if c.tag==ns+'TabItem'])==12
          required_oneway={'IsBusy','HasOptimizationScanResults','IsLightRecommended','IsStandardRecommended','DeepScanProgress','NetworkProgress','IsBalancedPowerActive','IsPerformancePowerActive','IsStartupUpdateNoticeVisible','UpdateProgress'}
          seen=set()
          for e in root.iter():
              for val in e.attrib.values():
                  if not val.startswith('{Binding '): continue
                  prop=val[len('{Binding '):].split(',',1)[0].split('}',1)[0].strip()
                  if prop in required_oneway:
                      seen.add(prop);assert 'Mode=OneWay' in val,(prop,val)
          assert not(required_oneway-seen),('missing OneWay',sorted(required_oneway-seen))
          tweaks=json.loads((r/'data/tweaks.json').read_text(encoding='utf-8-sig'))
          def ids(tag): return {t['id'] for t in tweaks if not t.get('scan_only',False) and tag in t.get('profile_tags',[])}
          light,game,extreme=ids('merzo_light'),ids('merzo_game'),ids('merzo_extreme')
          assert len(light)>=80 and len(game)>len(light) and len(extreme)>len(game),(len(light),len(game),len(extreme))
          assert light < game < extreme
          assert {'explorer.launch_this_pc','explorer.classic_context_menu'} <= light
          ctx=next(t for t in tweaks if t['id']=='explorer.classic_context_menu')
          a=ctx['registry_actions'][0];assert a['hive']=='CurrentUser' and a['value_name']=='' and '86ca1aa0-34aa-4e8b-a509-50c905bae2a2' in a['key_path']
          for bad in ['legacy.defender_policy_disabled','legacy.defender_realtime_disabled','legacy.windows_update_disabled','legacy.ipv6_disabled']:
              t=next(z for z in tweaks if z['id']==bad);assert t.get('scan_only',False) and not any(q.startswith('merzo_') for q in t.get('profile_tags',[])),bad
          for t in ['OfficialOwner = "Merzo4"','OfficialRepository = "my-app-updates"','OfficialInstallerName = "MerzoWindowsOptimizerSetup-win-x64.exe"','MaximumInstallerBytes','FixedTimeShaEquals','FileShare.None','VerifiedSize','IsOfficialReleaseAssetUrl','ParseSidecarSha256','ContentLength']: assert t in u,t
          for t in ['MERZO-ELEVATION/46','GetNamedPipeClientProcessId','--parent-pid','--nonce','RandomNumberGenerator','FileVersionInfo']: assert t in b,t
          for t in ['MERZO-ELEVATION/46','GetNamedPipeServerProcessId','--parent-pid','--nonce','ValidateSnapshotAsync','ValidateKnownServiceAsync','ValidateKnownTaskAsync','ValidateStartupDynamicTweak','RequiresAdmin','ScanOnly']: assert t in h,t
          print(f'R47 SOURCE GATE PASS LIGHT={len(light)} GAME={len(game)} EXTREME={len(extreme)}')
          '@|python
          if($LASTEXITCODE-ne0){throw 'R47 source gate failed'}
          foreach($p in Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src') -Recurse -Filter *.csproj){$z=Get-Content $p.FullName -Raw;if($z-match'<AssemblyVersion>([^<]+)</AssemblyVersion>'-and$Matches[1]-ne'0.1.47.0'){throw "Assembly $($p.Name): $($Matches[1])"};if($z-match'<FileVersion>([^<]+)</FileVersion>'-and$Matches[1]-ne'0.1.47.0'){throw "File $($p.Name): $($Matches[1])"}}
          if(-not(Test-Path (Join-Path $env:SOURCE_ROOT 'R47_SIMPLE_BUILDS.marker'))){throw 'R47 marker missing'}
          $n=Get-Content (Join-Path $env:SOURCE_ROOT 'data\release_notes.json') -Raw|ConvertFrom-Json;if($n.version-ne'0.1.47'){throw 'Release notes version'}

      - name: Build 0.1.47 without Obfuscar
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try{& .\build\Build-Production.ps1 -Version '0.1.47' -SkipObfuscation;if($LASTEXITCODE-ne0){throw 'Production build failed'}}finally{Pop-Location}

      - name: Core SelfTest XAML binary gates
        shell: pwsh
        run: |
          dotnet run --project (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\MerzoOptimizer.SelfTest.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'SelfTest failed'}
          $dist=Join-Path $env:SOURCE_ROOT 'dist\app'
          foreach($n in @('MerzoWindowsOptimizer.dll','MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){$p=Join-Path $dist $n;if(-not(Test-Path $p)){throw "Missing $n"};$v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();if($v-ne'0.1.47.0'){throw "$n version $v"}}
          if(Get-ChildItem $dist -Recurse -File|?{$_.Name-match'Obfuscar'}){throw 'Obfuscar artifact'}
          foreach($f in Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App') -Recurse -Filter *.xaml|?{$_.FullName-notmatch'\\(bin|obj)\\'}){try{[xml](Get-Content $f.FullName -Raw)|Out-Null}catch{throw "Malformed XAML $($f.FullName): $($_.Exception.Message)"}}

      - name: Runtime WPF bounds all 12 pages
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'r47layout';New-Item -ItemType Directory -Force $d|Out-Null;$ap=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MerzoOptimizer.App.csproj'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><ProjectReference Include="$ap" /></ItemGroup></Project>
          "@|Set-Content (Join-Path $d 'p.csproj') -Encoding UTF8
          @'
          using System.Windows;using System.Windows.Controls;using System.Windows.Media;using MerzoOptimizer.App;static FrameworkElement N(DependencyObject p,string n){if(p is FrameworkElement f&&f.Name==n)return f;for(int i=0;i<VisualTreeHelper.GetChildrenCount(p);i++){var r=N(VisualTreeHelper.GetChild(p,i),n);if(r!=null)return r;}return null!;}static bool I(FrameworkElement c,FrameworkElement a){var p=c.TransformToAncestor(a).Transform(new Point(0,0));return p.X>=-2&&p.Y>=-2&&p.X+c.ActualWidth<=a.ActualWidth+2&&p.Y+c.ActualHeight<=a.ActualHeight+2;}[STAThread]static void Main(){var a=new App();a.InitializeComponent();foreach(var s in new[]{(1000d,600d),(920d,560d)}){var w=new MainWindow{Width=s.Item1,Height=s.Item2,Left=-20000,Top=-20000,ShowInTaskbar=false,ShowActivated=false};w.Show();w.UpdateLayout();var t=(TabControl)N(w,"MainTabs");var side=N(w,"SidebarProtectedModeCard");if(side is null||!I(side,w))throw new Exception("sidebar bottom overflow");for(int i=0;i<12;i++){t.SelectedIndex=i;w.UpdateLayout();var r=N(w,$"PageRoot{i}");if(r is null||r.ActualWidth<1||r.ActualHeight<1||!I(r,w))throw new Exception($"PageRoot{i} overflow at {s}");}t.SelectedIndex=2;w.UpdateLayout();var bar=N(w,"OptimizationApplyBar");if(bar is null||!I(bar,w))throw new Exception("R47 build action bar overflow");w.Close();}a.Shutdown();Console.WriteLine("R47_LAYOUT_12_PAGES_PASS");}
          '@|Set-Content (Join-Path $d 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $d 'p.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Layout probe failed'}

      - name: Dispatcher and network read-only smokes
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'r47smoke';New-Item -ItemType Directory -Force $d|Out-Null;$core=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll'));$win=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Windows.dll'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$core</HintPath><Private>true</Private></Reference><Reference Include="MerzoOptimizer.Windows"><HintPath>$win</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $d 's.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Dispatching;using MerzoOptimizer.Core.Network;using MerzoOptimizer.Windows.Elevation;using MerzoOptimizer.Windows.Network;using var d=new AsyncOperationDispatcher(2);var v=await d.RunAsync("r47",_=>Task.FromResult(47));if(v!=47)throw new Exception();await d.RunAsync("void",_=>Task.CompletedTask);var p=Path.Combine(Path.GetTempPath(),"mwo-r47-net");Directory.CreateDirectory(p);await using var b=new ElevatedOperationBroker(p,p,p);INetworkRepairService n=new WindowsNetworkRepairService(b);await n.DiagnoseAsync();Console.WriteLine("R47_RUNTIME_SMOKES_PASS");
          '@|Set-Content (Join-Path $d 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $d 's.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Runtime smoke failed'}

      - name: Full EXE startup smoke
        shell: pwsh
        run: |
          $e=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe';$p=Start-Process $e -WorkingDirectory (Split-Path $e) -PassThru;Start-Sleep 20;if($p.HasExited){throw "App exited $($p.ExitCode)"};Stop-Process -Id $p.Id -Force;Write-Host 'R47 FULL EXE STARTUP PASS'

      - name: Build installer portable and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $app=Join-Path $env:SOURCE_ROOT 'dist\app';$dist=Join-Path $env:SOURCE_ROOT 'dist';$zip=Join-Path $dist 'MerzoWindowsOptimizer-portable-win-x64.zip';if(Test-Path $zip){Remove-Item $zip -Force};Compress-Archive -Path (Join-Path $app '*') -DestinationPath $zip -CompressionLevel Optimal
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|Select-Object -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT
          try{& $iscc '/DMyAppVersion=0.1.47' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne0){throw 'Installer build failed'}}finally{Pop-Location}
          $exe=Join-Path $dist 'MerzoWindowsOptimizerSetup-win-x64.exe';if(-not(Test-Path $exe)){throw 'Installer missing'}
          $eh=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant();"$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$exe.sha256" -Encoding ascii;"$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$zip.sha256" -Encoding ascii
          Write-Host "R47_INSTALLER_SHA256=$eh";Write-Host "R47_PORTABLE_SHA256=$zh"

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.47-R47-SIMPLE-BUILDS
          path: |
            r47/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r47/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r47/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r47/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.47 after all gates
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$tag='mwo-v0.1.47';$d=Join-Path $env:SOURCE_ROOT 'dist';gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes 2>$null;if($LASTEXITCODE-ne0){$global:LASTEXITCODE=0};git push origin ":refs/tags/$tag" 2>$null;if($LASTEXITCODE-ne0){$global:LASTEXITCODE=0}
          $notes=Join-Path $env:RUNNER_TEMP 'r47-notes.txt'
          @'
          R47 SIMPLE BUILDS

          • Основной интерфейс упрощён: Главная / Сборки / Очистка / Восстановление / Обновления.
          • Старые подробные разделы сохранены в сворачиваемом «Экспертные инструменты».
          • ЛАЙТ: privacy/telemetry, реклама/предложения, фон, Explorer → Этот компьютер, классическое контекстное меню Windows 11.
          • GAME полностью включает ЛАЙТ + performance/game tweaks + Gaming Network SAFE.
          • EXTREME полностью включает GAME + агрессивные обратимые настройки + Gaming Network EXTREME.
          • Критические Defender / Windows Update / Store / IPv6 / pagefile не отключаются.
          • Snapshot → Apply → Verify → Log → Undo/Restore и security hardening R46 сохранены.
          '@|Set-Content $notes -Encoding UTF8
          $files=@((Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe'),(Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256'),(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip'),(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256'))
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.47 (R47 SIMPLE BUILDS)' --notes-file $notes @files
          if($LASTEXITCODE-ne0){throw 'Release publish failed'}
