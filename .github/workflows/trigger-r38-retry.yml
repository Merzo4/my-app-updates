name: Trigger R38 retry
on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/trigger-r38-retry.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch R38 production workflow
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run build-mwo-r38-gaming-extreme.yml --repo "$GITHUB_REPOSITORY" --ref merzo-windows-optimizer
