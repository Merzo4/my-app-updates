name: Trigger R36 retry

on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/trigger-r36-retry.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch R36 production workflow
        env:
          GH_TOKEN: '${{ github.token }}'
        run: gh workflow run build-mwo-r36-gaming-ui-polish.yml --repo "$GITHUB_REPOSITORY" --ref merzo-windows-optimizer
