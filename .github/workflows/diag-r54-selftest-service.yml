name: Diagnose R54 service SelfTest contract

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/diag-r54-selftest-service.yml'
      - 'optimizer/scripts/r54_selftest_service_diag.ps1'

permissions:
  contents: write

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct R54 and capture SelfTest
        shell: pwsh
        run: .\optimizer\scripts\r54_selftest_service_diag.ps1
      - name: Commit diagnostic
        shell: pwsh
        run: |
          $saved=Join-Path $env:RUNNER_TEMP 'R54_SELFTEST_SERVICE_DIAG.txt'
          Copy-Item '.\optimizer\R54_SELFTEST_SERVICE_DIAG.txt' $saved -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin merzo-windows-optimizer
          git reset --hard origin/merzo-windows-optimizer
          Copy-Item $saved '.\optimizer\R54_SELFTEST_SERVICE_DIAG.txt' -Force
          git add optimizer/R54_SELFTEST_SERVICE_DIAG.txt
          git diff --cached --quiet
          if($LASTEXITCODE-ne0){git commit -m 'diag: record R54 service SelfTest contract'; git push origin HEAD:merzo-windows-optimizer}
