name: MONITOR R50 UI RELIABILITY

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/monitor-r50-ui-reliability.yml']

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait for latest R50 V4 and save exact status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          id=""
          for i in $(seq 1 40); do
            id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mwo-r50-ui-reliability.yml --branch merzo-windows-optimizer --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            [ -n "$id" ] && break
            sleep 10
          done
          [ -n "$id" ] || { echo 'R50 run not found'; exit 1; }
          for i in $(seq 1 80); do
            status=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            [ "$status" = "completed" ] && break
            sleep 10
          done
          gh run view "$id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > optimizer/R50_CI_STATUS.json
          conclusion=$(jq -r '.conclusion' optimizer/R50_CI_STATUS.json)
          if [ "$conclusion" != "success" ]; then
            gh run view "$id" --repo "$GITHUB_REPOSITORY" --log-failed > optimizer/R50_CI_FAILED.log || true
          else
            rm -f optimizer/R50_CI_FAILED.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R50_CI_STATUS.json optimizer/R50_CI_FAILED.log 2>/dev/null || true
          git commit -m "diag: record R50 CI result" || true
          git push
