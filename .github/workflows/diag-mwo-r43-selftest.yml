name: Diagnose R43 SelfTest UI contracts
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diag-mwo-r43-selftest.yml']
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source and print UI contracts
        shell: pwsh
        run: |
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('s.tar.xz',[Convert]::FromBase64String($b.ToString()))
          New-Item -ItemType Directory -Force s|Out-Null;tar -xf s.tar.xz -C s
          $f=Get-ChildItem s -Recurse -Filter Program.cs|Where-Object {$_.FullName -match 'MerzoOptimizer.SelfTest'}|Select-Object -First 1
          if(-not$f){throw 'SelfTest Program.cs missing'}
          $patterns=@('HasOptimizationScanResults','IsLightRecommended','IsStandardRecommended','IsBalancedPowerActive','IsPerformancePowerActive','Compact Cleanup cards missing','Все схемы Windows')
          foreach($p in $patterns){Write-Host "===== $p =====";Select-String -Path $f.FullName -Pattern ([regex]::Escape($p)) -Context 4,4|ForEach-Object {$_.Context.PreContext; $_.Line; $_.Context.PostContext}}
