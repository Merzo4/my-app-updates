name: Verify MWO Public R54 to R54.1 OTA

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/verify-mwo-r54-to-r54-1-public-ota.yml'
      - 'optimizer/scripts/r54_1_public_ota_acceptance.ps1'
      - 'optimizer/scripts/r54_1_r54_download_probe.ps1'
      - 'optimizer/triggers/r54-1-public-ota.txt'

permissions:
  contents: write

concurrency:
  group: mwo-r54-to-r54-1-public-ota
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run public R54 to R54.1 acceptance
        id: accept
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\optimizer\scripts\r54_1_public_ota_acceptance.ps1
      - name: Record public R54 to R54.1 acceptance status
        if: always()
        shell: pwsh
        run: |
          $status='optimizer/R54_1_PUBLIC_OTA_STATUS.json'
          $fresh=$false
          if(Test-Path $status){try{$current=Get-Content $status -Raw|ConvertFrom-Json;$fresh=([long]$current.databaseId -eq [long]$env:GITHUB_RUN_ID)}catch{}}
          if(!$fresh){@{conclusion='failure';createdAt=(Get-Date).ToUniversalTime().ToString('o');databaseId=[long]$env:GITHUB_RUN_ID;headSha=$env:GITHUB_SHA;acceptOutcome='${{ steps.accept.outcome }}';error='Public OTA acceptance did not create fresh status; inspect run'}|ConvertTo-Json -Compress|Set-Content $status -Encoding UTF8}
          $saved=Join-Path $env:RUNNER_TEMP 'R54_1_PUBLIC_OTA_STATUS.json';Copy-Item $status $saved -Force
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git fetch origin merzo-windows-optimizer;git reset --hard origin/merzo-windows-optimizer;Copy-Item $saved $status -Force;git add $status;git diff --cached --quiet
          if($LASTEXITCODE-ne0){git commit -m "Record public R54 to R54.1 OTA run $env:GITHUB_RUN_ID";git push origin HEAD:merzo-windows-optimizer}
          if('${{ steps.accept.outcome }}'-ne'success'){exit 1}
