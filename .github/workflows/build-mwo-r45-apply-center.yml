name: Merzo Windows Optimizer R45 APPLY CENTER

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r45-apply-center.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r45.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r45.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r45|Out-Null;tar -xf r45.tar.xz -C r45
          $sln=Get-ChildItem r45 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Apply cumulative R24-R45
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          $patches=@(
            'r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py',
            'r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py',
            'r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py',
            'r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py',
            'r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py',
            'r39_gaming_build_catalog.py','r39_gaming_build_engine.py','r39_gaming_build_ui.py','r39_finalize.py',
            'r40_network_binding_hotfix.py','r42_full_ui_rework.py','r42_window_contract_fix.py','r43_true_full_ui.py',
            'r44_function_expansion.py','r44_finalize.py','r45_apply_selected_ux.py'
          )
          foreach($p in $patches){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}
          $self=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$ss=Get-Content $self -Raw
          $ss=[regex]::Replace($ss,'Merzo Windows Optimizer — PRODUCTION R\d+[^"\r\n]*SelfTest','Merzo Windows Optimizer — PRODUCTION R45 APPLY CENTER SelfTest')
          $ss=$ss.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R45 APPLY CENTER SelfTest');Set-Content $self $ss -Encoding UTF8

      - name: Version preflight
        shell: pwsh
        run: |
          foreach($p in Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src') -Recurse -Filter *.csproj){$x=Get-Content $p.FullName -Raw;if($x-match'<AssemblyVersion>([^<]+)</AssemblyVersion>' -and $Matches[1]-ne'0.1.45.0'){throw "AssemblyVersion $($p.Name): $($Matches[1])"};if($x-match'<FileVersion>([^<]+)</FileVersion>' -and $Matches[1]-ne'0.1.45.0'){throw "FileVersion $($p.Name): $($Matches[1])"}}
          if(-not(Test-Path (Join-Path $env:SOURCE_ROOT 'R45_APPLY_CENTER.marker'))){throw 'R45 marker missing'}

      - name: Build 0.1.45 without Obfuscar
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try{& .\build\Build-Production.ps1 -Version '0.1.45' -SkipObfuscation;if($LASTEXITCODE-ne0){throw 'Production build failed'}}finally{Pop-Location}

      - name: Core SelfTest
        shell: pwsh
        run: |
          dotnet run --project (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\MerzoOptimizer.SelfTest.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Core SelfTest failed'}

      - name: R45 Apply Center regression gate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$root=$env:SOURCE_ROOT;$dist=Join-Path $root 'dist\app'
          foreach($name in @('MerzoWindowsOptimizer.dll','MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){$p=Join-Path $dist $name;if(-not(Test-Path $p)){throw "Missing $name"};$v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();if($v-ne'0.1.45.0'){throw "$name version $v"}}
          $fv=[Diagnostics.FileVersionInfo]::GetVersionInfo((Join-Path $dist 'MerzoWindowsOptimizer.exe'));if(-not$fv.FileVersion.StartsWith('0.1.45')){throw "EXE version $($fv.FileVersion)"}
          @'
          import os,re,xml.etree.ElementTree as ET
          from pathlib import Path
          root=Path(os.environ['SOURCE_ROOT']);x=(root/'src'/'MerzoOptimizer.App'/'MainWindow.xaml').read_text(encoding='utf-8-sig');v=(root/'src'/'MerzoOptimizer.App'/'ViewModels'/'MainWindowViewModel.cs').read_text(encoding='utf-8-sig')
          must=['Production 0.1.45','Production R45','ВЫБРАНО ДЛЯ ПРИМЕНЕНИЯ','Content="Применить выбранное"','Command="{Binding ApplySelectedTweaksCommand}"','Privacy / Telemetry Center 2.0','Smart Audit 2.0','Profiles 2.0','ProgressBar Value="{Binding NetworkProgress, Mode=OneWay}"']
          for t in must:
              if t not in x: raise SystemExit('R45 UI missing '+t)
          if 'Content="Выбрать Privacy SAFE"' in x or 'Content="Выбрать Privacy STRICT"' in x or 'Content="Выбрать Privacy MAX"' in x: raise SystemExit('Misleading Privacy label survived')
          def body(name):
              m=re.search(r'\n    private\s+(?:async\s+)?(?:Task|void|int|string|bool)\s+'+re.escape(name)+r'\s*\(',v)
              if not m: raise SystemExit('method missing '+name)
              n=re.search(r'\n    private\s+',v[m.end():]);return v[m.start():(m.end()+n.start() if n else len(v))]
          for name in ['SelectGamingTaggedPresetAsync','SelectNamedCategoryPresetAsync','SelectCategoryProfileAsync','SelectProfileAsync']:
              b=body(name)
              if 'SelectedOptimizationTabIndex = 3;' not in b: raise SystemExit(name+' does not open Selected tab')
              if 'SelectedOptimizationTabIndex = 2;' in b: raise SystemExit(name+' still opens By-one tab')
          b=body('ApplySelectedTweaksAsync')
          if 'SelectedOptimizationTabIndex = 4;' not in b: raise SystemExit('Apply does not open Work tab')
          b=body('RunDeepOptimizationScanAsync')
          if 'SelectedOptimizationTabIndex=4;' not in b: raise SystemExit('Deep scan does not open Work tab')
          r=ET.parse(root/'src'/'MerzoOptimizer.App'/'MainWindow.xaml').getroot();ns='{http://schemas.microsoft.com/winfx/2006/xaml/presentation}';xn='{http://schemas.microsoft.com/winfx/2006/xaml}'
          main=next((e for e in r.iter(ns+'TabControl') if e.attrib.get(xn+'Name')=='MainTabs'),None);pages=[c for c in list(main) if c.tag==ns+'TabItem']
          if len(pages)!=12: raise SystemExit(f'top pages={len(pages)}')
          print('R45 APPLY CENTER GATE PASS')
          '@|python
          if($LASTEXITCODE-ne0){throw 'R45 UX gate failed'}
          $tw=Get-Content (Join-Path $root 'data\tweaks.json') -Raw|ConvertFrom-Json;$sv=Get-Content (Join-Path $root 'data\service_rules.json') -Raw|ConvertFrom-Json;$tk=Get-Content (Join-Path $root 'data\task_rules.json') -Raw|ConvertFrom-Json
          if($tw.Count-lt188-or$sv.Count-lt39-or$tk.Count-lt24){throw "Catalog regression $($tw.Count)/$($sv.Count)/$($tk.Count)"}
          $settings=Get-Content (Join-Path $root 'data\update_settings.json') -Raw|ConvertFrom-Json;if(-not$settings.auto_check-or$settings.auto_download-or$settings.auto_install){throw 'Update policy regression'}
          $notes=Get-Content (Join-Path $root 'data\release_notes.json') -Raw|ConvertFrom-Json;if($notes.version-ne'0.1.45'){throw 'Release notes version'}
          if(Get-ChildItem $dist -Recurse -File|?{$_.Name-match'Obfuscar'}){throw 'Obfuscar artifact'}

      - name: XAML load gate
        shell: pwsh
        run: |
          foreach($f in Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App') -Recurse -Filter *.xaml|?{$_.FullName-notmatch'\\(bin|obj)\\'}){try{[xml](Get-Content $f.FullName -Raw)|Out-Null}catch{throw "Malformed XAML $($f.FullName): $($_.Exception.Message)"}}

      - name: Dispatcher runtime smoke
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'r45d';New-Item -ItemType Directory -Force $d|Out-Null;$core=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll'));@" 
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$core</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $d 'Smoke.csproj') -Encoding UTF8
          'using MerzoOptimizer.Core.Dispatching; using var d=new AsyncOperationDispatcher(2); var v=await d.RunAsync("r45",_=>Task.FromResult(45)); if(v!=45) throw new Exception(); await d.RunAsync("void",_=>Task.CompletedTask); Console.WriteLine("R45_DISPATCHER_PASS");'|Set-Content (Join-Path $d 'Program.cs') -Encoding UTF8;dotnet run --project (Join-Path $d 'Smoke.csproj') -c Release;if($LASTEXITCODE-ne0){throw 'Dispatcher smoke failed'}

      - name: Network runtime smoke
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'r45n';New-Item -ItemType Directory -Force $d|Out-Null;$core=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll'));$win=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Windows.dll'));@"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$core</HintPath><Private>true</Private></Reference><Reference Include="MerzoOptimizer.Windows"><HintPath>$win</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $d 'Smoke.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Network;using MerzoOptimizer.Windows.Elevation;using MerzoOptimizer.Windows.Network;var t=Path.Combine(Path.GetTempPath(),"merzo-r45-net");Directory.CreateDirectory(t);await using var b=new ElevatedOperationBroker(t,t,t);INetworkRepairService s=new WindowsNetworkRepairService(b);var r=await s.DiagnoseAsync();foreach(var m in new[]{"ApplyGamingNetworkSafeAsync","ApplyGamingNetworkExtremeAsync","RestoreGamingNetworkAsync"})if(typeof(INetworkRepairService).GetMethod(m)is null)throw new Exception(m);Console.WriteLine("R45_NETWORK_PASS "+r.AdapterName);
          '@|Set-Content (Join-Path $d 'Program.cs') -Encoding UTF8;dotnet run --project (Join-Path $d 'Smoke.csproj') -c Release;if($LASTEXITCODE-ne0){throw 'Network smoke failed'}

      - name: Full EXE startup smoke
        shell: pwsh
        run: |
          $exe=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe';$p=Start-Process $exe -WorkingDirectory (Split-Path $exe) -PassThru;Start-Sleep 20;if($p.HasExited){throw "App exited $($p.ExitCode)"};Stop-Process $p.Id -Force

      - name: Rebuild portable ZIP
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip';if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer + SHA256
        shell: pwsh
        run: |
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|Select-Object -First 1;if(-not$iscc){throw 'ISCC missing'};Push-Location $env:SOURCE_ROOT
          try{& $iscc '/DMyAppVersion=0.1.45' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne0){throw 'Installer failed'};$e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip';$eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant();"$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii;"$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii}finally{Pop-Location}

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.45-R45-APPLY-CENTER
          path: |
            r45/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r45/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r45/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r45/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.45
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='mwo-v0.1.45';$d=Join-Path $env:SOURCE_ROOT 'dist';gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes 2>$null;if($LASTEXITCODE-ne0){$global:LASTEXITCODE=0};git push origin ":refs/tags/$tag" 2>$null;if($LASTEXITCODE-ne0){$global:LASTEXITCODE=0};$n=Join-Path $env:RUNNER_TEMP 'r45.txt'
          @'
          R45 APPLY CENTER

          • Исправлена причина: R44 Privacy-вкладка сдвинула индексы, поэтому MAXIMUM/LIGHT/STANDARD открывали «По одной».
          • После выбора профиля открывается «Выбранное».
          • Внизу всей страницы «Оптимизация» теперь всегда видна панель «Применить выбранное».
          • Ручной выбор «По одной» можно применить сразу, без поиска кнопки на другой вкладке.
          • После запуска автоматически открывается «Ход работы».
          • Privacy-кнопки теперь честно подписаны «Применить …».
          • Вся логика R44, Snapshot/Undo, Gaming, Network и Update Center сохранена.
          '@|Set-Content $n -Encoding UTF8
          $files=@((Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe'),(Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256'),(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip'),(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256'));gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.45 (R45 APPLY CENTER)' --notes-file $n @files;if($LASTEXITCODE-ne0){throw 'Release publish failed'}
