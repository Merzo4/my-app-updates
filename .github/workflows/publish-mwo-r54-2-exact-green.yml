name: Publish MWO R54.2 Exact Green

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/publish-mwo-r54-2-exact-green.yml'
      - 'optimizer/scripts/publish_r54_2_exact_green.ps1'
      - 'optimizer/triggers/r54-2-publish.txt'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download exact green R54.2 artifact
        uses: actions/download-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.54.2-ONEDRIVE-GAME-RELIABILITY
          path: artifact
          run-id: 32270447478
          github-token: ${{ github.token }}
      - name: Publish exact green R54.2
        id: publish
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\optimizer\scripts\publish_r54_2_exact_green.ps1 -ArtifactDir '.\artifact'
      - name: Record publication status
        if: always()
        shell: pwsh
        run: |
          $status='optimizer/R54_2_PUBLISH_STATUS.json'
          $fresh=$false
          if(Test-Path $status){
            try {
              $current=Get-Content $status -Raw | ConvertFrom-Json
              $fresh=([long]$current.databaseId -eq [long]$env:GITHUB_RUN_ID -and $current.conclusion -eq 'success' -and [long]$current.buildRun -eq 32270447478 -and [long]$current.artifactId -eq 9372048444)
            } catch {}
          }
          if(!$fresh){
            @{
              conclusion='failure'
              createdAt=(Get-Date).ToUniversalTime().ToString('o')
              databaseId=[long]$env:GITHUB_RUN_ID
              publishOutcome='${{ steps.publish.outcome }}'
              headSha=$env:GITHUB_SHA
              buildRun=32270447478
              artifactId=9372048444
              error='R54.2 publication did not create a fresh exact-artifact success status; inspect this run log'
            } | ConvertTo-Json -Compress | Set-Content $status -Encoding UTF8
          }
          $saved=Join-Path $env:RUNNER_TEMP 'R54_2_PUBLISH_STATUS.json'
          Copy-Item $status $saved -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $pushed=$false
          for($attempt=1;$attempt-le5 -and !$pushed;$attempt++){
            git fetch origin merzo-windows-optimizer
            git reset --hard origin/merzo-windows-optimizer
            Copy-Item $saved $status -Force
            git add $status
            git diff --cached --quiet
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            git commit -m "Record R54.2 publish run $env:GITHUB_RUN_ID"
            git push origin HEAD:merzo-windows-optimizer
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            Start-Sleep -Seconds $attempt
          }
          if(!$pushed){throw 'Could not persist R54.2 publication status after retries'}
          if('${{ steps.publish.outcome }}'-ne'success' -or !$fresh){exit 1}
