name: Monitor MWO R54.2 GAME Mutation

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - 'optimizer/triggers/r54-2-game-mutation-monitor.txt'
      - '.github/workflows/monitor-mwo-r54-2-game-mutation.yml'

permissions:
  actions: read
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query and commit latest mutation runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $runs=gh run list --repo $env:GITHUB_REPOSITORY --workflow verify-mwo-r54-2-game-mutation.yml --branch merzo-windows-optimizer --limit 5 --json databaseId,status,conclusion,headSha,createdAt,updatedAt,event | ConvertFrom-Json
          @{createdAt=(Get-Date).ToUniversalTime().ToString('o');runs=$runs}|ConvertTo-Json -Depth 5 -Compress|Set-Content optimizer/R54_2_MUTATION_MONITOR.json -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R54_2_MUTATION_MONITOR.json
          git diff --cached --quiet
          if($LASTEXITCODE-ne0){git commit -m "Record R54.2 mutation monitor $env:GITHUB_RUN_ID";git push origin HEAD:merzo-windows-optimizer}
