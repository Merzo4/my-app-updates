name: Verify MWO R54 Public OTA v2

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/verify-mwo-r54-public-ota-v2.yml'
      - 'optimizer/triggers/r54-verify-v2.txt'

permissions:
  contents: write

concurrency:
  group: mwo-r54-public-ota-v2
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run public R53 to R54 acceptance with catalog-compatible JSON options
        id: accept
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source='.\optimizer\scripts\r54_public_ota_acceptance.ps1'
          $runtime='.\optimizer\scripts\r54_public_ota_acceptance_runtime.ps1'
          $text=Get-Content $source -Raw
          $old=@'
  $json=Get-Content $Catalog -Raw
  $items=[System.Text.Json.JsonSerializer]::Deserialize($json,$listType)
'@
          $new=@'
  $json=Get-Content $Catalog -Raw
  $options=[System.Text.Json.JsonSerializerOptions]::new()
  $options.PropertyNamingPolicy=[System.Text.Json.JsonNamingPolicy]::SnakeCaseLower
  $options.PropertyNameCaseInsensitive=$true
  $options.Converters.Add([System.Text.Json.Serialization.JsonStringEnumConverter]::new())
  $items=[System.Text.Json.JsonSerializer]::Deserialize($json,$listType,$options)
'@
          if(($text.Split($old).Count-1)-ne1){throw 'R54 acceptance JSON-options patch anchor mismatch'}
          Set-Content $runtime ($text.Replace($old,$new)) -Encoding UTF8
          try {
            & $runtime
            if($LASTEXITCODE-ne0){throw "R54 runtime acceptance failed: $LASTEXITCODE"}
          }
          finally {
            Remove-Item $runtime -Force -ErrorAction SilentlyContinue
          }

      - name: Record R54 v2 acceptance status
        if: always()
        shell: pwsh
        run: |
          $status='optimizer/R54_OTA_ACCEPTANCE_STATUS.json'
          if(!(Test-Path $status)){
            $fallback=@{
              conclusion='failure'
              createdAt=(Get-Date).ToUniversalTime().ToString('o')
              databaseId=[long]$env:GITHUB_RUN_ID
              headSha=$env:GITHUB_SHA
              error='R54 v2 acceptance did not create status file'
            } | ConvertTo-Json -Compress
            Set-Content $status $fallback -Encoding UTF8
          }
          $saved=Join-Path $env:RUNNER_TEMP 'R54_OTA_ACCEPTANCE_STATUS.json'
          Copy-Item $status $saved -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin merzo-windows-optimizer
          git reset --hard origin/merzo-windows-optimizer
          Copy-Item $saved $status -Force
          git add $status
          git diff --cached --quiet
          if($LASTEXITCODE-ne0){
            git commit -m "Record R54 v2 OTA acceptance run $env:GITHUB_RUN_ID"
            git push origin HEAD:merzo-windows-optimizer
          }
          if('${{ steps.accept.outcome }}'-ne'success'){exit 1}
