name: Inspect R40 optimization layout
on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/inspect-r40-optimization-layout.yml']
permissions: { contents: read }
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Restore and inspect
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('inspect.tar.xz',[Convert]::FromBase64String($b.ToString()))
          New-Item -ItemType Directory -Force inspect|Out-Null;tar -xf inspect.tar.xz -C inspect
          $sln=Get-ChildItem inspect -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          $env:SOURCE_ROOT=$sln.Directory.FullName
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py','r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py','r39_gaming_build_catalog.py','r39_gaming_build_engine.py','r39_gaming_build_ui.py','r39_finalize.py','r40_network_binding_hotfix.py')){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          $x=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml')
          for($i=0;$i-lt$x.Count;$i++){
            if($x[$i]-match 'LIGHT|STANDARD|MAXIMUM|LITE BUILD|GAME BUILD|Профили|По одной|Выбранное|Ход работы|Перейти к применению|Снять выбор'){
              $a=[math]::Max(0,$i-25);$z=[math]::Min($x.Count-1,$i+55)
              for($j=$a;$j-le$z;$j++){Write-Host (("{0:D4}: " -f ($j+1))+$x[$j])}
              Write-Host '---'
            }
          }
