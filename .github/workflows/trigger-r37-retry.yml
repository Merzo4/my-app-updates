name: Trigger R37 retry

on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/trigger-r37-retry.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch R37 production workflow
        env:
          GH_TOKEN: '${{ github.token }}'
        run: gh workflow run build-mwo-r37-operation-network.yml --repo "$GITHUB_REPOSITORY" --ref merzo-windows-optimizer
      - run: echo "R37 retry 5 - themed dialog owner overloads"
