name: MerzoStream Suite 0.1.0j CUMULATIVE Release

on:
  push:
    branches: [merzostream-010j-release]
    paths:
      - '.github/workflows/merzostream-010j-release.yml'
      - 'merzostream/ci/010j-patch/**'
      - 'merzostream/ci/apply_010j.py'
      - 'merzostream/ci/010j-release-notes.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct canonical 0.1.0h source
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'merzostream-010j-src'
          New-Item -ItemType Directory -Force $src | Out-Null
          "MERZO_SRC=$src" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:MERZO_SRC=$src
          python merzostream/ci/rebuild_010h.py
          if($LASTEXITCODE -ne 0){throw '0.1.0h source reconstruction failed'}

      - name: Restore canonical release support and brand
        shell: powershell
        run: |
          & .\merzostream\ci\make_brand.ps1
          if(-not(Test-Path "$env:MERZO_SRC\content\MerzoStreamSuite.ico")){throw 'ICO missing'}
          if(-not(Test-Path "$env:MERZO_SRC\content\MerzoStreamSuite.png")){throw 'PNG missing'}

      - name: Apply verified cumulative 0.1.0i base patch
        shell: pwsh
        run: |
          python merzostream/ci/apply_010i.py
          if($LASTEXITCODE -ne 0){throw '0.1.0i patch failed'}

      - name: Apply verified cumulative 0.1.0j patch
        shell: pwsh
        run: |
          python merzostream/ci/apply_010j.py
          if($LASTEXITCODE -ne 0){throw '0.1.0j patch failed'}

      - name: Verify source identity and JavaScript
        shell: pwsh
        run: |
          $info=Get-Content "$env:MERZO_SRC\content\app_info.json" -Raw | ConvertFrom-Json
          if($info.version -ne '0.1.0j'){throw "Wrong version $($info.version)"}
          $backend=Get-Content "$env:MERZO_SRC\src\MerzoStream.Host\DotNetBackend.cs" -Raw
          $player=Get-Content "$env:MERZO_SRC\src\MerzoStream.Foundation\Services\LocalPlayerServer.cs" -Raw
          $ui=Get-Content "$env:MERZO_SRC\ui\web\app.js" -Raw
          $css=Get-Content "$env:MERZO_SRC\ui\web\styles.css" -Raw
          if(-not $backend.Contains('OverlayMessageTemplate')){throw 'Chat HTML template backend missing'}
          if(-not $backend.Contains('_media.Control("stop", default)')){throw 'Media shutdown stop missing'}
          if(-not $player.Contains('{{platform_icon}}')){throw 'OBS chat platform icon template missing'}
          if(-not $player.Contains('background:transparent!important')){throw 'Transparent player contract missing'}
          if(-not $ui.Contains('chatDemoRows')){throw 'Chat live demo missing'}
          if(-not $css.Contains('appearance:none')){throw 'White unchecked platform checkbox style missing'}
          node --check "$env:MERZO_SRC\ui\web\app.js"
          if($LASTEXITCODE -ne 0){throw 'app.js syntax failed'}
          node --check "$env:MERZO_SRC\ui\web\concept.js"
          if($LASTEXITCODE -ne 0){throw 'concept.js syntax failed'}
          Write-Host 'SOURCE + CHAT DESIGNER + JS PASS'

      - name: Static Pure .NET selftest
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./SELFTEST_PURE_DOTNET_STATIC.ps1
          if($LASTEXITCODE -ne 0){throw 'Static selftest failed'}

      - name: Restore and compile full solution
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          dotnet restore MerzoStream.NetHost.sln
          if($LASTEXITCODE -ne 0){throw 'dotnet restore failed'}
          dotnet build MerzoStream.NetHost.sln -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'dotnet build failed'}

      - name: Foundation selftest
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          dotnet run --project tools/MerzoStream.Foundation.SelfTest/MerzoStream.Foundation.SelfTest.csproj -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'Foundation selftest failed'}

      - name: Build self-contained runtime
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./06_BUILD_RUNTIME_RELEASE.ps1 -Version '0.1.0j' -Runtime 'win-x64'
          if($LASTEXITCODE -ne 0){throw 'Runtime build failed'}
          if(-not(Test-Path 'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0j.zip')){throw 'Runtime ZIP missing'}

      - name: Build single-file installer
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./08_BUILD_BRANDED_SETUP.ps1 -Version '0.1.0j' -RuntimeZip 'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0j.zip'
          if($LASTEXITCODE -ne 0){throw 'Installer build failed'}
          $exe='artifacts/branded-setup/MerzoStreamSuite_Setup.exe'
          if(-not(Test-Path $exe)){throw 'Installer EXE missing'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$exe.sha256" "$sha  MerzoStreamSuite_Setup.exe" -Encoding ascii
          Write-Host "INSTALLER PASS SHA=$sha SIZE=$((Get-Item $exe).Length)"

      - name: Verify runtime package
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          $check=Join-Path $env:RUNNER_TEMP 'runtime-check-j'
          Expand-Archive 'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0j.zip' $check -Force
          $exe=Get-ChildItem $check -Recurse -File -Filter 'MerzoStream.Host.exe' | Select-Object -First 1
          if(-not $exe){throw 'MerzoStream.Host.exe missing'}
          $info=Get-ChildItem $check -Recurse -File -Filter 'app_info.json' | Select-Object -First 1
          if(-not $info){throw 'app_info.json missing'}
          $j=Get-Content $info.FullName -Raw | ConvertFrom-Json
          if($j.version -ne '0.1.0j'){throw "Runtime version mismatch $($j.version)"}
          Write-Host 'RUNTIME CONTENT PASS'

      - name: Create canonical source ZIP
        shell: pwsh
        run: |
          $dst=Join-Path $env:RUNNER_TEMP 'MerzoStreamSuite_0.1.0j_SOURCE.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'source-stage-j'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Get-ChildItem $env:MERZO_SRC -Force | Where-Object { $_.Name -notin @('bin','obj','artifacts') } | ForEach-Object { Copy-Item $_.FullName $stage -Recurse -Force }
          Get-ChildItem $stage -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','artifacts') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath $dst -CompressionLevel Optimal -Force
          if(-not(Test-Path $dst)){throw 'Source ZIP missing'}
          "SOURCE_ZIP=$dst" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SOURCE ZIP PASS SIZE=$((Get-Item $dst).Length)"

      - name: Upload verified CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerzoStreamSuite-0.1.0j-READY
          path: |
            ${{ env.MERZO_SRC }}/artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0j.zip
            ${{ env.MERZO_SRC }}/artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0j.sha256
            ${{ env.MERZO_SRC }}/artifacts/branded-setup/MerzoStreamSuite_Setup.exe
            ${{ env.MERZO_SRC }}/artifacts/branded-setup/MerzoStreamSuite_Setup.exe.sha256
            ${{ env.MERZO_SRC }}/RELEASE_NOTES_0.1.0j.md
            ${{ env.SOURCE_ZIP }}
          if-no-files-found: error

      - name: Publish GitHub Release v0.1.0j
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          $tag='v0.1.0j'
          $zip='artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0j.zip'
          $sha='artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0j.sha256'
          $setup='artifacts/branded-setup/MerzoStreamSuite_Setup.exe'
          $setupSha='artifacts/branded-setup/MerzoStreamSuite_Setup.exe.sha256'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){ gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'MerzoStream Suite 0.1.0j' --notes-file RELEASE_NOTES_0.1.0j.md }
          if($LASTEXITCODE -ne 0){throw 'Release create failed'}
          gh release upload $tag $zip $sha $setup $setupSha $env:SOURCE_ZIP RELEASE_NOTES_0.1.0j.md --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'Release upload failed'}
          Write-Host 'GITHUB RELEASE v0.1.0j PUBLISHED'
