name: Verify MWO R53 Public OTA + R52 Upgrade

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/verify-mwo-r53-ota.yml'
      - 'optimizer/triggers/r53-verify.txt'

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify stable public R53 release and digests
        id: public
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $expectedHead='57c0894d6db2a42b9ec1949f9dabd37f399ee737'
          $tag='mwo-v0.1.53'
          $release=(gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json)
          if($release.draft -or $release.prerelease){throw 'R53 release is not stable'}
          if($release.tag_name -ne $tag){throw "R53 tag mismatch: $($release.tag_name)"}
          $latest=(gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" | ConvertFrom-Json)
          if($latest.tag_name -ne $tag){throw "Latest OTA feed is not R53: $($latest.tag_name)"}
          $remote=(git ls-remote --tags origin "refs/tags/$tag" | ForEach-Object{($_ -split "`t")[0]} | Select-Object -First 1)
          if($remote -ne $expectedHead){throw "R53 public tag target mismatch: $remote"}

          New-Item -ItemType Directory -Force r53-public | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir r53-public --pattern 'MerzoWindowsOptimizerSetup-win-x64.exe' --pattern 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256' --pattern 'MerzoWindowsOptimizer-portable-win-x64.zip' --pattern 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256'
          foreach($f in @('MerzoWindowsOptimizerSetup-win-x64.exe','MerzoWindowsOptimizerSetup-win-x64.exe.sha256','MerzoWindowsOptimizer-portable-win-x64.zip','MerzoWindowsOptimizer-portable-win-x64.zip.sha256')){
            if(!(Test-Path (Join-Path r53-public $f))){throw "R53 public asset missing: $f"}
          }
          $installer=(Get-FileHash 'r53-public/MerzoWindowsOptimizerSetup-win-x64.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $portable=(Get-FileHash 'r53-public/MerzoWindowsOptimizer-portable-win-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerSide=(Get-Content 'r53-public/MerzoWindowsOptimizerSetup-win-x64.exe.sha256' -Raw).ToLowerInvariant()
          $portableSide=(Get-Content 'r53-public/MerzoWindowsOptimizer-portable-win-x64.zip.sha256' -Raw).ToLowerInvariant()
          if(-not $installerSide.Contains($installer)){throw 'R53 installer sidecar SHA mismatch'}
          if(-not $portableSide.Contains($portable)){throw 'R53 portable sidecar SHA mismatch'}
          $ia=$release.assets | Where-Object name -eq 'MerzoWindowsOptimizerSetup-win-x64.exe' | Select-Object -First 1
          $pa=$release.assets | Where-Object name -eq 'MerzoWindowsOptimizer-portable-win-x64.zip' | Select-Object -First 1
          if(!$ia -or !$pa){throw 'R53 release assets missing from API'}
          if($ia.digest -and $ia.digest -ne "sha256:$installer"){throw "R53 installer public digest mismatch: $($ia.digest)"}
          if($pa.digest -and $pa.digest -ne "sha256:$portable"){throw "R53 portable public digest mismatch: $($pa.digest)"}
          "R53_INSTALLER_SHA=$installer" >> $env:GITHUB_ENV
          "R53_PORTABLE_SHA=$portable" >> $env:GITHUB_ENV
          Write-Host "R53_PUBLIC_RELEASE_PASS installer=$installer portable=$portable"

      - name: Install R52 baseline and prove updater contract
        id: r52
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force r52-public | Out-Null
          gh release download mwo-v0.1.52 --repo $env:GITHUB_REPOSITORY --dir r52-public --pattern 'MerzoWindowsOptimizerSetup-win-x64.exe'
          $setup='r52-public/MerzoWindowsOptimizerSetup-win-x64.exe'
          if(!(Test-Path $setup)){throw 'R52 public installer missing'}
          $p=Start-Process $setup -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -PassThru -Wait
          if($p.ExitCode-ne0){throw "R52 installer exit $($p.ExitCode)"}
          Get-Process MerzoWindowsOptimizer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

          $locations=@()
          foreach($rp in @('HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*')){
            $locations += Get-ItemProperty $rp -ErrorAction SilentlyContinue | Where-Object {$_.DisplayName -like '*Merzo*Windows*Optimizer*'} | ForEach-Object {$_.InstallLocation}
          }
          $candidates=@()
          foreach($loc in ($locations | Where-Object {$_} | Select-Object -Unique)){
            $candidate=Join-Path $loc 'MerzoWindowsOptimizer.exe'
            if(Test-Path $candidate){$candidates += Get-Item $candidate}
          }
          if(!$candidates){
            foreach($base in @($env:LOCALAPPDATA,$env:ProgramFiles,${env:ProgramFiles(x86)})){
              if($base -and (Test-Path $base)){
                $candidates += Get-ChildItem $base -Filter MerzoWindowsOptimizer.exe -Recurse -ErrorAction SilentlyContinue | Where-Object {$_.FullName -notmatch '\\Temp\\'}
              }
            }
          }
          $exe=$candidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(!$exe){throw 'Installed R52 executable not found'}
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe.FullName).FileVersion
          if(-not $v.StartsWith('0.1.52')){throw "Installed baseline is not R52: $v at $($exe.FullName)"}
          "R52_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "R52_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
          Write-Host "R52_BASELINE_PASS path=$($exe.FullName) version=$v"

          $winDll=Join-Path $exe.DirectoryName 'MerzoOptimizer.Windows.dll'
          if(!(Test-Path $winDll)){throw 'R52 updater assembly missing'}
          $asm=[Reflection.Assembly]::LoadFrom($winDll)
          $type=$asm.GetTypes() | Where-Object {$_.FullName -match 'GitHubUpdateService$'} | Select-Object -First 1
          if(!$type){throw 'R52 GitHubUpdateService type missing'}
          $methods=$type.GetMethods([Reflection.BindingFlags]'Public,Instance,Static,DeclaredOnly') | ForEach-Object {$_.ToString()}
          $ctors=$type.GetConstructors() | ForEach-Object {$_.ToString()}
          Write-Host ('R52_UPDATER_TYPE=' + $type.FullName)
          Write-Host ('R52_UPDATER_CTORS=' + ($ctors -join ' | '))
          Write-Host ('R52_UPDATER_METHODS=' + ($methods -join ' | '))

          # R52 OTA implementation must still target this repository and GitHub release feed.
          $bytes=[IO.File]::ReadAllBytes($winDll)
          $ascii=[Text.Encoding]::ASCII.GetString($bytes)
          $unicode=[Text.Encoding]::Unicode.GetString($bytes)
          if(($ascii -notmatch 'Merzo4') -and ($unicode -notmatch 'Merzo4')){throw 'R52 updater assembly does not contain Merzo repository owner contract'}
          if(($ascii -notmatch 'my-app-updates') -and ($unicode -notmatch 'my-app-updates')){throw 'R52 updater assembly does not contain repository contract'}
          Write-Host 'R52_UPDATE_FEED_CONTRACT_PASS'

      - name: Upgrade installed R52 to R53 using OTA installer mode
        id: upgrade
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(!(Test-Path 'r53-public/MerzoWindowsOptimizerSetup-win-x64.exe')){throw 'Verified R53 installer unavailable'}
          if([string]::IsNullOrWhiteSpace($env:R52_EXE) -or !(Test-Path $env:R52_EXE)){throw 'R52 baseline path unavailable'}
          Get-Process MerzoWindowsOptimizer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $p=Start-Process 'r53-public/MerzoWindowsOptimizerSetup-win-x64.exe' -ArgumentList '/SILENT /MERZOUPDATE=1 /SUPPRESSMSGBOXES /NORESTART /CLOSEAPPLICATIONS /RESTARTAPPLICATIONS /SP-' -PassThru -Wait
          if($p.ExitCode-ne0){throw "R53 OTA installer exit $($p.ExitCode)"}
          Start-Sleep -Seconds 4
          $canonical=Join-Path $env:ProgramFiles 'Merzo Windows Optimizer\MerzoWindowsOptimizer.exe'
          if(!(Test-Path $canonical)){throw "R53 canonical Program Files executable missing: $canonical"}
          $v=[Diagnostics.FileVersionInfo]::GetVersionInfo($canonical).FileVersion
          if($v -ne '0.1.53.0'){throw "R53 installed FileVersion mismatch: $v"}
          $manifestPath=Join-Path (Split-Path $canonical) 'MerzoWindowsOptimizer.exe.manifest'
          Write-Host "R53_CANONICAL_EXE=$canonical"
          Write-Host "R53_INSTALLED_VERSION=$v"
          if($env:R52_EXE -ne $canonical -and (Test-Path $env:R52_EXE)){
            throw "Legacy R52 executable remains after Program Files migration: $env:R52_EXE"
          }
          Get-Process MerzoWindowsOptimizer -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          Write-Host 'R52_TO_R53_OTA_INSTALL_PASS'

      - name: Record R53 OTA acceptance status
        if: always()
        shell: pwsh
        env:
          PUBLIC_OUTCOME: ${{ steps.public.outcome }}
          R52_OUTCOME: ${{ steps.r52.outcome }}
          UPGRADE_OUTCOME: ${{ steps.upgrade.outcome }}
        run: |
          $ok=($env:PUBLIC_OUTCOME -eq 'success' -and $env:R52_OUTCOME -eq 'success' -and $env:UPGRADE_OUTCOME -eq 'success')
          $payload=@{
            conclusion=if($ok){'success'}else{'failure'}
            createdAt=(Get-Date).ToUniversalTime().ToString('o')
            databaseId=[long]$env:GITHUB_RUN_ID
            headSha=$env:GITHUB_SHA
            publicRelease=$env:PUBLIC_OUTCOME
            r52FeedContract=$env:R52_OUTCOME
            r52ToR53Upgrade=$env:UPGRADE_OUTCOME
            installerSha=$env:R53_INSTALLER_SHA
            portableSha=$env:R53_PORTABLE_SHA
          } | ConvertTo-Json -Compress
          Set-Content optimizer/R53_OTA_STATUS.json $payload -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R53_OTA_STATUS.json
          git diff --cached --quiet
          if($LASTEXITCODE-ne0){
            git commit -m "Record R53 OTA acceptance run $env:GITHUB_RUN_ID"
            git push origin HEAD:merzo-windows-optimizer
          }
          if(!$ok){exit 1}
