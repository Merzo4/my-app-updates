name: Verify MWO R53 Public OTA v3

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - 'optimizer/triggers/r53-verify-v3.txt'

permissions:
  contents: write

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run robust public R52 to R53 OTA acceptance
        id: accept
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\optimizer\scripts\r53_ota_acceptance.ps1
      - name: Record robust R53 OTA acceptance status
        if: always()
        shell: pwsh
        run: |
          if(!(Test-Path optimizer/R53_OTA_ACCEPTANCE_STATUS.json)){
            $fallback=@{
              conclusion='failure'
              createdAt=(Get-Date).ToUniversalTime().ToString('o')
              databaseId=[long]$env:GITHUB_RUN_ID
              headSha=$env:GITHUB_SHA
              error='acceptance script did not create status file'
            } | ConvertTo-Json -Compress
            Set-Content optimizer/R53_OTA_ACCEPTANCE_STATUS.json $fallback -Encoding UTF8
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R53_OTA_ACCEPTANCE_STATUS.json
          git diff --cached --quiet
          if($LASTEXITCODE -ne 0){
            git commit -m "Record robust R53 OTA acceptance run $env:GITHUB_RUN_ID"
            git fetch origin merzo-windows-optimizer
            git reset --soft origin/merzo-windows-optimizer
            git add optimizer/R53_OTA_ACCEPTANCE_STATUS.json
            git commit -m "Record robust R53 OTA acceptance run $env:GITHUB_RUN_ID"
            git push origin HEAD:merzo-windows-optimizer
          }
          if('${{ steps.accept.outcome }}' -ne 'success'){exit 1}
