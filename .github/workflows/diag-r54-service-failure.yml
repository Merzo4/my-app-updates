name: Diagnose R54 service failure

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/diag-r54-service-failure.yml'
      - 'optimizer/scripts/r54_service_failure_diag.ps1'
      - 'optimizer/triggers/r54-service-diag.txt'

permissions:
  contents: write

concurrency:
  group: mwo-r54-service-diag
  cancel-in-progress: true

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Reconstruct R54 and capture service code
        shell: pwsh
        run: .\optimizer\scripts\r54_service_failure_diag.ps1
      - name: Commit diagnostic
        if: always()
        shell: pwsh
        run: |
          if(!(Test-Path '.\optimizer\R54_SERVICE_FAILURE_DIAG.txt')){throw 'Diagnostic output missing'}
          $saved=Join-Path $env:RUNNER_TEMP 'R54_SERVICE_FAILURE_DIAG.txt'
          Copy-Item '.\optimizer\R54_SERVICE_FAILURE_DIAG.txt' $saved -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin merzo-windows-optimizer
          git reset --hard origin/merzo-windows-optimizer
          Copy-Item $saved '.\optimizer\R54_SERVICE_FAILURE_DIAG.txt' -Force
          git add optimizer/R54_SERVICE_FAILURE_DIAG.txt
          git diff --cached --quiet
          if($LASTEXITCODE-ne0){
            git commit -m "diag: record R54 service failure source"
            git push origin HEAD:merzo-windows-optimizer
          }
