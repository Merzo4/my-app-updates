name: DIAG R49 FINAL XAML

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diag-r49-final-xaml.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Reconstruct exact R49 source
        shell: pwsh
        run: .\optimizer\scripts\r49_release_v6.ps1
      - name: Export final MainWindow XAML
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $x = Get-ChildItem .\r49 -Recurse -Filter MainWindow.xaml | Where-Object { $_.FullName -match 'src\\MerzoOptimizer.App\\MainWindow.xaml$' } | Select-Object -First 1
          if(-not $x){ throw 'MainWindow.xaml not found' }
          Copy-Item $x.FullName .\optimizer\diag-r49-final-MainWindow.xaml -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/diag-r49-final-MainWindow.xaml
          git commit -m 'diag: exact generated R49 MainWindow XAML'
          git push
