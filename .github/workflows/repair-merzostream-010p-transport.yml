name: Repair MerzoStream 0.1.0p transport

on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-merzostream-010p-transport.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 0.1.0p branch
        uses: actions/checkout@v4
        with:
          ref: merzostream-010p-release
          fetch-depth: 0

      - name: Reconstruct verified payload and split to 6K chunks
        shell: python
        run: |
          import base64, hashlib, lzma, pathlib, sys
          root=pathlib.Path('.')
          old_dir=root/'merzostream/ci/010p-full-b64-r2'
          new_dir=root/'merzostream/ci/010p-transport6k'
          expected_old=[
            '8625aa715465c35c6af07db878c41d23dbb3609abfe5c1e1c436aaec289e8754',
            'a1319ae42f5e7430e36ce535698660402dc45d1ff57d4ecabf14784ace402caf',
            'a48ad994aad560c35d706b3b9a3fa3bf448f1d3b108bddc68ca3a7bda6431e8f',
            'b32eab18a63deda574c32ee069752e48208bfe06f520071a14ca13f3e2645be6',
          ]
          raw_sha='e71b8a71b15cfd74c1813123bf0d2594f6a4b0b26d22758aadb7317523a8e3ea'
          xz_sha='e9b7593ff43c4b2f9058ebadb944301ca7d67a985a1c09dc8e1b179e4729ee35'
          old=[]
          for i,e in enumerate(expected_old):
            b=(old_dir/f'chunk{i:02d}.txt').read_bytes()
            print(f'OLD chunk{i:02d} len={len(b)} sha256={hashlib.sha256(b).hexdigest()} expected={e}')
            old.append(b.decode('ascii').strip())
          prefix_parts=[]
          i=0
          while (new_dir/f'chunk{i:02d}.txt').exists():
            s=(new_dir/f'chunk{i:02d}.txt').read_text(encoding='ascii').strip()
            print(f'NEW prefix chunk{i:02d} len={len(s)} sha256={hashlib.sha256(s.encode()).hexdigest()}')
            prefix_parts.append(s); i+=1
          prefix=''.join(prefix_parts)
          old_all=''.join(old)
          print('prefix_len=',len(prefix),'old_total_len=',len(old_all))
          if not prefix or len(prefix)>=len(old_all):
            raise SystemExit('invalid prefix length')
          candidate=prefix+old_all[len(prefix):]
          try:
            xz=base64.urlsafe_b64decode(candidate)
          except Exception as ex:
            raise SystemExit(f'base64 decode failed: {ex}')
          actual_xz=hashlib.sha256(xz).hexdigest()
          print('candidate XZ sha=',actual_xz,'expected=',xz_sha)
          if actual_xz!=xz_sha:
            raise SystemExit('candidate XZ SHA mismatch; stop without modifying branch')
          patch=lzma.decompress(xz)
          actual_raw=hashlib.sha256(patch).hexdigest()
          print('candidate RAW sha=',actual_raw,'expected=',raw_sha)
          if actual_raw!=raw_sha:
            raise SystemExit('candidate RAW SHA mismatch; stop without modifying branch')
          chunks=[candidate[i:i+6000] for i in range(0,len(candidate),6000)]
          new_dir.mkdir(parents=True,exist_ok=True)
          for p in new_dir.glob('chunk*.txt'): p.unlink()
          shas=[]
          for i,s in enumerate(chunks):
            p=new_dir/f'chunk{i:02d}.txt'; p.write_text(s,encoding='ascii',newline='')
            h=hashlib.sha256(s.encode('ascii')).hexdigest(); shas.append(h)
            print(f'WRITE {p} len={len(s)} sha256={h}')
          loader=root/'merzostream/ci/apply_010p.py'
          loader.write_text('''import base64\nimport hashlib\nimport lzma\nimport os\nimport pathlib\nimport subprocess\n\nRAW_SHA="'''+raw_sha+'''"\nXZ_SHA="'''+xz_sha+'''"\nCHUNK_SHA=[\n'''+''.join(f'    "{h}",\n' for h in shas)+''']\nrepo=pathlib.Path(__file__).resolve().parents[2]\nparts=repo/"merzostream"/"ci"/"010p-transport6k"\nencoded=[]\nfor i,expected in enumerate(CHUNK_SHA):\n    p=parts/f"chunk{i:02d}.txt"\n    if not p.exists(): raise SystemExit(f"0.1.0p chunk missing: {p.name}")\n    raw=p.read_bytes(); actual=hashlib.sha256(raw).hexdigest()\n    if actual!=expected: raise SystemExit(f"0.1.0p chunk SHA mismatch: {p.name} {actual}")\n    encoded.append(raw.decode("ascii").strip())\nxz=base64.urlsafe_b64decode("".join(encoded)); actual_xz=hashlib.sha256(xz).hexdigest()\nif actual_xz!=XZ_SHA: raise SystemExit(f"0.1.0p xz SHA mismatch: {actual_xz}")\npatch=lzma.decompress(xz); actual_raw=hashlib.sha256(patch).hexdigest()\nif actual_raw!=RAW_SHA: raise SystemExit(f"0.1.0p raw patch SHA mismatch: {actual_raw}")\nroot=pathlib.Path(os.environ["MERZO_SRC"]); out=pathlib.Path(os.environ.get("RUNNER_TEMP",str(root.parent)))/"merzostream-010p.patch"; out.write_bytes(patch)\nsubprocess.run(["git","apply","--check","--binary",str(out)],cwd=root,check=True)\nsubprocess.run(["git","apply","--binary",str(out)],cwd=root,check=True)\nprint("0.1.0p CUMULATIVE PATCH PASS",RAW_SHA,"xz",XZ_SHA,"chunks",len(CHUNK_SHA))\n''',encoding='utf-8')
          print('TRANSPORT RECONSTRUCTION PASS chunks=',len(chunks))

      - name: Commit repaired transport
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add merzostream/ci/010p-transport6k merzostream/ci/apply_010p.py
          if git diff --cached --quiet; then echo 'No transport changes'; else git commit -m 'Repair MerzoStream 0.1.0p verified transport'; git push origin HEAD:merzostream-010p-release; fi
