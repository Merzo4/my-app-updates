name: Trigger R29 operation center latest
on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/trigger-r29-operation-center-latest.yml']
permissions:
  contents: read
  actions: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch R29 production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-mwo-r29-operation-center.yml --repo "$GITHUB_REPOSITORY" --ref merzo-windows-optimizer
