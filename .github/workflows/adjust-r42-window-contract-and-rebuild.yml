name: Adjust R42 approved window contract and rebuild

on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/adjust-r42-window-contract-and-rebuild.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep R42 redesign inside approved window contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('optimizer/patches/r42_full_ui_rework.py')
          s=p.read_text(encoding='utf-8')
          repl={
            "x = x.replace('Width=\"1000\" Height=\"600\"', 'Width=\"1180\" Height=\"680\"')":"x = x.replace('Width=\"1000\" Height=\"600\"', 'Width=\"1000\" Height=\"600\"')",
            "x = x.replace('MinWidth=\"880\" MinHeight=\"520\"', 'MinWidth=\"1000\" MinHeight=\"600\"')":"x = x.replace('MinWidth=\"880\" MinHeight=\"520\"', 'MinWidth=\"880\" MinHeight=\"520\"')",
            "x = x.replace('<ColumnDefinition Width=\"176\"/>', '<ColumnDefinition Width=\"210\"/>', 1)":"x = x.replace('<ColumnDefinition Width=\"176\"/>', '<ColumnDefinition Width=\"196\"/>', 1)",
            "x = x.replace('Margin=\"11,8,11,9\"', 'Margin=\"18,14,18,16\"')":"x = x.replace('Margin=\"11,8,11,9\"', 'Margin=\"14,10,14,12\"')",
            "'<RowDefinition Height=\"50\"/>\\n                        <RowDefinition Height=\"46\"/>\\n                        <RowDefinition Height=\"220\"/>'":"'<RowDefinition Height=\"44\"/>\\n                        <RowDefinition Height=\"40\"/>\\n                        <RowDefinition Height=\"190\"/>'",
            "'<Grid.RowDefinitions><RowDefinition Height=\"50\"/><RowDefinition Height=\"44\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'":"'<Grid.RowDefinitions><RowDefinition Height=\"44\"/><RowDefinition Height=\"40\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'",
            "'<RowDefinition Height=\"58\"/>\\n                            <RowDefinition Height=\"*\"/>\\n                            <RowDefinition Height=\"104\"/>'":"'<RowDefinition Height=\"50\"/>\\n                            <RowDefinition Height=\"*\"/>\\n                            <RowDefinition Height=\"94\"/>'",
            "'<Grid.RowDefinitions><RowDefinition Height=\"58\"/><RowDefinition Height=\"92\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'":"'<Grid.RowDefinitions><RowDefinition Height=\"50\"/><RowDefinition Height=\"78\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'",
            "'<Grid.RowDefinitions><RowDefinition Height=\"54\"/><RowDefinition Height=\"148\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'":"'<Grid.RowDefinitions><RowDefinition Height=\"48\"/><RowDefinition Height=\"124\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'",
            "'<Grid.RowDefinitions><RowDefinition Height=\"54\"/><RowDefinition Height=\"80\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'":"'<Grid.RowDefinitions><RowDefinition Height=\"48\"/><RowDefinition Height=\"68\"/><RowDefinition Height=\"*\"/></Grid.RowDefinitions>'",
            'DockPanel Margin=\"10,12,10,10\"':'DockPanel Margin=\"8,8,8,8\"',
            'CornerRadius=\"11\" Padding=\"10,8\" Margin=\"0,8,0,0\"':'CornerRadius=\"11\" Padding=\"8,6\" Margin=\"0,5,0,0\"',
            'StackPanel Margin=\"6,0,4,11\"':'StackPanel Margin=\"5,0,4,6\"',
            'Text=\"РАЗДЕЛЫ\" Margin=\"7,0,0,4\"':'Text=\"РАЗДЕЛЫ\" Margin=\"7,0,0,2\"',
            "'<Setter Property=\"Padding\" Value=\"10,7\"/>\\n            <Setter Property=\"Margin\" Value=\"0,2\"/>'":"'<Setter Property=\"Padding\" Value=\"9,5\"/>\\n            <Setter Property=\"Margin\" Value=\"0,1\"/>'",
          }
          misses=[]
          for old,new in repl.items():
              if old not in s: misses.append(old[:90])
              s=s.replace(old,new)
          if misses:
              raise SystemExit('R42 contract adjust anchors missing: '+repr(misses))
          p.write_text(s,encoding='utf-8')
          w=Path('.github/workflows/build-mwo-r42-full-ui-rework.yml')
          ws=w.read_text(encoding='utf-8')
          if '# R42_APPROVED_WINDOW_CONTRACT_PASS2' not in ws:
              ws += '\n# R42_APPROVED_WINDOW_CONTRACT_PASS2\n'
          w.write_text(ws,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/patches/r42_full_ui_rework.py .github/workflows/build-mwo-r42-full-ui-rework.yml
          git commit -m 'Keep R42 redesign within approved 1000x600 window contract'
          git push origin HEAD:merzo-windows-optimizer
