name: Build MerzoStream Standard Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install official Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-WebRequest 'https://jrsoftware.org/download.php/is.exe' -OutFile "$env:TEMP\innosetup.exe"
          Start-Process "$env:TEMP\innosetup.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait

          $candidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found after Inno Setup installation.' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile standard Windows Setup
        shell: pwsh
        run: |
          & "$env:ISCC" "installer\MerzoStreamSetup.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerzoStreamSetup
          path: installer/output/MerzoStreamSetup.exe

      - name: Publish permanent installer prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view installer-v1 *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create installer-v1 --prerelease --title "MerzoStream Suite — Installer" --notes "Standard Windows web installer. Download MerzoStreamSetup.exe and run it."
          }
          gh release upload installer-v1 "installer/output/MerzoStreamSetup.exe" --clobber
