name: Merzo Windows Optimizer R29 OPERATION CENTER

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/build-mwo-r29-operation-center.yml']

permissions: { contents: write }

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne 29){throw 'Source parts missing'}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r29.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r29.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r29|Out-Null;tar -xf r29.tar.xz -C r29
          $sln=Get-ChildItem r29 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)">>$env:GITHUB_ENV

      - name: Apply cumulative R24-R29 patches
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R29 OPERATIONS SelfTest').Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          python optimizer/patches/r24_update_center.py;if($LASTEXITCODE-ne 0){throw 'R24 updater failed'}
          python optimizer/patches/r24_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R24 compile failed'}
          python optimizer/patches/r26_ota_repair.py;if($LASTEXITCODE-ne 0){throw 'R26 failed'}
          python optimizer/patches/r27_privacy_engine.py;if($LASTEXITCODE-ne 0){throw 'R27 failed'}
          python optimizer/patches/r28_profiles_updates_cleanup_ux.py;if($LASTEXITCODE-ne 0){throw 'R28 failed'}
          python optimizer/patches/r29_operation_center.py;if($LASTEXITCODE-ne 0){throw 'R29 failed'}
          python optimizer/patches/r29_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R29 compile fix failed'}

      - name: Branded icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          @'
          from PIL import Image,ImageDraw
          from pathlib import Path
          import os
          o=Path(os.environ['SOURCE_ROOT'])/'assets'/'MerzoWindowsOptimizer.ico';o.parent.mkdir(parents=True,exist_ok=True);im=Image.new('RGBA',(256,256),(10,16,22,255));d=ImageDraw.Draw(im);t=(83,216,197,255);w=(238,247,247,255);p=(19,30,40,255);d.rounded_rectangle((12,12,244,244),radius=52,fill=p,outline=t,width=10);d.ellipse((42,42,214,214),outline=(47,94,98,255),width=5);d.line((62,176,62,91,104,142,128,105,152,142,194,91,194,176),fill=w,width=16);d.polygon([(143,45),(117,104),(143,104),(126,154),(188,84),(156,84),(176,45)],fill=t);im.save(o,format='ICO',sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@|Set-Content icon.py -Encoding UTF8;python icon.py

      - name: Build 0.1.29 and SelfTest
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT;try{& .\build\Build-Production.ps1 -Version '0.1.29';if($LASTEXITCODE-ne 0){throw 'Build failed'}}finally{Pop-Location}

      - name: Verify R29 runtime and architecture gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$app=Join-Path $env:SOURCE_ROOT 'dist\app'
          $files=@((Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Core\bin\Release\net10.0\MerzoOptimizer.Core.dll'),(Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows\bin\Release\net10.0-windows\MerzoOptimizer.Windows.dll'),(Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.ElevatedHelper\bin\Release\net10.0-windows\win-x64\MerzoOptimizer.ElevatedHelper.dll'))
          foreach($f in $files){if(-not(Test-Path $f)){throw "Missing $f"};Copy-Item $f (Join-Path $app (Split-Path $f -Leaf)) -Force}
          $exe=Join-Path $app 'MerzoWindowsOptimizer.exe';$dll=Join-Path $app 'MerzoWindowsOptimizer.dll';$deps=Join-Path $app 'MerzoWindowsOptimizer.deps.json'
          $fv=[Diagnostics.FileVersionInfo]::GetVersionInfo($exe);$an=[Reflection.AssemblyName]::GetAssemblyName($dll);$dep=Get-Content $deps -Raw
          Write-Host "EXE=$($fv.FileVersion) Product=$($fv.ProductVersion) DLL=$($an.Version)"
          if(-not$fv.FileVersion.StartsWith('0.1.29')){throw 'EXE version gate failed'}
          if($an.Version.ToString()-ne'0.1.29.0'){throw 'DLL version gate failed'}
          if(-not$dep.Contains('MerzoWindowsOptimizer/0.1.29')-or$dep.Contains('MerzoWindowsOptimizer/0.1.21')){throw 'deps gate failed'}
          $x=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml') -Raw
          foreach($t in @('Production R29','CancelDeepOptimizationScanCommand','CancelCleanupOperationCommand','BytesToHuman')){if(-not$x.Contains($t)){throw "R29 XAML gate: $t"}}
          $vm=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') -Raw
          foreach($t in @('TryBeginOperation','optimization-scan','cleanup-scan','cleanup-run','CancelAfter(TimeSpan.FromSeconds(45))','TimeSpan.FromSeconds(35)')){if(-not$vm.Contains($t)){throw "R29 VM gate: $t"}}
          $cl=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows\Cleanup\WindowsCleanupService.cs') -Raw
          if(-not$cl.Contains('CleanWithoutBackupAsync')-or-not$cl.Contains('bool createBackup')){throw 'Optional backup gate failed'}
          $guard=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\Operations\MerzoOperationGuard.cs') -Raw
          if(-not$guard.Contains('ProcessId')-or-not$guard.Contains('TryTerminateOwned')){throw 'operation process guard gate failed'}
          $appcs=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\App.xaml.cs') -Raw
          if(-not$appcs.Contains('MerzoWindowsOptimizer.SingleInstance')){throw 'single instance gate failed'}
          $auditPart=$x.Substring($x.IndexOf('Text="Аудит системы"'),$x.IndexOf('Text="Оптимизация"')-$x.IndexOf('Text="Аудит системы"'))
          if($auditPart.Contains('Header="Ход очистки"')){throw 'Cleanup progress still leaked into Audit page'}
          $cleanupPart=$x.Substring($x.IndexOf('Text="Очистка / Debloat"'))
          if(-not$cleanupPart.Contains('Header="Ход очистки"')){throw 'Cleanup progress missing from Cleanup page'}
          if(-not$vm.Contains('/RESTARTAPPLICATIONS')){throw 'OTA restart regressed'}

      - name: Runtime metadata smoke
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP smoke;New-Item -ItemType Directory -Force $d|Out-Null
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup></Project>'|Set-Content (Join-Path $d Smoke.csproj)
          'using System.Reflection;foreach(var p in args){var a=Assembly.LoadFrom(Path.GetFullPath(p));Console.WriteLine($"OK {Path.GetFileName(p)} types={a.GetTypes().Length}");}'|Set-Content (Join-Path $d Program.cs)
          $app=Join-Path $env:SOURCE_ROOT 'dist\app';dotnet run --project (Join-Path $d Smoke.csproj) -c Release -- (Join-Path $app 'MerzoOptimizer.Core.dll') (Join-Path $app 'MerzoOptimizer.Windows.dll') (Join-Path $app 'MerzoOptimizer.ElevatedHelper.dll');if($LASTEXITCODE-ne 0){throw 'Metadata smoke failed'}

      - name: Rebuild portable
        shell: pwsh
        run: |
          $a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip';if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal

      - name: Build installer and hashes
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y;if($LASTEXITCODE-ne 0){throw 'Inno install failed'}
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|select -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT;try{&$iscc '/DMyAppVersion=0.1.29' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne 0){throw 'Installer failed'};$e='.\dist\MerzoWindowsOptimizerSetup-win-x64.exe';$z='.\dist\MerzoWindowsOptimizer-portable-win-x64.zip';$eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant();"$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii;"$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii;Write-Host "R29_INSTALLER_SHA256=$eh"}finally{Pop-Location}

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.29-R29-OPERATION-CENTER
          path: |
            r29/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r29/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r29/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r29/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.29
        shell: pwsh
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          $tag='mwo-v0.1.29';$d=Join-Path $env:SOURCE_ROOT dist
          $notes=@'
          ДОБАВЛЕНО
          • Очистка с выбором: ZIP-backup + Undo / без backup / Отмена.
          • Отмена большой проверки, сканирования Cleanup и текущей очистки.
          • Operation Guard: PID активной операции сохраняется; при обнаружении дублирующей фоновой операции Merzo предупреждает и может закрыть только подтверждённый процесс Merzo.
          • Single-instance защита от двух копий приложения.
          • Таймауты для долгих этапов и принудительное завершение дочерних PowerShell-процессов при отмене.

          ИЗМЕНЕНО
          • Read-only проверки больше не должны глобально блокировать всё приложение через один IsStage2Busy.
          • Большая проверка имеет 35-секундный watchdog на этап; Cleanup scan — 45 секунд.
          • Накопители показывают КБ/МБ/ГБ/ТБ вместо сырых байтов.
          • Ход очистки находится в разделе Cleanup, а не в Audit.

          ИСПРАВЛЕНО
          • После зависшего запроса повторная проверка больше не должна оставаться навсегда заблокированной.
          • Повторное сканирование получило видимое состояние и отмену.
          • Не закрываем чужие PowerShell/системные процессы: принудительное закрытие разрешено только для подтверждённого Merzo-процесса.
          '@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE-ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.29 (R29 OPERATION CENTER)' --notes $notes}
          gh release upload $tag (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe') (Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip') (Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE-ne 0){throw 'Release upload failed'}
