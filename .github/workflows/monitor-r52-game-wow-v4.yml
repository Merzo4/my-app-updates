name: Monitor R52 GAME WOW V4

on:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/monitor-r52-game-wow-v4.yml']

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Wait and record R52 GAME WOW V4
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 8
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mwo-r52-game-wow.yml --branch merzo-windows-optimizer --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$id" ] || { echo no-run; exit 1; }
          for i in $(seq 1 120); do
            status=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            [ "$status" = completed ] && break
            sleep 10
          done
          gh run view "$id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > optimizer/R52_GAME_WOW_V4_BUILD_STATUS.json
          conclusion=$(jq -r '.conclusion' optimizer/R52_GAME_WOW_V4_BUILD_STATUS.json)
          if [ "$conclusion" != success ]; then gh run view "$id" --repo "$GITHUB_REPOSITORY" --log-failed > optimizer/R52_GAME_WOW_V4_BUILD_FAILED.log || true; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R52_GAME_WOW_V4_BUILD_STATUS.json optimizer/R52_GAME_WOW_V4_BUILD_FAILED.log 2>/dev/null || true
          git commit -m 'diag: record R52 GAME WOW V4 result' || true
          git push || true
