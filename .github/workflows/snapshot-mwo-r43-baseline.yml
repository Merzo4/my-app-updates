name: Snapshot MWO R43 baseline
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/snapshot-mwo-r43-baseline.yml']
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore and apply published R43 chain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r43base.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r43base.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r43base|Out-Null;tar -xf r43base.tar.xz -C r43base
          $sln=Get-ChildItem r43base -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)" >> $env:GITHUB_ENV
          $f=Join-Path $sln.Directory.FullName 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          $patches=@('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py','r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py','r39_gaming_build_catalog.py','r39_gaming_build_engine.py','r39_gaming_build_ui.py','r39_finalize.py','r40_network_binding_hotfix.py','r42_full_ui_rework.py','r42_window_contract_fix.py','r43_true_full_ui.py')
          foreach($p in $patches){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}
      - name: Store exact R43 baseline snapshot
        shell: pwsh
        run: |
          $dst='optimizer/snapshots/r43-baseline';New-Item -ItemType Directory -Force $dst|Out-Null
          Copy-Item (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml') "$dst/MainWindow.xaml" -Force
          Copy-Item (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\App.xaml') "$dst/App.xaml" -Force
          Copy-Item (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs') "$dst/MainWindowViewModel.cs" -Force
          Copy-Item (Join-Path $env:SOURCE_ROOT 'data\tweaks.json') "$dst/tweaks.json" -Force
          Copy-Item (Join-Path $env:SOURCE_ROOT 'data\service_rules.json') "$dst/service_rules.json" -Force
          Copy-Item (Join-Path $env:SOURCE_ROOT 'data\task_rules.json') "$dst/task_rules.json" -Force
          @('R43 published baseline','Do not edit directly. R44 patches are applied after this logical state.','Window contract: 1000x600 / min 880x520')|Set-Content "$dst/README.txt" -Encoding UTF8
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $dst
          if(-not(git diff --cached --quiet)){git commit -m 'Freeze published R43 baseline for R44';git push origin HEAD:merzo-windows-optimizer}
