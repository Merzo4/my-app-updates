name: Merzo Windows Optimizer R48 OTA RELIABILITY

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/build-mwo-r48-ota-reliability.yml'
      - 'optimizer/patches/r48_ota_reliability.py'

permissions:
  contents: write

concurrency:
  group: mwo-r48-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Restore trusted source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          if($parts.Count-ne29){throw "Source parts missing: $($parts.Count)"}
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r48.tar.xz',[Convert]::FromBase64String($b.ToString()))
          $h=(Get-FileHash r48.tar.xz -Algorithm SHA256).Hash.ToLowerInvariant()
          if($h-ne'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d'){throw "Source SHA mismatch $h"}
          New-Item -ItemType Directory -Force r48|Out-Null;tar -xf r48.tar.xz -C r48
          $sln=Get-ChildItem r48 -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          "SOURCE_ROOT=$($sln.Directory.FullName)" >> $env:GITHUB_ENV

      - name: Apply cumulative R24-R48
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          $patches=@('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py','r37_operation_ui.py','r37_network_center.py','r37_finalize.py','r38_gaming_catalog.py','r38_gaming_network.py','r38_gaming_ui.py','r38_finalize.py','r39_gaming_build_catalog.py','r39_gaming_build_engine.py','r39_gaming_build_ui.py','r39_finalize.py','r40_network_binding_hotfix.py','r42_full_ui_rework.py','r42_window_contract_fix.py','r43_true_full_ui.py','r44_function_expansion.py','r44_finalize.py','r45_apply_selected_ux.py','r46_security_layout_hardening.py','r46_binding_finalize.py','r47_simple_builds.py','r47_scan_status_fix.py','r48_ota_reliability.py')
          foreach($p in $patches){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}

      - name: R48 source security and compatibility gates
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          import os,json,xml.etree.ElementTree as ET
          from pathlib import Path
          r=Path(os.environ['SOURCE_ROOT']);x=(r/'src/MerzoOptimizer.App/MainWindow.xaml').read_text(encoding='utf-8-sig')
          u=(r/'src/MerzoOptimizer.Windows/Updates/GitHubUpdateService.cs').read_text(encoding='utf-8-sig')
          b=(r/'src/MerzoOptimizer.Windows/Elevation/ElevatedOperationBroker.cs').read_text(encoding='utf-8-sig')
          h=(r/'src/MerzoOptimizer.ElevatedHelper/Program.cs').read_text(encoding='utf-8-sig')
          for t in ['Production 0.1.48','Production R48','Сборки Windows','Экспертные инструменты','Установить сборку','OptimizationApplyBar']:
              assert t in x,t
          for i in range(12): assert f'x:Name="PageRoot{i}"' in x,f'PageRoot{i}'
          for t in ['ResolveBestReleaseAsync','GetJsonWithRetryAsync','releases?per_page=20','matching-refs/tags','releases/tags/','tags?per_page=100','HttpStatusCode.GatewayTimeout','HttpStatusCode.BadGateway','HttpStatusCode.ServiceUnavailable','(HttpStatusCode)429','TimeSpan.FromSeconds(45)','OfficialOwner = "Merzo4"','OfficialRepository = "my-app-updates"','OfficialInstallerName = "MerzoWindowsOptimizerSetup-win-x64.exe"','FixedTimeShaEquals','ParseSidecarSha256','IsOfficialReleaseAssetUrl']:
              assert t in u,t
          for t in ['MERZO-ELEVATION/46','GetNamedPipeClientProcessId','--parent-pid','--nonce','RandomNumberGenerator','FileVersionInfo']: assert t in b,t
          for t in ['MERZO-ELEVATION/46','GetNamedPipeServerProcessId','--parent-pid','--nonce','ValidateSnapshotAsync','ValidateKnownServiceAsync','ValidateKnownTaskAsync','RequiresAdmin','ScanOnly']: assert t in h,t
          root=ET.parse(r/'src/MerzoOptimizer.App/MainWindow.xaml').getroot();ns='{http://schemas.microsoft.com/winfx/2006/xaml/presentation}';xn='{http://schemas.microsoft.com/winfx/2006/xaml}'
          main=next(z for z in root.iter(ns+'TabControl') if z.attrib.get(xn+'Name')=='MainTabs');assert len([c for c in list(main) if c.tag==ns+'TabItem'])==12
          settings=json.loads((r/'data/update_settings.json').read_text(encoding='utf-8-sig'))
          assert settings['repository_owner']=='Merzo4' and settings['repository_name']=='my-app-updates' and settings['release_tag_prefix']=='mwo-v'
          notes=json.loads((r/'data/release_notes.json').read_text(encoding='utf-8-sig'));assert notes['version']=='0.1.48'
          print('R48 SOURCE SECURITY GATE PASS')
          '@|python
          if($LASTEXITCODE-ne0){throw 'R48 source gate failed'}
          foreach($p in Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src') -Recurse -Filter *.csproj){$z=Get-Content $p.FullName -Raw;if($z-match'<AssemblyVersion>([^<]+)</AssemblyVersion>'-and$Matches[1]-ne'0.1.48.0'){throw "Assembly $($p.Name): $($Matches[1])"};if($z-match'<FileVersion>([^<]+)</FileVersion>'-and$Matches[1]-ne'0.1.48.0'){throw "File $($p.Name): $($Matches[1])"}}
          if(-not(Test-Path (Join-Path $env:SOURCE_ROOT 'R48_OTA_RELIABILITY.marker'))){throw 'R48 marker missing'}

      - name: Build 0.1.48 without Obfuscar
        shell: pwsh
        run: |
          Push-Location $env:SOURCE_ROOT
          try{& .\build\Build-Production.ps1 -Version '0.1.48' -SkipObfuscation;if($LASTEXITCODE-ne0){throw 'Production build failed'}}finally{Pop-Location}

      - name: Core SelfTest XAML and binary gates
        shell: pwsh
        run: |
          dotnet run --project (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\MerzoOptimizer.SelfTest.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'SelfTest failed'}
          $dist=Join-Path $env:SOURCE_ROOT 'dist\app'
          foreach($n in @('MerzoWindowsOptimizer.dll','MerzoOptimizer.Core.dll','MerzoOptimizer.Windows.dll','MerzoOptimizer.ElevatedHelper.dll')){$p=Join-Path $dist $n;if(-not(Test-Path $p)){throw "Missing $n"};$v=[Reflection.AssemblyName]::GetAssemblyName($p).Version.ToString();if($v-ne'0.1.48.0'){throw "$n version $v"}}
          if(Get-ChildItem $dist -Recurse -File|?{$_.Name-match'Obfuscar'}){throw 'Obfuscar artifact'}
          foreach($f in Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App') -Recurse -Filter *.xaml|?{$_.FullName-notmatch'\\(bin|obj)\\'}){try{[xml](Get-Content $f.FullName -Raw)|Out-Null}catch{throw "Malformed XAML $($f.FullName): $($_.Exception.Message)"}}

      - name: R45 504 fallback updater runtime smoke
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d=Join-Path $env:RUNNER_TEMP 'r48-updater-smoke';New-Item -ItemType Directory -Force $d|Out-Null
          $wp=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows\MerzoOptimizer.Windows.csproj'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable><AssemblyVersion>0.1.45.0</AssemblyVersion><FileVersion>0.1.45.0</FileVersion></PropertyGroup><ItemGroup><ProjectReference Include="$wp" /></ItemGroup></Project>
          "@|Set-Content (Join-Path $d 'Smoke.csproj') -Encoding UTF8
          @'
          using System.Net;using System.Text;using MerzoOptimizer.Windows.Updates;
          sealed class FakeHandler:HttpMessageHandler{public int ListCalls;protected override Task<HttpResponseMessage> SendAsync(HttpRequestMessage q,CancellationToken c){var u=q.RequestUri!.AbsoluteUri;if(u.Contains("/releases?per_page=20")){ListCalls++;return R(HttpStatusCode.GatewayTimeout,"{}");}if(u.Contains("/git/matching-refs/tags/mwo-v"))return R(HttpStatusCode.OK,"[{\"ref\":\"refs/tags/mwo-v0.1.48\"}]");if(u.Contains("/releases/tags/mwo-v0.1.48")){var h=new string('a',64);var j="{\"tag_name\":\"mwo-v0.1.48\",\"draft\":false,\"prerelease\":false,\"name\":\"R48\",\"body\":\"bridge\",\"assets\":[{\"name\":\"MerzoWindowsOptimizerSetup-win-x64.exe\",\"browser_download_url\":\"https://github.com/Merzo4/my-app-updates/releases/download/mwo-v0.1.48/MerzoWindowsOptimizerSetup-win-x64.exe\",\"digest\":\"sha256:"+h+"\",\"size\":12345},{\"name\":\"MerzoWindowsOptimizerSetup-win-x64.exe.sha256\",\"browser_download_url\":\"https://github.com/Merzo4/my-app-updates/releases/download/mwo-v0.1.48/MerzoWindowsOptimizerSetup-win-x64.exe.sha256\",\"size\":106}]}";return R(HttpStatusCode.OK,j);}return R(HttpStatusCode.NotFound,"{}");}static Task<HttpResponseMessage> R(HttpStatusCode s,string j)=>Task.FromResult(new HttpResponseMessage(s){Content=new StringContent(j,Encoding.UTF8,"application/json")});}
          var dir=Path.Combine(Path.GetTempPath(),"mwo-r48-"+Guid.NewGuid().ToString("N"));Directory.CreateDirectory(dir);var settings=Path.Combine(dir,"update_settings.json");File.WriteAllText(settings,"{\"auto_check\":true,\"auto_download\":false,\"auto_install\":false,\"provider\":\"GitHub\",\"repository_owner\":\"Merzo4\",\"repository_name\":\"my-app-updates\",\"release_tag_prefix\":\"mwo-v\",\"asset_name_contains\":\"MerzoWindowsOptimizerSetup-win-x64.exe\",\"installer_silent_args\":\"/SILENT\"}");var f=new FakeHandler();using var svc=new GitHubUpdateService(settings,Path.Combine(dir,"updates"),f);var r=await svc.CheckAsync();if(!r.Success||!r.UpdateAvailable||r.LatestVersion!="0.1.48"||f.ListCalls!=3)throw new Exception($"fallback failed success={r.Success} avail={r.UpdateAvailable} latest={r.LatestVersion} calls={f.ListCalls} msg={r.Message}");Console.WriteLine("R48_504_FALLBACK_PASS");
          '@|Set-Content (Join-Path $d 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $d 'Smoke.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'R48 updater fallback smoke failed'}

      - name: Runtime WPF bounds all 12 pages
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'r48layout';New-Item -ItemType Directory -Force $d|Out-Null;$ap=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MerzoOptimizer.App.csproj'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><ProjectReference Include="$ap" /></ItemGroup></Project>
          "@|Set-Content (Join-Path $d 'p.csproj') -Encoding UTF8
          @'
          using System.Windows;using System.Windows.Controls;using System.Windows.Media;using MerzoOptimizer.App;static FrameworkElement N(DependencyObject p,string n){if(p is FrameworkElement f&&f.Name==n)return f;for(int i=0;i<VisualTreeHelper.GetChildrenCount(p);i++){var r=N(VisualTreeHelper.GetChild(p,i),n);if(r!=null)return r;}return null!;}static bool I(FrameworkElement c,FrameworkElement a){var p=c.TransformToAncestor(a).Transform(new Point(0,0));return p.X>=-2&&p.Y>=-2&&p.X+c.ActualWidth<=a.ActualWidth+2&&p.Y+c.ActualHeight<=a.ActualHeight+2;}[STAThread]static void Main(){var a=new App();a.InitializeComponent();foreach(var s in new[]{(1000d,600d),(920d,560d)}){var w=new MainWindow{Width=s.Item1,Height=s.Item2,Left=-20000,Top=-20000,ShowInTaskbar=false,ShowActivated=false};w.Show();w.UpdateLayout();var t=(TabControl)N(w,"MainTabs");for(int i=0;i<12;i++){t.SelectedIndex=i;w.UpdateLayout();var r=N(w,$"PageRoot{i}");if(r is null||r.ActualWidth<1||r.ActualHeight<1||!I(r,w))throw new Exception($"PageRoot{i} overflow");}w.Close();}a.Shutdown();Console.WriteLine("R48_LAYOUT_PASS");}
          '@|Set-Content (Join-Path $d 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $d 'p.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Layout probe failed'}

      - name: Dispatcher and network runtime smoke
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP 'r48smoke';New-Item -ItemType Directory -Force $d|Out-Null;$core=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Core.dll'));$win=[Security.SecurityElement]::Escape((Join-Path $env:SOURCE_ROOT 'dist\app\MerzoOptimizer.Windows.dll'))
          @"
          <Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Reference Include="MerzoOptimizer.Core"><HintPath>$core</HintPath><Private>true</Private></Reference><Reference Include="MerzoOptimizer.Windows"><HintPath>$win</HintPath><Private>true</Private></Reference></ItemGroup></Project>
          "@|Set-Content (Join-Path $d 's.csproj') -Encoding UTF8
          @'
          using MerzoOptimizer.Core.Dispatching;using MerzoOptimizer.Core.Network;using MerzoOptimizer.Windows.Elevation;using MerzoOptimizer.Windows.Network;using var d=new AsyncOperationDispatcher(2);var v=await d.RunAsync("r48",_=>Task.FromResult(48));if(v!=48)throw new Exception();await d.RunAsync("void",_=>Task.CompletedTask);var p=Path.Combine(Path.GetTempPath(),"mwo-r48-net");Directory.CreateDirectory(p);await using var b=new ElevatedOperationBroker(p,p,p);INetworkRepairService n=new WindowsNetworkRepairService(b);await n.DiagnoseAsync();Console.WriteLine("R48_RUNTIME_PASS");
          '@|Set-Content (Join-Path $d 'Program.cs') -Encoding UTF8
          dotnet run --project (Join-Path $d 's.csproj') -c Release
          if($LASTEXITCODE-ne0){throw 'Runtime smoke failed'}

      - name: Full EXE startup smoke
        shell: pwsh
        run: |
          $e=Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe';$p=Start-Process $e -WorkingDirectory (Split-Path $e) -PassThru;Start-Sleep 20;if($p.HasExited){throw "App exited $($p.ExitCode)"};Stop-Process -Id $p.Id -Force;Write-Host 'R48_EXE_STARTUP_PASS'

      - name: Build installer portable and SHA256
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';$a=Join-Path $env:SOURCE_ROOT 'dist\app';$z=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizer-portable-win-x64.zip';if(Test-Path $z){Remove-Item $z -Force};Compress-Archive -Path (Join-Path $a '*') -DestinationPath $z -CompressionLevel Optimal
          $iscc=@('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe')|?{Test-Path $_}|Select-Object -First 1;if(-not$iscc){throw 'ISCC missing'}
          Push-Location $env:SOURCE_ROOT;try{& $iscc '/DMyAppVersion=0.1.48' '.\installer\MerzoWindowsOptimizer.iss';if($LASTEXITCODE-ne0){throw 'Installer failed'}}finally{Pop-Location}
          $e=Join-Path $env:SOURCE_ROOT 'dist\MerzoWindowsOptimizerSetup-win-x64.exe';$eh=(Get-FileHash $e -Algorithm SHA256).Hash.ToLowerInvariant();$zh=(Get-FileHash $z -Algorithm SHA256).Hash.ToLowerInvariant();"$eh  MerzoWindowsOptimizerSetup-win-x64.exe"|Set-Content "$e.sha256" -Encoding ascii;"$zh  MerzoWindowsOptimizer-portable-win-x64.zip"|Set-Content "$z.sha256" -Encoding ascii;Write-Host "R48_INSTALLER_SHA=$eh"

      - uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.48-R48-OTA-RELIABILITY
          path: |
            r48/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r48/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r48/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r48/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256

      - name: Publish mwo-v0.1.48
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop';$tag='mwo-v0.1.48';$d=Join-Path $env:SOURCE_ROOT 'dist';gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes 2>$null;if($LASTEXITCODE-ne0){$global:LASTEXITCODE=0};git push origin ":refs/tags/$tag" 2>$null;if($LASTEXITCODE-ne0){$global:LASTEXITCODE=0}
          $notes=Join-Path $env:RUNNER_TEMP 'r48-notes.txt';@'
          R48 OTA RELIABILITY

          • Исправлен сценарий R45: 504 Gateway Timeout на GitHub releases endpoint больше не обрывает проверку после одного запроса.
          • Retry для временных 408/429/500/502/503/504 и timeout.
          • Fallback: matching mwo-v tag refs → exact release-by-tag; затем lightweight tags endpoint.
          • Все fallback-пути остаются в официальном Merzo4/my-app-updates и сохраняют строгую проверку installer URL/size/GitHub digest/SHA sidecar.
          • R47 SIMPLE BUILDS, R46 security, Snapshot/Verify/Undo сохранены.
          '@|Set-Content $notes -Encoding UTF8
          $files=@((Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe'),(Join-Path $d 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256'),(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip'),(Join-Path $d 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256'))
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.48 (R48 OTA RELIABILITY)' --notes-file $notes @files
          if($LASTEXITCODE-ne0){throw 'Release publish failed'}
