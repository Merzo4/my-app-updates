name: Dispatch MerzoStream 0.1.0p R2C

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dispatch-merzostream-010p-r2c.yml']
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch 0.1.0p R2 after verified transport repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run trigger-merzostream-010p-build-r2.yml --repo "$GITHUB_REPOSITORY" --ref main
