name: Dispatch MerzoStream 0.1.0p rerun

on:
  push:
    branches: [main]
    paths: ['.github/workflows/dispatch-merzostream-010p-rerun.yml']

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch current 0.1.0p build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run trigger-merzostream-010p-build.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "0.1.0p build dispatched"
