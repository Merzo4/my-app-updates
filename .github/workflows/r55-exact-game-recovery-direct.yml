name: R55 Exact GAME Recovery Direct

on:
  push:
    branches: [mwo-r55-process-stability]
    paths:
      - '.github/workflows/r55-exact-game-recovery-direct.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: r55-exact-game-recovery-direct
  cancel-in-progress: false

jobs:
  exact-game-recovery:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mwo-r55-process-stability
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Verify exact candidate contract
        shell: pwsh
        run: |
          $j=Get-Content '.\optimizer\R55_CI_STATUS.json' -Raw | ConvertFrom-Json
          if($j.conclusion-ne'success'){throw 'R55 candidate not green'}
          if([long]$j.databaseId-ne32355454110){throw "R55 buildRun=$($j.databaseId)"}
          if($j.headSha-ne'd99d61fd5f34eb1ca5331359343c950b33fc3681'){throw "R55 head=$($j.headSha)"}
          if($j.artifactId-ne9401609214){throw "R55 artifactId=$($j.artifactId)"}
          if($j.artifactDigest-ne'sha256:3fe7ca12ac79499e0e377dbceb178063f16c0c6f40665ffb102f681034206983'){throw 'R55 artifact digest mismatch'}
          if($j.installerSha-ne'b845ecd3d46b0f552ae8c80acc48ad2deded6e1801cbe7e28c6a488f0e56fc2f'){throw 'R55 installer SHA mismatch'}
          if($j.portableSha-ne'044900a8ab3ed17cb3441a0afff2627229de19b7b1fb32b405256b01f818dbe5'){throw 'R55 portable SHA mismatch'}
          Write-Host 'R55_EXACT_CANDIDATE_CONTRACT_PASS'

      - name: Download exact R55 candidate
        uses: actions/download-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.55-PROCESS-STABILITY-CANDIDATE
          path: artifact
          run-id: 32355454110
          github-token: ${{ github.token }}

      - name: Verify downloaded candidate SHA
        shell: pwsh
        run: |
          $installer=Get-ChildItem '.\artifact' -Recurse -File -Filter 'MerzoWindowsOptimizerSetup-win-x64.exe' | Select-Object -First 1
          $portable=Get-ChildItem '.\artifact' -Recurse -File -Filter 'MerzoWindowsOptimizer-portable-win-x64.zip' | Select-Object -First 1
          if(!$installer -or !$portable){throw 'R55 downloaded candidate incomplete'}
          $ih=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $ph=(Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if($ih-ne'b845ecd3d46b0f552ae8c80acc48ad2deded6e1801cbe7e28c6a488f0e56fc2f'){throw "R55 downloaded installer SHA=$ih"}
          if($ph-ne'044900a8ab3ed17cb3441a0afff2627229de19b7b1fb32b405256b01f818dbe5'){throw "R55 downloaded portable SHA=$ph"}
          Write-Host "R55_EXACT_DOWNLOAD_SHA_PASS installer=$ih portable=$ph"

      - name: GAME mutation plus production RestoreAll
        id: mutation
        shell: pwsh
        run: .\optimizer\scripts\r55_game_recovery_acceptance.ps1 -ArtifactDir '.\artifact' -BuildRun 32355454110 -BuildHead 'd99d61fd5f34eb1ca5331359343c950b33fc3681'

      - name: Verify and persist exact GAME recovery status
        shell: pwsh
        run: |
          $p='.\optimizer\R55_GAME_RECOVERY_STATUS.json'
          if(!(Test-Path $p)){throw 'R55 GAME recovery status missing'}
          $j=Get-Content $p -Raw | ConvertFrom-Json
          foreach($n in @('oneDriveSyntheticNonzero','oneDriveSetupOnlyDetection','gameFullMutation','recoveryRestoreAll','recoveryStateVerification')){if($j.$n-ne'success'){throw "R55 GAME field $n=$($j.$n)"}}
          if([long]$j.buildRun-ne32355454110){throw "R55 GAME buildRun=$($j.buildRun)"}
          if($j.buildHead-ne'd99d61fd5f34eb1ca5331359343c950b33fc3681'){throw "R55 GAME buildHead=$($j.buildHead)"}
          if($j.candidateVersion-ne'0.1.55.0'){throw "R55 GAME version=$($j.candidateVersion)"}
          if($j.portableSha-ne'044900a8ab3ed17cb3441a0afff2627229de19b7b1fb32b405256b01f818dbe5'){throw "R55 GAME portableSha=$($j.portableSha)"}
          $j | Add-Member -NotePropertyName artifactId -NotePropertyValue 9401609214 -Force
          $j | Add-Member -NotePropertyName artifactDigest -NotePropertyValue 'sha256:3fe7ca12ac79499e0e377dbceb178063f16c0c6f40665ffb102f681034206983' -Force
          $j | Add-Member -NotePropertyName installerSha -NotePropertyValue 'b845ecd3d46b0f552ae8c80acc48ad2deded6e1801cbe7e28c6a488f0e56fc2f' -Force
          $j | ConvertTo-Json | Set-Content $p -Encoding UTF8
          $saved=Join-Path $env:RUNNER_TEMP 'R55_GAME_RECOVERY_STATUS.json';Copy-Item $p $saved -Force
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin mwo-r55-process-stability;git reset --hard origin/mwo-r55-process-stability;Copy-Item $saved $p -Force;git add $p;git commit -m "Record exact R55 GAME recovery run $env:GITHUB_RUN_ID";git push origin HEAD:mwo-r55-process-stability
          Write-Host 'R55_EXACT_GAME_RECOVERY_GREEN'
