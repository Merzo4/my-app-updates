name: DIAG R49 CLEANUP
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diag-r49-cleanup.yml']
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Remove temporary R48/R49 diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch \
            optimizer/diag-r48-src \
            optimizer/diag-r48-source.txt \
            optimizer/R49_CI_STATUS.json \
            optimizer/R49_CI_STATUS_V2.json \
            optimizer/R49_CI_STATUS_V3.json \
            optimizer/R49_CI_STATUS_V4.json \
            optimizer/R49_CI_STATUS_V5.json \
            optimizer/R49_CI_STATUS_V6.json \
            optimizer/R49_CI_FAILURE.log \
            optimizer/scripts/r49_release_v2.ps1 \
            optimizer/scripts/r49_release_v3.ps1 \
            optimizer/scripts/r49_release_v4.ps1 \
            optimizer/scripts/r49_release_v5.ps1 \
            .github/workflows/diag-r48-source-snapshot.yml \
            .github/workflows/diag-r49-ci-monitor.yml \
            .github/workflows/diag-r49-ci-monitor-v2.yml \
            .github/workflows/diag-r49-ci-monitor-v3.yml \
            .github/workflows/diag-r49-ci-monitor-v4.yml \
            .github/workflows/diag-r49-ci-monitor-v5.yml \
            .github/workflows/diag-r49-ci-monitor-v6.yml \
            .github/workflows/diag-r49-cleanup.yml
          git commit -m 'Clean temporary R49 diagnostics after verified release'
          git push origin HEAD:merzo-windows-optimizer
