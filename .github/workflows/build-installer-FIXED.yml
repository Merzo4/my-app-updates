name: Build MerzoStream Standard Installer

on:
  workflow_dispatch:
  push:
    paths:
      - 'installer/**'
      - '.github/workflows/build-installer.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show installer project
        shell: pwsh
        run: |
          Write-Host "Repository: $env:GITHUB_REPOSITORY"
          Write-Host "Commit: $env:GITHUB_SHA"

          if (-not (Test-Path "installer\MerzoStreamSetup.iss")) {
            throw "installer\MerzoStreamSetup.iss was not found"
          }

          Write-Host ""
          Write-Host "Installer files:"
          Get-ChildItem "installer" -Recurse | Select-Object FullName

      - name: Install official Inno Setup 7.0.2
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $downloadUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-7_0_2/innosetup-7.0.2-x64.exe'
          $setupExe = Join-Path $env:RUNNER_TEMP 'innosetup-7.0.2-x64.exe'
          $innoDir = Join-Path $env:RUNNER_TEMP 'InnoSetup7'

          Write-Host "Downloading official Inno Setup 7.0.2..."
          Invoke-WebRequest -Uri $downloadUrl -OutFile $setupExe

          if (-not (Test-Path $setupExe)) {
            throw "Inno Setup installer was not downloaded"
          }

          Write-Host "Installing Inno Setup in portable mode..."
          $arguments = @(
            '/VERYSILENT',
            '/SUPPRESSMSGBOXES',
            '/NORESTART',
            '/SP-',
            '/PORTABLE=1',
            "/DIR=$innoDir"
          )

          $process = Start-Process `
            -FilePath $setupExe `
            -ArgumentList $arguments `
            -Wait `
            -PassThru

          if ($process.ExitCode -ne 0) {
            throw "Inno Setup installer returned exit code $($process.ExitCode)"
          }

          $iscc = Join-Path $innoDir 'ISCC.exe'

          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe not found at expected location. Searching..."
            $found = Get-ChildItem $innoDir -Recurse -Filter ISCC.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1

            if ($null -eq $found) {
              throw "ISCC.exe not found after Inno Setup installation"
            }

            $iscc = $found.FullName
          }

          Write-Host "ISCC: $iscc"
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compile MerzoStreamSetup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          Write-Host "Compiling installer\MerzoStreamSetup.iss..."
          & "$env:ISCC" "installer\MerzoStreamSetup.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compiler returned exit code $LASTEXITCODE"
          }

          $output = "installer\output\MerzoStreamSetup.exe"

          if (-not (Test-Path $output)) {
            throw "$output was not created"
          }

          $item = Get-Item $output
          Write-Host ""
          Write-Host "Build completed:"
          Write-Host "File: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"

          $hash = Get-FileHash $output -Algorithm SHA256
          Write-Host "SHA256: $($hash.Hash)"

          $hash.Hash.ToLowerInvariant() + "  MerzoStreamSetup.exe" |
            Set-Content "installer\output\MerzoStreamSetup.sha256" -Encoding ascii

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerzoStreamSetup
          path: |
            installer/output/MerzoStreamSetup.exe
            installer/output/MerzoStreamSetup.sha256
          if-no-files-found: error

      - name: Publish permanent installer release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_REPOSITORY

          gh release view installer-v1 --repo $repo *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create installer-v1 `
              --repo $repo `
              --prerelease `
              --title "MerzoStream Suite - Installer" `
              --notes "Standard Windows installer for MerzoStream Suite. Download MerzoStreamSetup.exe and run it."

            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create installer-v1 release"
            }
          }

          gh release upload installer-v1 `
            "installer/output/MerzoStreamSetup.exe" `
            "installer/output/MerzoStreamSetup.sha256" `
            --repo $repo `
            --clobber

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload installer assets"
          }

          Write-Host "installer-v1 published successfully."
