name: Verify MWO Public R54.1 to R54.2 OTA

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/verify-mwo-r54-1-to-r54-2-public-ota.yml'
      - 'optimizer/scripts/r54_2_public_ota_acceptance.ps1'
      - 'optimizer/scripts/r54_1_r54_download_probe.ps1'
      - 'optimizer/triggers/r54-2-public-ota.txt'

permissions:
  contents: write

concurrency:
  group: mwo-r54-1-to-r54-2-public-ota
  cancel-in-progress: true

jobs:
  acceptance:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run public R54.1 to R54.2 acceptance
        id: accept
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\optimizer\scripts\r54_2_public_ota_acceptance.ps1
      - name: Record public R54.1 to R54.2 acceptance status
        if: always()
        shell: pwsh
        run: |
          $status='optimizer/R54_2_PUBLIC_OTA_STATUS.json'
          $fresh=$false
          if(Test-Path $status){
            try{
              $current=Get-Content $status -Raw|ConvertFrom-Json
              $fresh=([long]$current.databaseId -eq [long]$env:GITHUB_RUN_ID -and
                $current.conclusion -eq 'success' -and
                $current.publicRelease -eq 'success' -and
                $current.r541Baseline -eq 'success' -and
                $current.r541UpdaterDownload -eq 'success' -and
                $current.r541ToR542Upgrade -eq 'success' -and
                $current.r542FileVersion -eq 'success' -and
                $current.r542Launch -eq 'success' -and
                $current.installedGameRecovery -eq 'success')
            }catch{}
          }
          if(!$fresh){
            @{
              conclusion='failure'
              createdAt=(Get-Date).ToUniversalTime().ToString('o')
              databaseId=[long]$env:GITHUB_RUN_ID
              headSha=$env:GITHUB_SHA
              acceptOutcome='${{ steps.accept.outcome }}'
              error='Public R54.1 to R54.2 OTA acceptance did not create a fresh fully-green status; inspect run log.'
            }|ConvertTo-Json -Compress|Set-Content $status -Encoding UTF8
          }
          $saved=Join-Path $env:RUNNER_TEMP 'R54_2_PUBLIC_OTA_STATUS.json'
          Copy-Item $status $saved -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $pushed=$false
          for($attempt=1;$attempt-le5 -and !$pushed;$attempt++){
            git fetch origin merzo-windows-optimizer
            git reset --hard origin/merzo-windows-optimizer
            Copy-Item $saved $status -Force
            git add $status
            git diff --cached --quiet
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            git commit -m "Record public R54.1 to R54.2 OTA run $env:GITHUB_RUN_ID"
            git push origin HEAD:merzo-windows-optimizer
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            Start-Sleep -Seconds $attempt
          }
          if(!$pushed){throw 'Could not persist R54.2 public OTA status after retries'}
          if('${{ steps.accept.outcome }}'-ne'success' -or !$fresh){exit 1}
