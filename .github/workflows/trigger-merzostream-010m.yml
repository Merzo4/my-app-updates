name: Trigger and monitor MerzoStream 0.1.0m release

# rerun: 4 — Streamer.bot viewer-name compiler collision fixed
on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-merzostream-010m.yml']

permissions:
  actions: write
  contents: write

jobs:
  trigger-monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Dispatch exact 0.1.0m SHA and capture result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"
          WORKFLOW="merzostream-010m-release.yml"
          BRANCH="merzostream-010m-release"
          TARGET_SHA=$(gh api "repos/$REPO/branches/$BRANCH" --jq '.commit.sha')
          echo "Target 0.1.0m SHA: $TARGET_SHA"
          gh workflow run "$WORKFLOW" --repo "$REPO" --ref "$BRANCH"
          echo "0.1.0m release dispatched"
          RUN_ID=""
          for n in $(seq 1 40); do
            RUN_ID=$(gh run list --repo "$REPO" --workflow "$WORKFLOW" --branch "$BRANCH" --event workflow_dispatch --limit 20 --json databaseId,headSha,createdAt --jq ".[] | select(.headSha == \"$TARGET_SHA\") | .databaseId" | head -n1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            printf '{"status":"monitor_error","targetSha":"%s","message":"exact release run not found"}\n' "$TARGET_SHA" > /tmp/010m-status.json
            : > /tmp/010m-last-failure.log
          else
            set +e
            gh run watch "$RUN_ID" --repo "$REPO" --exit-status --interval 5
            WATCH_RC=$?
            set -e
            gh run view "$RUN_ID" --repo "$REPO" --json databaseId,status,conclusion,headSha,url,workflowName > /tmp/010m-status.json
            if [ "$WATCH_RC" -ne 0 ]; then
              gh run view "$RUN_ID" --repo "$REPO" --log-failed > /tmp/010m-last-failure.log || true
            else
              : > /tmp/010m-last-failure.log
            fi
          fi
          upload_file() {
            local local_path="$1" repo_path="$2" msg="$3"
            local content sha
            content=$(base64 -w0 "$local_path")
            sha=$(gh api "repos/$REPO/contents/$repo_path?ref=main" --jq '.sha' 2>/dev/null || true)
            if [ -n "$sha" ]; then
              gh api --method PUT "repos/$REPO/contents/$repo_path" -f message="$msg" -f content="$content" -f branch=main -f sha="$sha" >/dev/null
            else
              gh api --method PUT "repos/$REPO/contents/$repo_path" -f message="$msg" -f content="$content" -f branch=main >/dev/null
            fi
          }
          upload_file /tmp/010m-status.json merzostream/ci/010m-ci-status.json "Record MerzoStream 0.1.0m CI status"
          upload_file /tmp/010m-last-failure.log merzostream/ci/010m-last-failure.log "Record MerzoStream 0.1.0m CI failure log"
          cat /tmp/010m-status.json
