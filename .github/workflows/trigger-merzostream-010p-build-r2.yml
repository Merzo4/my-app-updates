name: Build MerzoStream 0.1.0p cumulative release R2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/trigger-merzostream-010p-build-r2.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 70
    steps:
      - name: Checkout 0.1.0p source
        uses: actions/checkout@v4
        with:
          ref: merzostream-010p-release
          fetch-depth: 0

      - name: Capture source head
        shell: pwsh
        run: |
          $sourceHead=(git rev-parse HEAD).Trim()
          "SOURCE_HEAD=$sourceHead" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct 0.1.0o + apply 0.1.0p
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'merzostream-010p-r2-src'
          New-Item -ItemType Directory -Force $src | Out-Null
          "MERZO_SRC=$src" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:MERZO_SRC=$src
          python merzostream/ci/rebuild_010h.py
          if($LASTEXITCODE){throw '010h reconstruction failed'}
          & .\merzostream\ci\make_brand.ps1
          if($LASTEXITCODE){throw 'brand failed'}
          foreach($v in @('010i','010j','010k','010l','010m','010n')) { python "merzostream/ci/apply_$v.py"; if($LASTEXITCODE){throw "$v failed"} }
          python merzostream/ci/apply_010n_installer_r2.py
          if($LASTEXITCODE){throw 'installer R2 transform failed'}
          $proj="$src\src\MerzoStream.Setup\MerzoStream.Setup.csproj"
          $xml=Get-Content $proj -Raw
          if(-not $xml.Contains('WFO1000')) { $xml=$xml.Replace('<ApplicationManifest>app.manifest</ApplicationManifest>', '<ApplicationManifest>app.manifest</ApplicationManifest>' + "`r`n    <NoWarn>`$(NoWarn);WFO1000</NoWarn>"); Set-Content $proj $xml -Encoding utf8 }
          python merzostream/ci/apply_010n_installer_r3.py
          if($LASTEXITCODE){throw 'installer R3 transform failed'}
          python merzostream/ci/apply_010o.py
          if($LASTEXITCODE){throw '010o failed'}
          python merzostream/ci/apply_010p.py
          if($LASTEXITCODE){throw '010p failed'}

      - name: Contract checks
        shell: pwsh
        run: |
          $info=Get-Content "$env:MERZO_SRC\content\app_info.json" -Raw | ConvertFrom-Json
          if($info.version -ne '0.1.0p'){throw "Wrong version $($info.version)"}
          $hostSource=Get-Content "$env:MERZO_SRC\src\MerzoStream.Host\MainForm.cs" -Raw
          $backend=Get-Content "$env:MERZO_SRC\src\MerzoStream.Host\DotNetBackend.cs" -Raw
          $sb=Get-Content "$env:MERZO_SRC\src\MerzoStream.Foundation\Services\StreamerBotService.cs" -Raw
          $yt=Get-Content "$env:MERZO_SRC\src\MerzoStream.Host\YouTubeLiveChatService.cs" -Raw
          $vk=Get-Content "$env:MERZO_SRC\src\MerzoStream.Host\VkLiveService.cs" -Raw
          $vka=Get-Content "$env:MERZO_SRC\src\MerzoStream.Host\VkLiveAuthCoordinator.cs" -Raw
          $da=Get-Content "$env:MERZO_SRC\src\MerzoStream.Foundation\Services\DonationAlertsService.cs" -Raw
          $setup=Get-Content "$env:MERZO_SRC\src\MerzoStream.Setup\Program.cs" -Raw
          if(-not $hostSource.Contains('CoreWebView2Environment.CreateAsync(userDataFolder: webViewData)')){throw 'WebView2 regression'}
          if(-not $setup.Contains('SpecialFolder.ProgramFiles')){throw 'Program Files regression'}
          foreach($pair in @(@($backend,'chat_send'),@($sb,'SendMessage'),@($yt,'liveBroadcasts'),@($yt,'broadcastStatus=upcoming'),@($yt,'liveChat/messages'),@($vk,'public_video_stream/chat'),@($vk,'public-chat:'),@($vka,"localStorage.getItem('auth')"),@($da,'add-user'),@($da,'widget/alerts'))) { if(-not $pair[0].Contains($pair[1])){throw "Missing contract: $($pair[1])"} }
          if($backend.Contains('developer_gate')){throw 'developer_gate regression'}
          node --check "$env:MERZO_SRC\ui\web\app.js"
          if($LASTEXITCODE){throw 'app.js syntax failed'}
          node --check "$env:MERZO_SRC\ui\web\concept.js"
          if($LASTEXITCODE){throw 'concept.js syntax failed'}

      - name: Static selftest
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./SELFTEST_PURE_DOTNET_STATIC.ps1
          if($LASTEXITCODE){throw 'Static selftest failed'}

      - name: Compile full solution
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          dotnet restore MerzoStream.NetHost.sln
          if($LASTEXITCODE){throw 'restore failed'}
          dotnet build MerzoStream.NetHost.sln -c Release --no-restore
          if($LASTEXITCODE){throw 'build failed'}

      - name: Foundation selftest
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          dotnet run --project tools/MerzoStream.Foundation.SelfTest/MerzoStream.Foundation.SelfTest.csproj -c Release --no-restore
          if($LASTEXITCODE){throw 'Foundation selftest failed'}

      - name: Build runtime and dark installer
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./06_BUILD_RUNTIME_RELEASE.ps1 -Version '0.1.0p' -Runtime 'win-x64'
          if($LASTEXITCODE){throw 'runtime failed'}
          ./08_BUILD_BRANDED_SETUP.ps1 -Version '0.1.0p' -RuntimeZip 'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0p.zip'
          if($LASTEXITCODE){throw 'installer failed'}
          $exe='artifacts/branded-setup/MerzoStreamSuite_Setup.exe'
          if(-not(Test-Path $exe)){throw 'installer missing'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$exe.sha256" "$sha  MerzoStreamSuite_Setup.exe" -Encoding ascii
          Write-Host "INSTALLER SHA=$sha SIZE=$((Get-Item $exe).Length)"

      - name: Create source ZIP
        shell: pwsh
        run: |
          $dst=Join-Path $env:RUNNER_TEMP 'MerzoStreamSuite_0.1.0p_SOURCE.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'source-stage-p-r2'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Get-ChildItem $env:MERZO_SRC -Force | Where-Object { $_.Name -notin @('bin','obj','artifacts') } | ForEach-Object { Copy-Item $_.FullName $stage -Recurse -Force }
          Get-ChildItem $stage -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','artifacts') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath $dst -CompressionLevel Optimal -Force
          "SOURCE_ZIP=$dst" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerzoStreamSuite-0.1.0p-READY
          path: |
            ${{ env.MERZO_SRC }}/artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0p.zip
            ${{ env.MERZO_SRC }}/artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0p.sha256
            ${{ env.MERZO_SRC }}/artifacts/branded-setup/MerzoStreamSuite_Setup.exe
            ${{ env.MERZO_SRC }}/artifacts/branded-setup/MerzoStreamSuite_Setup.exe.sha256
            ${{ env.MERZO_SRC }}/RELEASE_NOTES_0.1.0p.md
            ${{ env.SOURCE_ZIP }}
          if-no-files-found: error

      - name: Publish release
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='v0.1.0p'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if($LASTEXITCODE -ne 0){gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:SOURCE_HEAD --title 'MerzoStream Suite 0.1.0p' --notes-file RELEASE_NOTES_0.1.0p.md}
          if($LASTEXITCODE){throw 'release create failed'}
          gh release upload $tag 'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0p.zip' 'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0p.sha256' 'artifacts/branded-setup/MerzoStreamSuite_Setup.exe' 'artifacts/branded-setup/MerzoStreamSuite_Setup.exe.sha256' $env:SOURCE_ZIP RELEASE_NOTES_0.1.0p.md --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE){throw 'release upload failed'}
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file RELEASE_NOTES_0.1.0p.md

      - name: Record R2 status
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $payload=[ordered]@{status='completed';conclusion=$env:JOB_STATUS;sourceHead=$env:SOURCE_HEAD;databaseId=$env:GITHUB_RUN_ID;url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"}|ConvertTo-Json -Compress
          $tmp=Join-Path $env:RUNNER_TEMP '010p-r2.json'; Set-Content $tmp $payload -Encoding utf8
          $b64=[Convert]::ToBase64String([IO.File]::ReadAllBytes($tmp)); $path='merzostream/ci/010p-r2-ci-status.json'
          $old=(gh api --method GET "repos/$env:GITHUB_REPOSITORY/contents/$path" -f ref=main --jq '.sha' 2>$null); if($LASTEXITCODE){$old=''}
          if($old){gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" -f message='Record 0.1.0p R2 CI status' -f content=$b64 -f branch=main -f sha=$old|Out-Null}else{gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" -f message='Record 0.1.0p R2 CI status' -f content=$b64 -f branch=main|Out-Null}
          Write-Host $payload
