name: Monitor R52 Window Test

on:
  push:
    branches: [mwo-r52-window-scroll-test]
    paths: ['.github/workflows/monitor-r52-window-test.yml']

permissions:
  contents: write
  actions: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Wait and record result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sleep 8
          id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mwo-r52-window-scroll-v3.yml --branch mwo-r52-window-scroll-test --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          [ -n "$id" ] || { echo 'test run not found'; exit 1; }
          for i in $(seq 1 100); do
            status=$(gh run view "$id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')
            [ "$status" = completed ] && break
            sleep 10
          done
          gh run view "$id" --repo "$GITHUB_REPOSITORY" --json databaseId,status,conclusion,headSha,createdAt,updatedAt,url > optimizer/R52_WINDOW_TEST_STATUS.json
          conclusion=$(jq -r '.conclusion' optimizer/R52_WINDOW_TEST_STATUS.json)
          if [ "$conclusion" != success ]; then
            gh run view "$id" --repo "$GITHUB_REPOSITORY" --log-failed > optimizer/R52_WINDOW_TEST_FAILED.log || true
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimizer/R52_WINDOW_TEST_STATUS.json optimizer/R52_WINDOW_TEST_FAILED.log 2>/dev/null || true
          git commit -m 'test: record R52 window/scroll result' || true
          git push
