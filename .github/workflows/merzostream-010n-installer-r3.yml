name: MerzoStream Suite 0.1.0n DARK Installer R3

on:
  push:
    branches: [merzostream-010n-installer-r2]
    paths:
      - '.github/workflows/merzostream-010n-installer-r3.yml'
      - 'merzostream/ci/apply_010n_installer_r3.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Reconstruct 0.1.0n
        shell: pwsh
        run: |
          $src=Join-Path $env:RUNNER_TEMP 'merzostream-010n-installer-r3-src'
          New-Item -ItemType Directory -Force $src | Out-Null
          "MERZO_SRC=$src" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $env:MERZO_SRC=$src
          python merzostream/ci/rebuild_010h.py
          if($LASTEXITCODE -ne 0){throw '0.1.0h reconstruction failed'}
          & .\merzostream\ci\make_brand.ps1
          if($LASTEXITCODE -ne 0){throw 'brand restore failed'}
          foreach($v in @('010i','010j','010k','010l','010m','010n')) {
            python "merzostream/ci/apply_$v.py"
            if($LASTEXITCODE -ne 0){throw "$v patch failed"}
          }

      - name: Apply dark installer R2 base
        shell: pwsh
        run: |
          python merzostream/ci/apply_010n_installer_r2.py
          if($LASTEXITCODE -ne 0){throw 'installer R2 transform failed'}
          $proj="$env:MERZO_SRC\src\MerzoStream.Setup\MerzoStream.Setup.csproj"
          $xml=Get-Content $proj -Raw
          if(-not $xml.Contains('WFO1000')) {
            $xml=$xml.Replace('<ApplicationManifest>app.manifest</ApplicationManifest>', '<ApplicationManifest>app.manifest</ApplicationManifest>' + "`r`n    <NoWarn>`$(NoWarn);WFO1000</NoWarn>")
            Set-Content $proj $xml -Encoding utf8
          }

      - name: Apply Program Files WebView2 R3 fix
        shell: pwsh
        run: |
          python merzostream/ci/apply_010n_installer_r3.py
          if($LASTEXITCODE -ne 0){throw 'installer R3 transform failed'}

      - name: Verify R3 contract
        shell: pwsh
        run: |
          $host=Get-Content "$env:MERZO_SRC\src\MerzoStream.Host\MainForm.cs" -Raw
          $setup=Get-Content "$env:MERZO_SRC\src\MerzoStream.Setup\Program.cs" -Raw
          $manifest=Get-Content "$env:MERZO_SRC\src\MerzoStream.Setup\app.manifest" -Raw
          if(-not $host.Contains('CoreWebView2Environment.CreateAsync(userDataFolder: webViewData)')){throw 'explicit WebView2 LocalAppData environment missing'}
          if(-not $host.Contains('Path.Combine(AppPaths.DataDirectory(), "WebView2")')){throw 'WebView2 LocalAppData path missing'}
          if($host.Contains('MessageBox.Show(ex.Message')){throw 'white startup MessageBox still present'}
          if(-not $host.Contains('ShowDarkStartupError')){throw 'dark startup error dialog missing'}
          if(-not $setup.Contains('SpecialFolder.ProgramFiles')){throw 'Program Files install missing'}
          if(-not $setup.Contains('WebView2BootstrapUrl')){throw 'WebView2 bootstrap missing'}
          if(-not $manifest.Contains('requireAdministrator')){throw 'UAC manifest missing'}
          Write-Host 'INSTALLER R3 CONTRACT PASS'

      - name: Static selftest
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./SELFTEST_PURE_DOTNET_STATIC.ps1
          if($LASTEXITCODE -ne 0){throw 'Static selftest failed'}

      - name: Restore and compile
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          dotnet restore MerzoStream.NetHost.sln
          if($LASTEXITCODE -ne 0){throw 'restore failed'}
          dotnet build MerzoStream.NetHost.sln -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'build failed'}

      - name: Foundation selftest
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          dotnet run --project tools/MerzoStream.Foundation.SelfTest/MerzoStream.Foundation.SelfTest.csproj -c Release --no-restore
          if($LASTEXITCODE -ne 0){throw 'Foundation selftest failed'}

      - name: Build runtime
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./06_BUILD_RUNTIME_RELEASE.ps1 -Version '0.1.0n' -Runtime 'win-x64'
          if($LASTEXITCODE -ne 0){throw 'runtime build failed'}

      - name: Build dark installer R3
        shell: pwsh
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          ./08_BUILD_BRANDED_SETUP.ps1 -Version '0.1.0n' -RuntimeZip 'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0n.zip'
          if($LASTEXITCODE -ne 0){throw 'installer build failed'}
          $exe='artifacts/branded-setup/MerzoStreamSuite_Setup.exe'
          if(-not(Test-Path $exe)){throw 'installer EXE missing'}
          $sha=(Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content "$exe.sha256" "$sha  MerzoStreamSuite_Setup.exe" -Encoding ascii
          Write-Host "DARK INSTALLER R3 PASS SHA=$sha SIZE=$((Get-Item $exe).Length)"

      - name: Create R3 source ZIP
        shell: pwsh
        run: |
          $dst=Join-Path $env:RUNNER_TEMP 'MerzoStreamSuite_0.1.0n_R3_SOURCE.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'source-stage-n-r3'
          New-Item -ItemType Directory -Force $stage | Out-Null
          Get-ChildItem $env:MERZO_SRC -Force | Where-Object { $_.Name -notin @('bin','obj','artifacts') } | ForEach-Object { Copy-Item $_.FullName $stage -Recurse -Force }
          Get-ChildItem $stage -Recurse -Directory | Where-Object { $_.Name -in @('bin','obj','artifacts') } | Sort-Object FullName -Descending | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$stage\*" -DestinationPath $dst -CompressionLevel Optimal -Force
          "SOURCE_ZIP=$dst" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload R3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerzoStreamSuite-0.1.0n-DARK-INSTALLER-R3-READY
          path: |
            ${{ env.MERZO_SRC }}/artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0n.zip
            ${{ env.MERZO_SRC }}/artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0n.sha256
            ${{ env.MERZO_SRC }}/artifacts/branded-setup/MerzoStreamSuite_Setup.exe
            ${{ env.MERZO_SRC }}/artifacts/branded-setup/MerzoStreamSuite_Setup.exe.sha256
            ${{ env.MERZO_SRC }}/RELEASE_NOTES_0.1.0n.md
            ${{ env.SOURCE_ZIP }}
          if-no-files-found: error

      - name: Replace v0.1.0n release assets with R3
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ env.MERZO_SRC }}
        run: |
          $tag='v0.1.0n'
          gh release upload $tag `
            'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0n.zip' `
            'artifacts/runtime-release/MerzoStreamSuite-runtime-win-x64-0.1.0n.sha256' `
            'artifacts/branded-setup/MerzoStreamSuite_Setup.exe' `
            'artifacts/branded-setup/MerzoStreamSuite_Setup.exe.sha256' `
            $env:SOURCE_ZIP RELEASE_NOTES_0.1.0n.md `
            --repo $env:GITHUB_REPOSITORY --clobber
          if($LASTEXITCODE -ne 0){throw 'release R3 upload failed'}
          gh release edit $tag --repo $env:GITHUB_REPOSITORY --notes-file RELEASE_NOTES_0.1.0n.md
          if($LASTEXITCODE -ne 0){throw 'release notes update failed'}

      - name: Record R3 result
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $payload=[ordered]@{status='completed';conclusion=$env:JOB_STATUS;headSha=$env:GITHUB_SHA;databaseId=$env:GITHUB_RUN_ID;url="https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"} | ConvertTo-Json -Compress
          $tmp=Join-Path $env:RUNNER_TEMP 'status.json'; Set-Content $tmp $payload -Encoding utf8
          $content=[Convert]::ToBase64String([IO.File]::ReadAllBytes($tmp))
          $path='merzostream/ci/010n-installer-r3-status.json'
          $sha=(gh api --method GET "repos/$env:GITHUB_REPOSITORY/contents/$path" -f ref=merzostream-010n-installer-r2 --jq '.sha' 2>$null)
          if($LASTEXITCODE -ne 0){$sha=''}
          if($sha){ gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" -f message='Record installer R3 CI status' -f content=$content -f branch=merzostream-010n-installer-r2 -f sha=$sha | Out-Null }
          else { gh api --method PUT "repos/$env:GITHUB_REPOSITORY/contents/$path" -f message='Record installer R3 CI status' -f content=$content -f branch=merzostream-010n-installer-r2 | Out-Null }
          Write-Host $payload
