name: Discover MWO R54.2 Restore API
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths:
      - '.github/workflows/discover-mwo-r54-2-restore-api.yml'
      - 'optimizer/scripts/r54_2_restore_api_discovery.ps1'
permissions:
  actions: read
  contents: read
jobs:
  discover:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.54.2-ONEDRIVE-GAME-RELIABILITY
          path: artifact
          run-id: 32270447478
          github-token: ${{ github.token }}
      - shell: pwsh
        run: .\optimizer\scripts\r54_2_restore_api_discovery.ps1 -ArtifactDir '.\artifact'
