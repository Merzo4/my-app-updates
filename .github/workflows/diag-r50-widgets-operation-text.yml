name: DIAG R50 widgets routing and operation UI

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diag-r50-widgets-operation-text.yml']

permissions:
  contents: write

jobs:
  diag:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Reconstruct exact R50 and write focused diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          .\optimizer\scripts\r50_release.ps1
          if([string]::IsNullOrWhiteSpace($env:SOURCE_ROOT)){throw 'SOURCE_ROOT missing'}
          $out='.\optimizer\R50_WIDGETS_OPERATION_DIAG.txt'
          "SOURCE_ROOT=$env:SOURCE_ROOT" | Set-Content $out -Encoding UTF8
          "`n=== WIDGETS MATCHES ===" | Add-Content $out
          Get-ChildItem $env:SOURCE_ROOT -Recurse -File -Include *.cs,*.xaml,*.json | Select-String -Pattern 'Widgets|widget|DisableWidgets|Отключить Widgets' -Context 8,12 | ForEach-Object { $_.ToString() } | Add-Content $out
          "`n=== OPERATION / HISTORY UI MATCHES ===" | Add-Content $out
          Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src') -Recurse -File -Include *.cs,*.xaml | Select-String -Pattern 'Ход работы|Ход событий|Operation|Progress|Journal|LogLines|CurrentStep|StatusText' -Context 5,10 | ForEach-Object { $_.ToString() } | Add-Content $out
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add $out
          git commit -m 'diag: record exact R50 widgets and operation source'
          git push
