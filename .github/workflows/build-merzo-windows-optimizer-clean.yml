name: Build Merzo Windows Optimizer R21 Clean

on:
  workflow_dispatch:
  push:
    branches:
      - merzo-windows-optimizer
    paths:
      - 'optimizer/source-min/**'
      - '.github/workflows/build-merzo-windows-optimizer-clean.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct and verify complete R21 source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem 'optimizer/source-min/R21.part*' | Sort-Object Name
          if ($parts.Count -ne 29) { throw "Expected 29 clean source parts, found $($parts.Count)." }
          $builder = [System.Text.StringBuilder]::new()
          foreach ($p in $parts) {
            $text = (Get-Content $p.FullName -Raw) -replace '\s', ''
            [void]$builder.Append($text)
          }
          $b64 = $builder.ToString()
          if ($b64.Length -ne 106428) { throw "Unexpected Base64 payload length: $($b64.Length)" }
          $bytes = [Convert]::FromBase64String($b64)
          $archive = Join-Path $PWD 'optimizer-r21.tar.xz'
          [IO.File]::WriteAllBytes($archive, $bytes)
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'ce9ca7f8f44464c42165e0a79f3053062dfbe2e0df6b0b8517d1ac7510070d2d') {
            throw "Clean source SHA-256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force -Path 'r21' | Out-Null
          tar -xf $archive -C 'r21'
          if ($LASTEXITCODE -ne 0) { throw 'R21 source extraction failed.' }
          $sln = Get-ChildItem 'r21' -Recurse -Filter 'MerzoWindowsOptimizer.sln' | Select-Object -First 1
          if (-not $sln) { throw 'MerzoWindowsOptimizer.sln not found.' }
          "SOURCE_ROOT=$($sln.Directory.FullName)" >> $env:GITHUB_ENV
          Write-Host "Verified source root: $($sln.Directory.FullName)"

      - name: Generate production application icon
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pillow
          if ($LASTEXITCODE -ne 0) { throw 'Unable to install Pillow.' }
          $script = @'
          from PIL import Image, ImageDraw
          from pathlib import Path
          root = Path(r"SOURCE_ROOT_PLACEHOLDER")
          out = root / "assets" / "MerzoWindowsOptimizer.ico"
          out.parent.mkdir(parents=True, exist_ok=True)
          s=256
          im=Image.new("RGBA",(s,s),(12,18,24,255))
          d=ImageDraw.Draw(im)
          teal=(79,216,195,255); dark=(20,31,41,255); white=(235,245,245,255)
          d.rounded_rectangle((14,14,242,242), radius=50, fill=dark, outline=teal, width=10)
          d.ellipse((45,45,211,211), outline=(47,103,103,255), width=5)
          # stylized M
          d.line((65,174,65,92,105,142,128,105,151,142,191,92,191,174), fill=white, width=16, joint="curve")
          # performance bolt
          d.polygon([(142,48),(118,104),(143,104),(126,151),(185,86),(154,86),(174,48)], fill=teal)
          im.save(out, format="ICO", sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print(out)
          '@
          $script = $script.Replace('SOURCE_ROOT_PLACEHOLDER', $env:SOURCE_ROOT.Replace('\','\\'))
          $script | Set-Content 'make_icon.py' -Encoding UTF8
          python make_icon.py
          if ($LASTEXITCODE -ne 0) { throw 'Icon generation failed.' }
          if (-not (Test-Path (Join-Path $env:SOURCE_ROOT 'assets\MerzoWindowsOptimizer.ico'))) { throw 'ICO missing.' }

      - name: Build, SelfTest, publish and protect internal assemblies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SOURCE_ROOT
          try {
            & .\build\Build-Production.ps1 -Version '0.1.21'
            if ($LASTEXITCODE -ne 0) { throw 'Build-Production failed.' }
          }
          finally { Pop-Location }
          $exe = Join-Path $env:SOURCE_ROOT 'dist\app\MerzoWindowsOptimizer.exe'
          if (-not (Test-Path $exe)) { throw 'Production EXE missing.' }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed.' }
          $iscc = @('C:\Program Files (x86)\Inno Setup 6\ISCC.exe','C:\Program Files\Inno Setup 6\ISCC.exe') | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found.' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Build full installer and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location $env:SOURCE_ROOT
          try {
            & $env:ISCC "/DMyAppVersion=0.1.21" '.\installer\MerzoWindowsOptimizer.iss'
            if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
            $setup = '.\dist\MerzoWindowsOptimizerSetup-win-x64.exe'
            $portable = '.\dist\MerzoWindowsOptimizer-portable-win-x64.zip'
            if (-not (Test-Path $setup)) { throw 'Setup asset missing.' }
            if (-not (Test-Path $portable)) { throw 'Portable asset missing.' }
            $setupHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
            $portableHash = (Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
            "$setupHash  MerzoWindowsOptimizerSetup-win-x64.exe" | Set-Content "$setup.sha256" -Encoding ascii
            "$portableHash  MerzoWindowsOptimizer-portable-win-x64.zip" | Set-Content "$portable.sha256" -Encoding ascii
            Write-Host "SETUP_SHA256=$setupHash"
            Write-Host "PORTABLE_SHA256=$portableHash"
          }
          finally { Pop-Location }

      - name: Upload CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.21-R21
          path: |
            r21/**/dist/MerzoWindowsOptimizerSetup-win-x64.exe
            r21/**/dist/MerzoWindowsOptimizerSetup-win-x64.exe.sha256
            r21/**/dist/MerzoWindowsOptimizer-portable-win-x64.zip
            r21/**/dist/MerzoWindowsOptimizer-portable-win-x64.zip.sha256
          if-no-files-found: error

      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $env:SOURCE_ROOT 'dist'
          $tag = 'mwo-v0.1.21'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Merzo Windows Optimizer 0.1.21 (R21)' --notes 'Production R21: scan-first optimization, LIGHT/STANDARD/MAXIMUM/LITE BUILD profiles, Snapshot/Undo, cleanup, startup, services/tasks, power, on-demand UAC helper, GitHub Update Center, self-contained Windows x64 installer and portable build.'
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          }
          gh release upload $tag `
            (Join-Path $dist 'MerzoWindowsOptimizerSetup-win-x64.exe') `
            (Join-Path $dist 'MerzoWindowsOptimizerSetup-win-x64.exe.sha256') `
            (Join-Path $dist 'MerzoWindowsOptimizer-portable-win-x64.zip') `
            (Join-Path $dist 'MerzoWindowsOptimizer-portable-win-x64.zip.sha256') `
            --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
