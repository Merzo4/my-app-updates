# R55.1 field-regression recovery pipeline: exact build + real-window launch gate.
name: Build MWO R55.1 Startup Binding Hotfix

on:
  workflow_dispatch:
  push:
    branches: [mwo-r55-1-startup-binding-hotfix]
    paths:
      - 'optimizer/patches/r55_1_startup_binding_hotfix.py'
      - 'optimizer/scripts/r55_1_startup_binding_hotfix_release.ps1'
      - 'optimizer/scripts/r55_process_stability_acceptance.ps1'
      - '.github/workflows/build-mwo-r55-1-startup-binding-hotfix.yml'

permissions:
  contents: write

jobs:
  build-and-accept:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Verify exact checkout
        shell: pwsh
        run: |
          $head=(git rev-parse HEAD).Trim().ToLowerInvariant()
          if($head-ne$env:GITHUB_SHA.ToLowerInvariant()){throw "R55.1 checkout mismatch $head != $env:GITHUB_SHA"}
          Write-Host "R55_1_EXACT_CHECKOUT_PASS head=$head"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build exact R55.1 and strong startup acceptance
        id: build
        shell: pwsh
        run: .\optimizer\scripts\r55_1_startup_binding_hotfix_release.ps1
      - name: Synthetic delayed-process acceptance
        id: delayed
        shell: pwsh
        run: .\optimizer\scripts\r55_process_stability_acceptance.ps1 -SourceRoot $env:R55_1_ROOT
      - name: Verify packaged identity and binding
        id: identity
        shell: pwsh
        run: |
          $root=$env:R55_1_ROOT
          if([string]::IsNullOrWhiteSpace($root)){throw 'R55_1_ROOT missing'}
          $dll=Join-Path $root 'dist\app\MerzoWindowsOptimizer.dll'
          $xaml=Join-Path $root 'src\MerzoOptimizer.App\MainWindow.xaml'
          $installer=Join-Path $root 'dist\MerzoWindowsOptimizerSetup-win-x64.exe'
          $portable=Join-Path $root 'dist\MerzoWindowsOptimizer-portable-win-x64.zip'
          foreach($p in @($dll,$xaml,$installer,$portable,"$installer.sha256","$portable.sha256")){if(!(Test-Path $p)){throw "R55.1 packaged file missing: $p"}}
          $ver=[Reflection.AssemblyName]::GetAssemblyName($dll).Version.ToString()
          if($ver-ne'0.1.55.1'){throw "R55.1 packaged version=$ver"}
          $x=Get-Content $xaml -Raw
          if(-not$x.Contains('Value="{Binding ProcessStabilityProgress, Mode=OneWay}"')){throw 'R55.1 packaged source OneWay missing'}
          if($x.Contains('Value="{Binding ProcessStabilityProgress}"')){throw 'R55.1 packaged source unsafe binding remains'}
          $ih=(Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $ph=(Get-FileHash $portable -Algorithm SHA256).Hash.ToLowerInvariant()
          if(((Get-Content "$installer.sha256" -Raw)-split '\s+')[0].ToLowerInvariant()-ne$ih){throw 'R55.1 installer sidecar mismatch'}
          if(((Get-Content "$portable.sha256" -Raw)-split '\s+')[0].ToLowerInvariant()-ne$ph){throw 'R55.1 portable sidecar mismatch'}
          "R55_1_INSTALLER_SHA=$ih" >> $env:GITHUB_ENV
          "R55_1_PORTABLE_SHA=$ph" >> $env:GITHUB_ENV
          Write-Host "R55_1_PACKAGED_IDENTITY_PASS version=$ver installer=$ih portable=$ph"
      - name: Stage exact candidate
        shell: pwsh
        run: |
          New-Item artifact -ItemType Directory -Force|Out-Null
          Copy-Item "$env:R55_1_ROOT\dist\MerzoWindowsOptimizerSetup-win-x64.exe*" artifact -Force
          Copy-Item "$env:R55_1_ROOT\dist\MerzoWindowsOptimizer-portable-win-x64.zip*" artifact -Force
      - name: Upload exact R55.1 candidate
        id: artifact
        uses: actions/upload-artifact@v4
        with:
          name: MerzoWindowsOptimizer-0.1.55.1-STARTUP-BINDING-HOTFIX
          path: artifact/*
          if-no-files-found: error
          retention-days: 14
      - name: Persist R55.1 CI status
        if: always()
        shell: pwsh
        run: |
          $ok=('${{ steps.build.outcome }}'-eq'success' -and '${{ steps.delayed.outcome }}'-eq'success' -and '${{ steps.identity.outcome }}'-eq'success' -and '${{ steps.artifact.outcome }}'-eq'success')
          $status=[ordered]@{
            conclusion=if($ok){'success'}else{'failure'}
            createdAt=(Get-Date).ToUniversalTime().ToString('o')
            databaseId=[long]$env:GITHUB_RUN_ID
            headSha=$env:GITHUB_SHA
            build='${{ steps.build.outcome }}'
            delayedProcessAcceptance='${{ steps.delayed.outcome }}'
            packagedIdentity='${{ steps.identity.outcome }}'
            artifactUpload='${{ steps.artifact.outcome }}'
            artifactId='${{ steps.artifact.outputs.artifact-id }}'
            artifactDigest='${{ steps.artifact.outputs.artifact-digest }}'
            artifactName='MerzoWindowsOptimizer-0.1.55.1-STARTUP-BINDING-HOTFIX'
            installerSha=$env:R55_1_INSTALLER_SHA
            portableSha=$env:R55_1_PORTABLE_SHA
            startupBinding='oneway'
            strongStartupGate='real-main-window-plus-no-crash-log'
          }
          $saved=Join-Path $env:RUNNER_TEMP 'R55_1_CI_STATUS.json'
          $status|ConvertTo-Json|Set-Content $saved -Encoding UTF8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $pushed=$false
          for($attempt=1;$attempt-le5 -and !$pushed;$attempt++){
            git fetch origin mwo-r55-1-startup-binding-hotfix
            git reset --hard origin/mwo-r55-1-startup-binding-hotfix
            Copy-Item $saved optimizer/R55_1_CI_STATUS.json -Force
            git add optimizer/R55_1_CI_STATUS.json
            git diff --cached --quiet
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            git commit -m "Record R55.1 CI run $env:GITHUB_RUN_ID"
            git push origin HEAD:mwo-r55-1-startup-binding-hotfix
            if($LASTEXITCODE-eq0){$pushed=$true;break}
            Start-Sleep -Seconds $attempt
          }
          if(!$pushed){throw 'Could not persist R55.1 CI status'}
          if(!$ok){throw 'R55.1 CI is not green'}
