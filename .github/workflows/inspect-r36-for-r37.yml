name: Inspect R36 for R37

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/inspect-r36-for-r37.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Restore source and apply through R36
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('inspect.tar.xz',[Convert]::FromBase64String($b.ToString()))
          New-Item -ItemType Directory -Force inspect|Out-Null; tar -xf inspect.tar.xz -C inspect
          $sln=Get-ChildItem inspect -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          $env:SOURCE_ROOT=$sln.Directory.FullName
          "SOURCE_ROOT=$env:SOURCE_ROOT">>$env:GITHUB_ENV
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py')){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}
      - name: Print R37 anchors
        shell: pwsh
        run: |
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          Write-Host '=== MESSAGEBOX REFERENCES ==='
          Get-ChildItem $env:SOURCE_ROOT\src -Recurse -Include *.cs | Select-String -Pattern 'MessageBox.Show|MessageBoxResult|MessageBoxButton|MessageBoxImage' | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f $_.Path,$_.LineNumber,$_.Line.Trim()) }
          Write-Host '=== OPERATION/PROFILE METHODS ==='
          $vm=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs';$a=Get-Content $vm
          foreach($pattern in @('ApplySelected','ApplyProfile','RunProfile','Stage2Progress','Stage2StatusText','OperationStep','Show','MessageBox')){
            $hits=Select-String -Path $vm -Pattern $pattern -SimpleMatch|Select-Object -First 20
            foreach($hit in $hits){Write-Host "===== $pattern @ $($hit.LineNumber) =====";$s=[Math]::Max(0,$hit.LineNumber-18);$e=[Math]::Min($a.Count-1,$hit.LineNumber+35);for($i=$s;$i-le$e;$i++){Write-Host (("{0:D05}: " -f ($i+1))+$a[$i])}}
          }
          Write-Host '=== MAINWINDOW NETWORK/GAMING/UPDATE TAB ANCHORS ==='
          $x=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml';$xa=Get-Content $x
          foreach($pattern in @('Repair / Network','Gaming / Developer','Обновления','TabItem','SelectedIndex')){
            $hits=Select-String -Path $x -Pattern $pattern -SimpleMatch|Select-Object -First 20
            foreach($hit in $hits){Write-Host "===== XAML $pattern @ $($hit.LineNumber) =====";$s=[Math]::Max(0,$hit.LineNumber-15);$e=[Math]::Min($xa.Count-1,$hit.LineNumber+45);for($i=$s;$i-le$e;$i++){Write-Host (("{0:D05}: " -f ($i+1))+$xa[$i])}}
          }
          Write-Host '=== APP STARTUP / SERVICES ==='
          $app=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\App.xaml.cs';$aa=Get-Content $app
          foreach($pattern in @('MainWindowViewModel','new MainWindow','InitializeAsync','IUpdateService')){
            $hits=Select-String -Path $app -Pattern $pattern -SimpleMatch|Select-Object -First 12
            foreach($hit in $hits){Write-Host "===== APP $pattern @ $($hit.LineNumber) =====";$s=[Math]::Max(0,$hit.LineNumber-20);$e=[Math]::Min($aa.Count-1,$hit.LineNumber+35);for($i=$s;$i-le$e;$i++){Write-Host (("{0:D05}: " -f ($i+1))+$aa[$i])}}
          }
