name: Inspect R36 for R37

on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/inspect-r36-for-r37.yml']

permissions:
  contents: read

jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Restore source and apply through R36
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('inspect.tar.xz',[Convert]::FromBase64String($b.ToString()))
          New-Item -ItemType Directory -Force inspect|Out-Null; tar -xf inspect.tar.xz -C inspect
          $sln=Get-ChildItem inspect -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          $env:SOURCE_ROOT=$sln.Directory.FullName
          "SOURCE_ROOT=$env:SOURCE_ROOT">>$env:GITHUB_ENV
          foreach($p in @('r24_update_center.py','r24_compile_fix.py','r26_ota_repair.py','r27_privacy_engine.py','r28_profiles_updates_cleanup_ux.py','r29_operation_center.py','r29_compile_fix.py','r30_major_update.py','r30_policy_fix.py','r31_audit_memory.py','r32_performance_engine.py','r33_stability_hotfix.py','r34_ultra_process_feedback.py','r34_task_extension.py','r35_readability_ui.py','r36_gaming_ui_polish.py')){python (Join-Path 'optimizer/patches' $p);if($LASTEXITCODE-ne0){throw "Patch failed $p"}}
      - name: Print helper and UI anchors only
        shell: pwsh
        run: |
          [Console]::OutputEncoding=[Text.Encoding]::UTF8
          Write-Host '=== HELPER FILES ==='
          Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.ElevatedHelper') -Recurse -Include *.cs | ForEach-Object { Write-Host "===== $($_.Name) ====="; Get-Content $_.FullName }
          Write-Host '=== HELPER CLIENT REFERENCES ==='
          Get-ChildItem (Join-Path $env:SOURCE_ROOT 'src') -Recurse -Include *.cs | Select-String -Pattern 'ElevatedHelper|ProcessStartInfo|Verb = "runas"|Verb="runas"' | Select-Object -First 80 | ForEach-Object { Write-Host ("{0}:{1}: {2}" -f (Split-Path $_.Path -Leaf),$_.LineNumber,$_.Line.Trim()) }
          Write-Host '=== MAINWINDOW NAV HANDLERS ==='
          $mw=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml.cs';Select-String -Path $mw -Pattern 'MainTabs.SelectedIndex|private void .*_Click' | ForEach-Object {Write-Host ("{0}: {1}" -f $_.LineNumber,$_.Line.Trim())}
          Write-Host '=== APPLY METHOD 680-880 ==='
          $vm=Get-Content (Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs');for($i=679;$i-lt[math]::Min(880,$vm.Count);$i++){Write-Host (("{0:D05}: " -f ($i+1))+$vm[$i])}
          Write-Host '=== HOD RABOTY XAML ==='
          $x=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml';$xa=Get-Content $x;$hit=Select-String -Path $x -Pattern 'Ход работы' -SimpleMatch|Select-Object -First 1;if($hit){$s=[Math]::Max(0,$hit.LineNumber-20);$e=[Math]::Min($xa.Count-1,$hit.LineNumber+150);for($i=$s;$i-le$e;$i++){Write-Host (("{0:D05}: " -f ($i+1))+$xa[$i])}}
