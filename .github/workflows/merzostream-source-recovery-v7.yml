name: MerzoStream R17 Source Recovery V7

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/merzostream-source-recovery-v7.yml']
permissions:
  contents: read
env:
  SOURCE_SHA256: d79b349825d817680477a1af849c4508efd3f1e6baf818c774239f1db11ef42e
  SNAPSHOT_COMMIT: 65895b85afaae8f06252190c29a3f9e848e4b41c
jobs:
  recover:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Recover exact bytes
        shell: pwsh
        run: |
          $py=@'
          import base64,hashlib,subprocess,os,pathlib
          c=os.environ['SNAPSHOT_COMMIT'];target=os.environ['SOURCE_SHA256']
          def gs(p):return subprocess.check_output(['git','show',f'{c}:{p}'],text=True).replace('\n','').replace('\r','').strip()
          def rd(p):return pathlib.Path(p).read_text(encoding='utf-8').replace('\n','').replace('\r','').strip()
          parts={i:gs(f'merzostream/ci/r17-zip/part{i:02d}.b64') for i in range(16)}
          exact={16:rd('merzostream/ci/r17-exact/chunk16.txt'),17:rd('merzostream/ci/r17-exact/chunk17.txt'),24:rd('merzostream/ci/r17-exact/chunk24.txt'),25:rd('merzostream/ci/r17-exact/chunk25.txt')}
          pref=[]
          for i in range(15):
              x=(exact[16]+exact[17]) if i==8 else ((exact[24]+exact[25]) if i==12 else parts[i][:20000])
              assert len(x)==20000,(i,len(x));pref.append(x)
          pb=base64.b64decode(''.join(pref),validate=True);assert len(pb)==225000
          raw=base64.b64decode(parts[15],validate=True);print('decoded tail pool',len(raw))
          need=44574; extra=len(raw)-need;print('need',need,'extra',extra)
          found=None
          # Case 1: exact tail is contiguous.
          for off in range(len(raw)-need+1):
              tail=raw[off:off+need]
              if hashlib.sha256(pb+tail).hexdigest()==target:found=pb+tail;print('contiguous',off);break
          # Case 2: one duplicated/inserted byte block must be removed.
          if found is None and extra>0:
              for off in range(len(raw)-extra+1):
                  tail=raw[:off]+raw[off+extra:]
                  if hashlib.sha256(pb+tail).hexdigest()==target:found=pb+tail;print('delete block',off,extra);break
          if found is None:raise SystemExit('tail recovery failed')
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'MerzoStreamSuite_R17_SOURCE.zip';out.write_bytes(found)
          print('RECOVERY PASS',len(found),hashlib.sha256(found).hexdigest())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf8') as f:f.write(f'SOURCE_ZIP={out}\n')
          '@
          $p=Join-Path $env:RUNNER_TEMP 'r.py';Set-Content $p $py -Encoding UTF8;python $p
          if($LASTEXITCODE -ne 0){throw 'R17 byte recovery failed'}
      - name: Validate ZIP
        shell: pwsh
        run: |
          $d=Join-Path $env:RUNNER_TEMP src;Expand-Archive $env:SOURCE_ZIP $d -Force
          $b=Get-ChildItem $d -Recurse -Filter 06_BUILD_RUNTIME_RELEASE.ps1 -File|Select-Object -First 1
          if(-not $b){throw 'builder missing'}
          Write-Host "VALIDATION PASS $($b.Directory.FullName)"
