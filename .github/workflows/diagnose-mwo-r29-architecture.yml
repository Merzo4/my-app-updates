name: Diagnose MWO R29 architecture
on:
  workflow_dispatch:
  push:
    branches: [merzo-windows-optimizer]
    paths: ['.github/workflows/diagnose-mwo-r29-architecture.yml']
permissions: { contents: read }
jobs:
  inspect:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.13' }
      - name: Restore and patch through R28
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parts=Get-ChildItem 'optimizer/source-min/R21.part*'|Sort-Object Name
          $b=[Text.StringBuilder]::new();foreach($p in $parts){[void]$b.Append(((Get-Content $p.FullName -Raw)-replace '\s',''))}
          [IO.File]::WriteAllBytes('r29diag.tar.xz',[Convert]::FromBase64String($b.ToString()))
          New-Item -ItemType Directory -Force r29diag|Out-Null;tar -xf r29diag.tar.xz -C r29diag
          $sln=Get-ChildItem r29diag -Recurse -Filter MerzoWindowsOptimizer.sln|Select-Object -First 1
          if(-not$sln){throw 'Solution missing'}
          $env:SOURCE_ROOT=$sln.Directory.FullName
          "SOURCE_ROOT=$env:SOURCE_ROOT">>$env:GITHUB_ENV
          $f=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.SelfTest\Program.cs';$s=Get-Content $f -Raw
          $s=$s.Replace('SCAN FIRST + LITE BUILD SelfTest R20','PRODUCTION R29 DIAG SelfTest').Replace('"releases/latest", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"','"releases?per_page=50", "digest", "sha256:", "SHA256.HashDataAsync", "FixedTimeEquals"')
          $old='if (!string.IsNullOrWhiteSpace(owner) || !string.IsNullOrWhiteSpace(repo)) failures.Add("Release feed should remain intentionally unconfigured in transferable DEV package.");'
          $new='var prefix = root.TryGetProperty("release_tag_prefix", out var prefixEl) ? prefixEl.GetString() : null; var assetName = root.TryGetProperty("asset_name_contains", out var assetEl) ? assetEl.GetString() : null; if (!string.Equals(owner, "Merzo4", StringComparison.Ordinal) || !string.Equals(repo, "my-app-updates", StringComparison.Ordinal)) failures.Add("Production release feed must be Merzo4/my-app-updates."); if (!string.Equals(prefix, "mwo-v", StringComparison.Ordinal)) failures.Add("Production release tag prefix must be mwo-v."); if (!string.Equals(assetName, "MerzoWindowsOptimizerSetup-win-x64.exe", StringComparison.Ordinal)) failures.Add("Production installer asset name is incorrect.");'
          if($s.Contains($old)){$s=$s.Replace($old,$new)};Set-Content $f $s -Encoding UTF8
          python optimizer/patches/r24_update_center.py;if($LASTEXITCODE-ne 0){throw 'R24 updater failed'}
          python optimizer/patches/r24_compile_fix.py;if($LASTEXITCODE-ne 0){throw 'R24 compile failed'}
          python optimizer/patches/r26_ota_repair.py;if($LASTEXITCODE-ne 0){throw 'R26 failed'}
          python optimizer/patches/r27_privacy_engine.py;if($LASTEXITCODE-ne 0){throw 'R27 failed'}
          python optimizer/patches/r28_patch_compat.py;if($LASTEXITCODE-ne 0){throw 'R28 compat failed'}
          python optimizer/patches/r28_profiles_updates_cleanup_ux.py;if($LASTEXITCODE-ne 0){throw 'R28 failed'}
      - name: Print R29-relevant source snippets
        shell: pwsh
        run: |
          $vm=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\ViewModels\MainWindowViewModel.cs'
          $x=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.App\MainWindow.xaml'
          $core=Join-Path $env:SOURCE_ROOT 'src\MerzoOptimizer.Windows'
          Write-Host '=== COMMANDS / BUSY / SCAN ==='
          Select-String -Path $vm -Pattern 'DeepScan|RefreshStage2StateAsync|IsStage2Busy|RefreshCleanup|CleanSelected|CleanCategoryAsync|ApplySelectedTweaksAsync|AsyncRelayCommand' -Context 2,4 | ForEach-Object { $_.ToString() }
          Write-Host '=== CLEANUP SERVICE ==='
          Get-ChildItem $core -Recurse -Filter *.cs | Select-String -Pattern 'class Cleanup|CleanAsync|Backup|ZipArchive|CleanupResult|CleanupCategory' -Context 2,5 | ForEach-Object { $_.ToString() }
          Write-Host '=== POWERSHELL / PROCESS ==='
          Get-ChildItem $core -Recurse -Filter *.cs | Select-String -Pattern 'PowerShell|ProcessStartInfo|WaitForExitAsync|Win32_Process|schtasks|Get-AppxPackage' -Context 2,5 | ForEach-Object { $_.ToString() }
          Write-Host '=== AUDIT DRIVES XAML ==='
          Select-String -Path $x -Pattern 'Накопители|Total|Free|Drive|Свободно|Аудит системы' -Context 2,6 | ForEach-Object { $_.ToString() }
